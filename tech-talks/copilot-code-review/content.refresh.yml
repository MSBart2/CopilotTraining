    - ledgerEventId: "c1edd61c12df50a0"
      title: "Copilot code review effort levels are generally available"
      published: "2026-08-07"
      source: "https://github.blog/changelog/2026-08-07-copilot-code-review-effort-levels-are-generally-available"
      verified: "2026-08-10"
      releaseStatus: ga
      importance: headline
      targetSection: "Configuration and Quick Start"
      action: add
      summary: >
        Reviewers can choose Lite for routine changes and Balanced for larger,
        complex, or sensitive changes. Organization administrators can set a
        default inherited by repositories without their own setting, while a
        per-review choice affects only that review. Timeline events and the pull
        request overview identify the effort used.
      limitations:
        - "Low and Medium preview settings carry forward as Lite and Balanced."
        - "Lite and Balanced are available on Copilot Pro, Pro+, Max, Business, and Enterprise plans."
