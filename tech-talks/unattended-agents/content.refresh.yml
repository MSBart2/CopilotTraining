  revisionNote: >
    Presenter chose to keep the current approach (Copilot Automations trigger,
    shared-state file, three topologies, production controls, security-advisory
    pipeline) and fix only the claims that are false or overstated. The
    structural gh-aw rebuild proposal (2026-10-21) is withdrawn and preserved
    outside the repo as a session artifact.
    2026-10-22 follow-up: presenter chose a local-only loop. The trigger is a
    manual kickoff or Copilot CLI /every; all Copilot cloud agent Automation
    and GitHub Actions trigger content is removed, because a file-based state
    store does not persist across cloud runs (each run starts from the default
    branch) and Automations run a prompt rather than a selected custom agent.
  rationale: >
    No feed items routed to this talk since 2026-09-16. A named-talk accuracy
    check found claims a practitioner cannot reproduce as written: invalid
    custom-agent tool names, blueprint YAML and Python presented as runnable,
    an illustrative 18-minute timeline presented as an observed result,
    unsourced use-case metrics, a name collision with GitHub Agentic Workflows,
    and urgency/deficit framing. Every fix fits the existing narrative and
    section order, so the recipe and deck are patched in place.
  userEmphasis:
