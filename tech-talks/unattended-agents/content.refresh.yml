        max_cost_usd is a design intent the orchestrator must enforce itself.
      recipeImpact: none
      slideImpact: patch

    - title: "Shared-state file caveats"
      source: "https://docs.github.com/en/copilot/how-tos/use-copilot-agents/cloud-agent/create-automations"
      verified: "2026-10-21"
      releaseStatus: "ga"
      importance: supporting
      targetSection: "How It Works; Agent-to-Agent Communication"
      action: update
      summary: >
        Keep loop-state.json as the teaching model. Add the operating
        constraints: cloud-agent writes land on a PR branch rather than the
        default branch, and concurrent runs can conflict, so serialize runs
        and verify state against the repository at the start of each run.
        Cross-link agentic-lifecycle for platform-managed memory and limits.
      recipeImpact: none
      slideImpact: patch

    - title: "Security-advisory walkthrough labeled illustrative"
      source: "https://docs.github.com/en/actions/reference/workflows-and-actions/events-that-trigger-workflows"
      verified: "2026-10-22"
      releaseStatus: "n/a"
      importance: supporting
      targetSection: "Wiring It All Together: Runtime Walkthrough"
      action: update
      summary: >
        Keep the walkthrough and the 18-minute timeline as the talk's anchor,
        labeled as an illustrative design walkthrough, not an observed run.
        Replace the `security_advisory.published` trigger with a trigger a
        repository workflow can receive (for example a schedule or
        workflow_dispatch that checks new Dependabot alerts), or state that
        the webhook needs an app or relay to start the loop. Change
        "Total human time: 0 minutes" so the human merge stays visible.
      recipeImpact: confirm
      slideImpact: patch

    - title: "Copilot CLI /every as the loop trigger (replaces Automations)"
      source: "https://docs.github.com/en/copilot/reference/copilot-cli-reference/cli-command-reference"
      verified: "2026-10-22"
      releaseStatus: "experimental"
      importance: supporting
      targetSection: "The Trigger: What Makes It Loopy; Simplest Starting Point"
      action: replace
      summary: >
        Trigger is a manual kickoff (copilot --agent=loop-orchestrator, one
        prompt) or /every <interval> <prompt> inside the session; /after for a
        one-time run; bare /every opens the schedule manager. Experimental and
        session-scoped. Tool scope via --allow-tool / --deny-tool (deny wins).
        Removed: Copilot cloud agent Automations, Actions schedule /
        workflow_dispatch / repository_dispatch triggers.
      recipeImpact: confirm
      slideImpact: patch

