      summary: >
        Keep loop-anatomy.yml, loop-topology.yml, copilot-loop-pipeline.yml,
        the CircuitBreaker class, and loop-audit.sh as design blueprints. Add a
        one-line label to each stating what it is (a design spec to adapt,
        not a file any Copilot surface reads) and name where each control can
        actually be enforced today: Actions timeout-minutes and concurrency,
        branch protection and required review, and the gh-aw limits taught in
