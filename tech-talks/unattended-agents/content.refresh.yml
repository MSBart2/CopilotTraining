  resolved:
    - "Tool aliases (verified 2026-10-22, custom-agents-configuration): read, edit, search, execute, agent (invokes a different custom agent; cloud agent maps it to custom-agent tools), github/*. web and todo are not applicable to cloud agent."
    - "No Actions workflow event fires on a published security advisory (events-that-trigger-workflows, verified 2026-10-22). Superseded by the local-only pivot: the orchestrator polls Dependabot alerts with gh api on each /every pass."
    - "Production controls regrouped by enforcer (2026-10-22): agents cannot read their own token use, so per-agent token budgets and max_cost_usd are removed. Spend cap is /goal --max-ai-credits N (CLI reference, verified 2026-10-22). The watchdog is the next pass's stale-lock check, which now escalates (stale_run) instead of taking over. Untested: /every scheduling /goal."
    - "loop-audit removed (2026-10-22): loop-audit.sh always reported PASS (eval of yq exits 0 on false) and audited an unexecuted blueprint schema; the loop-engineering CLI is now @cobusgreyling/loop init/doctor/cost and lists no Copilot tool. Replaced with an evidence checklist; deck slide 17 deleted."
