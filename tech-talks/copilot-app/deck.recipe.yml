  # Cross-cutting generator directives that do not belong to a single section.
  generatorNotes:
    sortingHat: >
      The VS Code Agent Mode vs. Copilot App comparison table (six-row table from
      the README: Best For, Session Count, Environment, Automation, Dashboard, Setup)
      is integrated as the second half of S1 Slide 1, combined with the serial
      bottleneck as a before/after structure. This is NOT a standalone pre-TOC slide
      and NOT a separate S1 slide. Rationale: the senior engineer audience does not
      need a self-selection prompt; they need the comparison to land against the
      bottleneck they just felt, not cold. Four slides total for S1 — the bottleneck
      and sorting hat share slide 1 by design.
    decisionTree: >
      The README decision tree ("Q: How many independent tasks? One → VS Code agent
      mode is sufficient; Two or more → Copilot App for parallel fleet management")
      must appear as the closing bridge slide of S1 (Slide 4), framed as "When to
      reach for the fleet model." It must not appear in an appendix or be buried in a
      speaker note. It provides the practical decision rule after the paradigm-shift
      reveal and primes the audience for S2's trust question.
    policyThread: >
      All EM policy and audit content is consolidated into exactly one callout block
      on the S3 mode overview slide (Control Surfaces, Slide 1). It must not appear
      as a standalone slide in S2 and must not be split across sections. Three bullets:
      (1) environment policy — org admins configure which sandbox types agents can use;
      (2) merge policy — controls Agent Merge eligibility per repo and user;
      (3) audit log — every agent action recorded with session ID, dispatching user,
      and timestamp for retroactive compliance review. One block, one slide, one moment.
    pullTheHandbrake: >
      "Pull the handbrake" is the named on-slide safety-net beat on S3 Slide 3 (Canvas
      anatomy). The exact phrase must appear in the slide body, not only in speaker notes:
      "In Autopilot, the Canvas lets you shift to Interactive mid-session — pull the
      handbrake without canceling the worktree." Do not soften to "escalate" or "switch."
      This is the single insight that makes Autopilot feel safe enough to try for a
      risk-conscious senior engineer, and it must be a visible on-slide element.
    issueQuality: >
      "Issue quality = agent quality" is the named on-slide pull-quote on S3 Slide 4
      (issue brief). The exact phrase must appear as a visible pull-quote element, not
      only in speaker notes. The issue-brief-template.md structure (Objective / Acceptance
      Criteria / Scope / Autonomy Mode) is take-home artifact #2. Three minutes of upfront
      investment in the brief is the upstream determinant of output quality — land this
      before the audience assumes the agent can infer intent from a two-sentence issue.
    whatBreaksPlacement: >
      "What Breaks" belongs as S3 Slide 5 (the final slide of Control Surfaces), NOT as
      an S4 bridge slide. Rationale: the three failure modes are the natural consequence
      of not using the controls demonstrated in S3 Slides 1–4, so they close the control
      surfaces discussion with causal clarity. Placing them at the end of S3 means S4
      opens directly on the CVE payoff without needing to rebuild credibility. Three
      bullets, no prose, no framing slide — one compact closure beat.
    mcpIntegration: >
      MCP tool integration appears as a one-line callout on S3 Slide 3 (Canvas anatomy):
      "Agents access external tools and services via Model Context Protocol." This preempts
      the "can agents call external APIs?" question without opening a full MCP discussion.
      Deep treatment belongs in the mcp-apps tech talk.

