version: 1

deck:
  title: "The GitHub Copilot App: Running a Fleet of Agents"
  subtitle: "How do we run five agents in parallel on our backlog without losing control of the codebase?"
  tagline: "From one Copilot collaborator to a fleet of autonomous agents — managed from one place"

  # arcToc: displayed as TocSlide subtitle. One line, ≤ 80 chars.
  arcToc: "Fleet Model → Trust by Design → Control Surfaces → Sessions to Systems"

  # arcNarrative: prose rationale explaining the section sequencing logic.
  # Used by the generator as authoring guidance; never displayed on a slide.
  arcNarrative: >
    The talk is structured on the Trust Ladder: four sections, each answering one
    escalating trust question a skeptical senior engineer carries into the room.
    S1 ("What is this?") earns its high allocation by naming the serial bottleneck
    first — problem before product — then resolving the VS Code vs. Copilot App
    objection on the same slide as a before/after, so the sorting-hat comparison
    lands against a felt constraint rather than cold. Combining bottleneck and
    comparison into one slide condenses S1 to four slides without losing any
    conceptual beat; the dispatch table and decision tree still get dedicated slides.
    S2 ("Is it safe?") makes a single trust deposit: the Trust by Design proof,
    three columns (worktree / sandbox / policy), earned confidence without mechanical
    depth. One slide. S3 ("How much control do I keep?") is the centerpiece: the
    autonomy dial anchors it, Canvas escalation is named on-slide as the handbrake
    that makes Autopilot worth trying, and issue quality is named as the upstream
    determinant of output quality. All Engineering Manager policy content — environment
    type, Agent Merge eligibility, audit log — is consolidated into one callout on S3
    Slide 1, never split across sections. S3 closes on the "What Breaks" slide: three
    honest failure modes that are the natural consequence of not using the controls
    just demonstrated, so the audience reaches S4 with eyes open, not oversold. S4
    ("What does done look like at scale?") opens directly on the payoff — the CVE
    anchor, Plan mode on a high-stakes task — before the workflow anatomy and Agent
    Merge lifecycle, and closes with the What-You-Can-Do-Today tiers as the action
    artifact that turns the talk into a Monday plan.

  # Ordered list of the 4 section names (match sectionModes keys and README ## headings).
  sectionOrder:
    - "The Fleet Model"
    - "Safe Parallelism"
    - "Control Surfaces"
    - "Sessions to Systems"

  # Per-section editorial guidance for the slide generator.
  sectionModes:
    "The Fleet Model":
      # high = 4 slides (bottleneck + sorting hat combined as slide 1 before/after)
      emphasis: high
      note: >
        Open with the serial bottleneck combined with the VS Code vs. Copilot App
        comparison as one before/after slide — problem and fork, together. Do NOT
        open with the dashboard; the paradigm shift only lands once the audience
        has felt the constraint. Slide heading: "Already using Copilot in VS Code?
        Here's the fork." Table rows: Best For, Session Count, Environment,
        Automation, Dashboard, Setup. Delivery: 90 seconds; this is a self-read
        table for this audience, not a line-by-line walkthrough. Combining bottleneck
        and sorting hat into one slide is intentional — it is the constraint and the
        answer on one visual, not two separate beats.
        Slide 2: My Work dashboard — introduce as the coordinator view, not a UI
        tour. One sentence per element. The must-land insight: the developer's role
        shifts from executor to coordinator.
        Slide 3: Dispatch table (the four-agent Monday morning example) on its own
        dedicated slide — this is the "whoa" moment; give it room. No prose. The
        table is the point.
        Slide 4: Decision tree close (VS Code vs. Copilot App branching logic from
        the README) — answers "when do I reach for the fleet model?" and bridges
        naturally to S2's trust question. Frame it as "When to reach for the fleet
        model." Four slides total for S1 — no more.

    "Safe Parallelism":
      # low = 1–2 slides
      emphasis: low
      note: >
        One dedicated "Trust by Design" slide structured as 3 columns:
        (1) Worktree isolation — one branch, one directory per agent, no collision
        possible by construction, not by coordination;
        (2) Sandbox containment — cloud vs. local runtimes, bounded execution scope,
        no lateral movement between worktrees;
        (3) Policy control — org admins configure permitted sandbox types, Agent Merge
        eligibility, and audit scope before any agent touches the repo.
        A second slide may show the worktree-init.sh script as a visual callout (not
        a line-by-line walkthrough) if time allows. Do NOT add a standalone policy
        slide here — all EM policy content is consolidated in S3 Slide 1's mode
        overview callout. Total: 1–2 slides. The goal is a single trust deposit, not
        technical depth.

    "Control Surfaces":
      # high = 5 slides (slide 5 is "What Breaks" — closes S3 before handing off to S4)
      emphasis: high
      note: >
        Peak engagement — allocate 5 slides and hold the room here.
        Slide 1: Three-mode spectrum (Interactive → Plan → Autopilot). "Autonomy is
        a dial, not a switch" must appear as an on-slide pull-quote, not just a
        speaker note. Include the consolidated EM policy callout on this slide:
        three bullets — (1) environment policy: org admins configure permitted sandbox
        types; (2) merge policy: controls Agent Merge eligibility per repo and user;
        (3) audit log: every agent action recorded with session ID, dispatching user,
        and timestamp. One callout block, never scattered across sections.
        Slide 2: Mode selection quick-reference table from autonomy-mode-guide.md
        — take-home artifact #1. Include the CVE / security-fix row explicitly
        (Plan mode, high blast radius) to connect to S4.
        Slide 3: Canvas anatomy — what a Canvas contains and why it is not a chat
        window. MUST name Canvas escalation on-slide with the exact phrase:
        "In Autopilot, the Canvas lets you shift to Interactive mid-session —
        pull the handbrake without canceling the worktree." This is the safety net
        that makes Autopilot feel safe to try; frame it as the escape hatch, not an
        edge case. MCP tool access appears as a one-line callout here: "Agents access
        external tools and services via Model Context Protocol."
        Slide 4: Issue-brief-template.md as take-home artifact #2. "Issue quality =
        agent quality" must appear as an on-slide pull-quote — not a speaker hint.
        Show the Objective / Acceptance Criteria / Scope / Autonomy Mode structure.
        Slide 5: "What Breaks" — one slide, no prose, exactly 3 bullets:
        (1) Autopilot on an ambiguous task → PR surprises you'd have wanted to
        intercept mid-session;
        (2) unstructured issue brief → low-quality autonomous output regardless of mode;
        (3) skipping Canvas escalation → no recovery path when the agent veers.
        These failure modes are the natural consequence of not using the controls
        demonstrated in Slides 1–4, so they close S3 with causal clarity. Naming
        them here means S4 opens on the payoff without rebuilding credibility.

    "Sessions to Systems":
      # medium = 3 slides (opens directly on payoff — "What Breaks" already named in S3)
      emphasis: medium
      note: >
        S4 opens directly on the payoff — the "What Breaks" accounting has already
        been done in S3 Slide 5, so S4 earns the right to be aspirational.
        Slide 1: CVE response use case — Plan mode on a high-stakes task. Two-agent
        sequencing: one patches the CVE, one writes regression tests. Audit trail
        visible. PR ready in approximately 20 minutes. This is the moment that converts
        skeptics; do not rush it. Tie back to the CVE row in the S3 mode table.
        Slide 2: Workflow anatomy + Agent Merge lifecycle on one slide. Show the
        agent-workflow.yml structure (trigger, mode, auto_merge fields) alongside the
        Agent Merge CI flow (CI failure → fix → re-push → merge) as a linear sequence.
        One concrete example: weekly dependency maintenance running automatically every
        Monday. Clarify when to keep a human in the loop as the trust-balance close.
        Slide 3: "What You Can Do Today" action close with 15min / 1hr / 2–4hr tiers
        from the README. This is the final content slide — end here, not on Agent Merge
        mechanics. Tie back to the opening frame: the Monday dispatch now runs itself.

