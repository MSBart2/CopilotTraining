version: 1

deck:
  title: "Copilot Plugins & APM"
  subtitle: "Composable AI Extensions"
  tagline: "Try a capability, then package reviewed project configuration."
  arcToc: "The Opportunity → CLI-First Plugin Management → Building an APM Manifest → What You Can Do Today"
  arcNarrative: >
    Keep the existing four-part order. Open with the practitioner decision to separate a personal plugin trial from team-owned repository configuration. Explore marketplace, community, and first-party source paths without presenting listings or sample output as proof. Build from apm.yml intent to apm-lock.yml resolution, review, CI checks, and the separate managed-settings governance boundary. Close with a bounded task, observable evidence, a repository owner, and transfer into the audience's own work. Preserve configuration and command examples as illustrative. Do not execute plugin installs, alter trust, or add product/news claims.

  agenda:
    - title: "The Opportunity"
      takeaway: "Separate individual plugin exploration from shared repository configuration."
      whyItMatters: "The project owner decides what becomes team infrastructure."
    - title: "CLI-First Plugin Management"
      takeaway: "Use discovery paths to find a candidate, then inspect source, scope, and task evidence."
      whyItMatters: "A listing is not a security review or adoption decision."
    - title: "Building an APM Manifest"
      takeaway: "Review manifest intent, lockfile resolution, CI consistency, and governance boundaries."
      whyItMatters: "The repository and enterprise owners have distinct authority."
    - title: "What You Can Do Today"
      takeaway: "Run one bounded evaluation and carry its evidence into a repository decision."
      whyItMatters: "Practitioners can transfer the pattern without assuming a successful install."

  sectionOrder:
    - "The Opportunity"
    - "CLI-First Plugin Management"
    - "Building an APM Manifest"
    - "What You Can Do Today"

  sectionModes:
    "The Opportunity":
      emphasis: medium
      note: >
        Preserve the shift from per-developer setup to repository configuration. Teach the copilot plugin / APM scope distinction and the manifest-to-lockfile path. Qualify reproducibility as configuration resolution, not identical generated behavior.
    "CLI-First Plugin Management":
      emphasis: high
      note: >
        Preserve command-based discovery, plugin lifecycle, and discovery sources. Label command transcripts illustrative and not executed. Treat marketplace and community listings as leads; inspect source, permissions, compatibility, and task evidence before adoption.
    "Building an APM Manifest":
      emphasis: high
      note: >
        Preserve plugin, instructions, skills, MCP, lockfile, fresh-clone, update, and CI examples. Use placeholders for unverified package URLs and integrity values. Keep CI as an illustrative shape. Preserve managed settings as a separate companion: additive enterprise keys, team mapping, precedence, dated source availability, client and license scope; never describe this as apm.yml merge or inheritance.
    "What You Can Do Today":
      emphasis: medium-high
      note: >
        Preserve the 15-minute, one-hour, and two-to-four-hour source exercises as estimates. Convert them into an action ladder with observable evidence, approval ownership, prerequisites, and stop conditions. End with a transfer question about the audience's own repository.

  highlightMoments:
    - "copilot plugin commands are for individual exploration; APM packages project configuration."
    - "apm.yml records project intent; apm-lock.yml records resolution details for review."
    - "A lockfile improves traceability; it does not certify trust, safety, or task quality."
    - "Enterprise managed settings govern a separate policy baseline, not APM inheritance."
    - "A repository owner approves adoption after source, scope, and task evidence are inspectable."
