      importance: supporting
      targetSection: "Sharing Plugins Across Teams"
      action: add
      summary: >
        In enterprise managed settings, enabledPlugins and extraKnownMarketplaces
        are additive: teams can layer role-specific plugins and marketplaces on top
        of the enterprise baseline without weakening it. Team files live under
        copilot/teams/ and are assigned with team-mappings.json.
      limitations:
        - "This is an enterprise managed-settings capability, not an apm.yml merge rule."
        - "Current managed-settings enforcement covers VS Code, Copilot CLI, the Copilot App, and Copilot cloud agent for Business or Enterprise licenses."
        - "Users in multiple teams receive least-restrictive team values beneath non-overridable enterprise decisions."
