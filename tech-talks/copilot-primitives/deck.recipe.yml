# the /init walkthrough is replaced by an explicit guidance-edit-and-rerun example.
# Section 1 redesign approved by the user 2026-11-02, including fresh deck-local
# sequence/impact scenes. This supersedes its placement/evidence preamble below.
# Parts 2 and 3 redesigned with user approval 2026-11-02. Keep individual openers:
# prompts capture human-invoked workflows; skills discover relevant expertise.
# This supersedes the earlier prompt-to-runnable-skill ladder and test-runner demo.
# Part 4 Documentation Reviewer redesign approved by the user 2026-11-02.
