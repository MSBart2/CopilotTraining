# 34 slides: 23 teaching + 11 spine/frame slides. Speaking 46:40; Q&A 3:20.
version: 1
deck:
  title: "Copilot Configuration Primitives: Making AI Understand Your Codebase"
  subtitle: "Instructions, Custom Prompts, Skills, and Agents"
  tagline: "Preserve useful know-how. Reuse it in the work that needs it."
  slideCount: 34
  teachingSlideCount: 23
  spineSlideCount: 11
  speakingSeconds: 2800
  questionSeconds: 200

  agenda:
    - title: "Make reviewed team know-how reusable"
      takeaway: "Write concrete instructions, maintain them through review, and supply them to the work that needs them."
      whyItMatters: "Different disciplines contribute reusable instructions; supported chat context depends on scope and activation."
    - title: "Capture useful work as a Custom Prompt"
      takeaway: "Save a useful documentation-review workflow as /refresh-docs, reuse it for another change, then version and share it."
      whyItMatters: "A human-invoked recipe preserves the approach while each case gets its own evidence and review."
    - title: "Make task expertise discoverable with Skills"
      takeaway: "Load relevant knowledge through name/description, SKILL.md, and maintained references; resources are optional."
      whyItMatters: "Knowledge-only skills can help relevant work, with explicit invocation as an alternative when selection misses."
    - title: "Put expertise to work in a focused role"
      takeaway: "Select Documentation Reviewer, apply the existing skill, and inspect a sourced doc patch with open questions."
      whyItMatters: "A recurring role adds fitting tools and output boundaries while keeping human acceptance separate."

  arcToc: "Instructions → Custom Prompts → Skills → Agents"
  arcNarrative: >
    Preserve four separate parts and the approved opening.
    Instructions begins with four concrete contributions from product,
    accessibility, engineering, and operations, then distinguishes repository,
    user, and organization sources. It teaches a concise shared baseline with
    explicit “read when” pointers to detailed documents, then a focused runbook
    instruction using applyTo. One deployment request traces the supported VS
    Code automatic baseline, matching task-specific instruction, explicit read
    of the relevant linked guide, assembled context, proposed runbook work, and
    unrelated accessibility guidance left outside. It distinguishes automatic
    baseline context from conditional file guidance and a separately consulted
    document; a link alone does not guarantee a read. Concrete instructions map
    directly to inspectable behavior. A significant deployment-command change
    prompts a person to ask Copilot to assess existing guidance; a maintainer
    reviews a proposed targeted edit or keeps the file unchanged. Follow with
    supported locations, an explicit instruction-add/update demo, and end-of-
    section troubleshooting across discovery, scope, rule quality, and a repeated
    representative task. Examples remain illustrative.
    Custom Prompts begins with its own question and opener. A maintainer works
    with Copilot on a documentation review, asks it in natural language to capture
    the useful approach as /refresh-docs, reviews the complete prompt file,
    invokes it for a configuration rename after the deployment-command case,
    inspects and refines the output, then versions the shared approach.
    Named, discoverable, parameterized, human-invoked functions are an analogy,
    not deterministic guarantees. Skills has a separate question and opener:
    the check works; now make it discoverable during relevant work. Trace
    name/description discovery, SKILL.md loading, and reference use as needed.
    A complete knowledge-only docs-review skill routes to the same maintained
    guide. Show a relevant configuration change and an unrelated logo-layout
    request, then the guide and changed source producing a proposed doc edit
    with an unresolved default question. Optional template and local-link
    checker extensions help this same task; neither is required or proves
    correctness. Compare deliberate /refresh-docs with task-relevance discovery
    and explicit /docs-review invocation. Keep one source of detailed rules.
    The final skill slide offers an optional prepared live inspection with a
    complete static fallback, not an assumed successful execution.
    Agents close the arc with Documentation Reviewer: the same Copilot in a
    focused recurring role. Show a concise docs-reviewer.agent.md with read,
    search, and edit tools, an explicit relative link to the existing docs-review
    SKILL.md, a doc patch plus citations and open questions, and stopping
    conditions. Trace the same API_TIMEOUT to REQUEST_TIMEOUT example through
    applicable host instructions, explicit skill and linked-guide reads, changed
    source inspection, and proposed docs/configuration.md update. The runbook
    applyTo does not match this config document; explain the alternate deployment
    case in notes. Inspect the stale line, source citation, narrow diff, and
    unresolved default question. Keep checks not executed and human review
    pending separate. Close with direct role selection or optional /refresh-docs
    agent targeting in a supported prompt host; update the Part 2 illustrated
    prompt itself. No automatic inheritance, universal precedence, or all-four
    requirement. The agent references expertise instead of copying the workflow.
    Treat examples and transcripts as illustrative, not measurements or
    guaranteed product output. Keep runtime availability and authority distinct
    from file syntax: a tool list is not a substitute for service, repository,
    or human approval controls.

  sectionOrder:
    - "Instructions"
    - "Custom Prompts"
    - "Skills"
    - "Agents"
  sectionModes:
    "Instructions":
      emphasis: high
      note: >
        Teach Copilot once and carry reviewed team know-how into a relevant task.
        Use ten teaching slides plus the opener: cross-discipline contributions,
        knowledge sources, useful rules, significant-change maintenance, supported
        homes, a concise baseline with explicit document pointers, one applyTo
        runbook rule, a deployment context trace, an explicit add/update-and-rerun
        example, and actionable troubleshooting. Preserve AGENTS.md
        setup/test/workflow guidance within supported homes. Notes qualify
        harness support, activation, inline-suggestion exclusion, organization
        discovery, and the difference between loaded guidance and acceptable work.
        A linked document is not guaranteed to be read. No universal precedence
        or enforcement claim.
    "Custom Prompts":
      emphasis: medium
      note: >
        Four teaching slides plus a separate opener, 7:20 total. Capture a useful
        documentation review, read the complete prompt, reuse the same approach
        for two distinct significant changes, then version and share it.
        Show input, linked current guide, and expected output together. Verify
        input syntax against current first-party docs; avoid unnecessary tool
        IDs. A natural-language capture request avoids dependence on a creation
        command. Keep the prompt a valid destination, with no graduation rule.
    "Skills":
      emphasis: high
      note: >
        Five teaching slides plus a separate opener, 9:55 total. Teach task
        relevance, progressive disclosure, a complete knowledge-only SKILL.md,
        maintained references doing work, and optional resources helping that
        work. Contrast deliberate prompt invocation with relevance discovery
        and explicit skill invocation. Selection is not guaranteed. Inspect
        actual loading and output separately from acceptance. No scheduler,
        runnable prerequisite, template guarantee, or mandatory prompt ladder.
        The final 3:10 slide includes an optional two-minute prepared inspection
        and own-work transfer; static examples remain fully deliverable alone.
    "Agents":
      emphasis: medium
      note: >
        Four teaching slides plus a separate opener, 7:20 total. Select a focused
        recurring responsibility, read the complete Documentation Reviewer agent
        definition, trace existing expertise doing work, inspect the cited patch
        and unresolved question, then choose direct role selection or deliberate
        prompt entry. Current first-party tool aliases and schema; omit execute
        when no script is needed. Prose remit is not file-level enforcement.
        Shared and applicable targeted instructions come from the host. The
        explicit skill reference routes to the existing maintained guide.
        Prompt/skill/agent coexistence has no maturity ladder. No mandatory
        handoffs, subagents, scripts, or MCP. Examples remain illustrative.

  preamble: []
  appendix: []

  highlightMoments:
    - "Product, accessibility, engineering, and operations contribute distinct reusable instructions."
    - "A short shared baseline routes a relevant task to its detailed document with an explicit read direction."
    - "A selected VS Code Copilot harness adds the supported baseline automatically; matching file guidance and linked documents enter through their own conditions."
    - "After a significant change, a person asks Copilot to assess existing guidance; an owner reviews any proposed edit."
    - "A useful documentation-review conversation becomes /refresh-docs; a deployment command change and a configuration rename expose representative reuse."
    - "A knowledge-only skill makes the same review expertise discoverable through task relevance and progressive disclosure."
    - "Prompt and skill read one maintained guide; optional template and script resources help without becoming prerequisites."
    - "Documentation Reviewer puts the existing expertise to work through a focused remit, fitting tools, and a reviewable proposal."
    - "The cited rename patch leaves an unsupported default question open, with check status and human review separate."

