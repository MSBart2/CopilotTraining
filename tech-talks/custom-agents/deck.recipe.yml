# Conversion recipe autonomously prepared and approved on 2026-10-31 under the
# user's explicit waiver of recipe/content approval pauses. Preserves the thesis,
# FanHub evidence, demonstration scope, and four-part teaching arc; splits the
# three-runtime load report and own-work transfer into focused proof slides.
version: 1

deck:
  title: "Custom Agents"
  subtitle: "One File, Every Runtime"
  tagline: "Design the portable core. Read the resolved run. Place each requirement where it lives."

  agenda:
    - title: "Design a portable agent contract"
      takeaway: "Put role, tool boundary, method, and output contract in the shared core, then add runtime-specific fields on purpose."
      whyItMatters: "Every supported runtime reads the body, while each runtime resolves its own configuration."
    - title: "Read the resolved run"
      takeaway: "Verify agent identity, model, tools, checks, and summary from each runtime's own artifacts."
      whyItMatters: "Declared configuration and executed behavior can differ, and run artifacts show what happened."
    - title: "Place each requirement in its owning layer"
      takeaway: "Map each gap to the agent body, launch controls, runtime environment, review, or team policy, then rerun the same proof."
      whyItMatters: "A targeted change in the right layer, owned by the right person, repairs the gap with a repeatable rerun."

  arcToc: "Design the Core → Read Three Runs → Place and Rerun"

  arcNarrative: >
    Open with one file entering VS Code, Copilot CLI, and Copilot cloud agent and
    three dated evidence fragments: the CLI logged claude-sonnet-5.5, VS Code
    requests ran gpt-6.1-sol, and the cloud agent invoked test-writer before Jest
    stopped at a missing React dependency. Ask which agent the team shipped.
    Part 1 builds the portable contract: choose the right customization, divide
    work among description, tools, and body, publish at the intended scope, and
    keep launch controls distinct from the profile. Part 2 separates documented
    support from observed resolution, then follows the same FanHub agent through
    each runtime. The cloud setup workflow is the memorable recovery: the profile
    describes a role, while the runtime supplies its environment. Part 3 makes
    evidence gathering repeatable with a per-runtime load report, layer ownership,
    and an explicit human boundary in composition. Part 4 transfers the method to
    an agent the audience already owns. Four sections preserve the existing
    navigation while giving the former closing exercise an opener and two focused
    practice slides. A three-part structure was rejected because it hides the
    transfer decision inside the proof section.

  sectionOrder:
    - "1. Design the Portable Core"
    - "2. Run One File in Three Runtimes"
    - "3. Prove the Run and Place Each Requirement"
    - "4. Take It to Your Agents"

  sectionModes:
    "1. Design the Portable Core":
      emphasis: medium
      note: >
        Preserve the different-who decision and the real test-writer profile.
        Show the four customization primitives, the division among description,
        tool aliases, and body, and the five-line output contract. Keep repository,
        personal, and organization/enterprise scopes distinct; most-local
        precedence and default-branch discovery are separate facts. Name target,
        user-invocable, and disable-model-invocation as launch controls, not proof
        that a runtime grants execution authority.
    "2. Run One File in Three Runtimes":
      emphasis: high
      note: >
        Label documented support separately from observed resolution. Keep the
        dated FanHub evidence and artifact links. Show six aliases as each
        runtime's own expansion, never as a capability ranking. Mark unobserved
        cells as unobserved. Keep the VS Code model cause unresolved. Separate
        runner status from the domain assertion. The cloud recovery must show the
        setup workflow outside the profile, the @copilot follow-up, and the cloud
        result of 1 suite and 6 tests passed.
    "3. Prove the Run and Place Each Requirement":
      emphasis: high
      note: >
        Give each runtime its own five-question load report and first-party debug
        source. The recovery matrix names the gap, owning layer, action, and owner:
        agent producer, developer starting the run, repository maintainer, PR
        reviewer, or team lead. Pair test-writer with read-only test-reviewer;
        distinguish a human-selected handoff from agent-to-agent subagent calls.
        Place final authority in the surrounding controls, not the profile.
    "4. Take It to Your Agents":
      emphasis: medium
      note: >
        Turn the audience's existing shared agent into the transfer artifact.
        Have practitioners predict a runtime difference, gather evidence, assign
        one gap to an owner, and rerun the same proof. Preserve the own-work
        question and route broader local orchestration, event-triggered workflows,
        and PR decisions to their adjacent talks.

  preamble: []
  appendix: []

  highlightMoments:
    - "The same six aliases expanded to 23 VS Code tools and 14 Copilot CLI tools; these are runtime-specific resolutions, not a capability ranking."
    - "The Copilot CLI logged its decision: Using model claude-sonnet-5.5 from custom agent test-writer."
    - "VS Code requests ran gpt-6.1-sol while the profile declared Claude Sonnet 5.5; the cause remains unresolved."
    - "The cloud agent invoked test-writer, then stopped at a missing React dependency; the local run separately showed 5 passed and 1 failed."
    - "A setup workflow outside the profile enabled a cloud rerun with 1 suite and 6 tests passed."

  slides:
    - id: title
      part: 0
      claim: "One shared agent file can enter three runtimes, each with its own resolved run."
      scene: "frame: title with deck-local three-runtime visual"
      seconds: 30
    - id: core-question
      part: 0
      claim: "A team can design for portability by writing the shared core and inspecting each runtime's resolution."
      scene: "frame: core-question with practitioner roles and observable outcomes"
      seconds: 90
    - id: contents
      part: 0
      claim: "The argument moves from design, through runtime evidence, into an own-work transfer."
      scene: "frame: contents with four section opener links"
      seconds: 30
    - id: cold-open
      part: 0
      claim: "The 2026-10-21 FanHub runs show three different outcomes from the same committed profile."
      scene: "deck: three evidence fragments; motion reveals VS Code, CLI, then cloud"
      seconds: 90
    - id: part-1
      part: 1
      claim: "A portable contract starts with the work needing a different role."
      scene: "frame: opener with choose, encode, and publish"
      seconds: 30
    - id: primitive-choice
      part: 1
      claim: "A custom agent earns a file when the work needs a persistent role and distinct boundary."
      scene: "deck: four customization choices mapped to the work they own"
      seconds: 90
    - id: agent-anatomy
      part: 1
      claim: "Description selects, tool aliases bound, and the body carries the portable method."
      scene: "deck: real test-writer configuration excerpt paired with field responsibilities"
      seconds: 125
    - id: output-contract
      part: 1
      claim: "A five-line body contract makes test results and suspected bugs inspectable across runtimes."
      scene: "terminal: the report template and a missing-dependency result"
      seconds: 105
    - id: publish-scope
      part: 1
      claim: "The most-local definition wins, so locate the loaded file before debugging its prompt."
      scene: "deck: repository, personal, and organization scopes with precedence"
      seconds: 105
    - id: launch-controls
      part: 1
      claim: "Target and invocation settings control availability and selection, not approval of changes."
      scene: "signals: target, user-invocable, and disable-model-invocation"
      seconds: 75
    - id: part-2
      part: 2
      claim: "Evidence begins by separating documented support from what a run actually resolved."
      scene: "frame: opener with docs, runtime, and artifacts"
      seconds: 30
    - id: documented-support
      part: 2
      claim: "The configuration reference documents shared fields and runtime-specific fields as of 2026-10-21."
      scene: "deck: documented field support matrix across three runtimes"
      seconds: 120
    - id: observed-resolution
      part: 2
      claim: "FanHub artifacts show the same profile resolving differently across VS Code, CLI, and cloud."
      scene: "deck: observed resolution table; unobserved cells remain explicit"
      seconds: 120
    - id: vscode-run
      part: 2
      claim: "VS Code honored Local-session handoff behavior, while request logs showed a different model."
      scene: "deck: observed outcomes beside declared and executed model"
      seconds: 130
    - id: cli-run
      part: 2
      claim: "Copilot CLI logged the resolved model and reported ten passing tests."
      scene: "terminal: exact model-resolution line, tool expansion, and test result"
      seconds: 105
    - id: cloud-first-run
      part: 2
      claim: "The cloud agent invoked test-writer, but Jest stopped because the fresh environment lacked React."
      scene: "deck: invocation evidence beside environment failure and separate local test result"
      seconds: 120
    - id: cloud-recovery
      part: 2
      claim: "Setup steps outside the profile enabled a cloud rerun with one suite and six tests passing."
      scene: "terminal: setup workflow, @copilot follow-up, and observed cloud result"
      seconds: 160
    - id: part-3
      part: 3
      claim: "Repeatable proof records the loaded agent, model, tools, checks, and report."
      scene: "frame: opener with report, owner, and rerun"
      seconds: 30
    - id: vscode-load-report
      part: 3
      claim: "VS Code exposes agent loading, per-request model and tools, terminal results, and the final summary."
      scene: "deck: five questions mapped to VS Code debug artifacts"
      seconds: 100
    - id: cli-load-report
      part: 3
      claim: "CLI debug logs and transcripts provide evidence for identity, model, tools, checks, and report."
      scene: "deck: five questions mapped to CLI commands and log fields"
      seconds: 85
    - id: cloud-load-report
      part: 3
      claim: "The cloud session log and PR description answer different load-report questions."
      scene: "deck: five questions mapped to session and PR artifacts"
      seconds: 100
    - id: repair-map
      part: 3
      claim: "A gap becomes actionable when its owner places it in the body, launch, environment, review, or policy."
      scene: "deck: six recovery rows with layer and named owner"
      seconds: 145
    - id: compose-boundaries
      part: 3
      claim: "Handoffs put a person between agents; subagents delegate, while surrounding controls retain authority."
      scene: "deck: producer-reviewer handoff beside delegated calls and authority boundary"
      seconds: 110
    - id: part-4
      part: 4
      claim: "The final section applies the same proof loop to an agent the audience already shares."
      scene: "frame: opener with choose, predict, and verify"
      seconds: 30
    - id: own-work-check
      part: 4
      claim: "A practitioner can start transfer by predicting which load-report line will differ."
      scene: "deck: own-work worksheet names candidate, runtime, evidence, and owner"
      seconds: 110
    - id: rerun-plan
      part: 4
      claim: "Load, compare, place, and rerun produce a repeatable local proof loop."
      scene: "four-phases: a practitioner routes one gap to its owning layer"
      seconds: 100
    - id: before-after
      part: 0
      claim: "The team moves from assuming one file behaves identically to reading and repairing each resolved run."
      scene: "frame: before-after with dated observations and recovery"
      seconds: 45
    - id: today
      part: 0
      claim: "A small first audit can become a team practice for runtime variance and ownership."
      scene: "frame: today with observable actions by horizon"
      seconds: 50
    - id: references
      part: 0
      claim: "Every configuration and run claim traces to first-party documentation or FanHub artifacts."
      scene: "frame: grouped documentation and observed-run references"
      seconds: 15
    - id: thanks
      part: 0
      claim: "Practitioners leave with one shared agent to inspect and a question that directs the next run."
      scene: "frame: closing visual returns to one file and three runtimes"
      seconds: 15
