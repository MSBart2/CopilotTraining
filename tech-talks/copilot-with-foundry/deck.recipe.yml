# Native conversion plan, 2026-10-31.
# Approved under the user's autonomous-conversion waiver; content review follows conversion.
# Preserve the existing narrative, sample architecture and artifacts; qualify unsupported
# percentages and fictional case details as illustrative rather than observed.
version: 1

deck:
  title: "GitHub Copilot with Microsoft Foundry: Organizational Memory for Coding Agents"
  subtitle: "When does a Copilot agent need Foundry — and how do we wire it up?"
  tagline: "Add a governed organizational-memory tool when repository context cannot explain intent."
  agenda:
    - title: "Find the missing context"
      takeaway: "Trace what GitHub can establish and what organizational records can add."
      whyItMatters: "The distinction keeps repository evidence and decision rationale separate."
    - title: "Wire the provider"
      takeaway: "Provision the knowledge base with azd, crawl the sources, and give Copilot its MCP endpoint."
      whyItMatters: "Each actor and permission is visible before a tool call."
    - title: "Keep the human decision"
      takeaway: "Inspect retrieved evidence, verify currency, and request approval before changing code."
      whyItMatters: "A historical decision is evidence, not current authorization."
  arcToc: "Two memories → Connect Foundry IQ → Recover intent → Choose the boundary"
  arcNarrative: >
    Keep the approved sequence and anchor. Open with bypassFraudChecks() and label its
    PR trace as illustrative, then name implementation, operational, and organizational
    context. Show the architecture before configuration so the audience can locate each
    actor. The middle moves from azd provisioning and knowledge-base ingestion
    to an explicit distinction among tool availability, permission, and human approval.
    The peak is the same query answered with implementation evidence and a retrieved,
    dated decision excerpt; neither result is represented as a live deployment or
    observed test. The closing diagnostic pairs positive intent signals with content
    that does not earn indexing. Carry the original four parts, readiness checks, sample
    artifacts, and transfer actions while disclosing that quantitative ratios and the
    fraud scenario are not measured evidence. Skip product-news refresh and live cloud
    actions.
  sectionOrder:
    - "The Two Memories"
    - "Connecting Foundry IQ"
    - "The Organizational Memory Pattern"
    - "Recognizing Intent Problems"
  sectionModes:
    "The Two Memories":
      emphasis: high
      note: >
        Open on the code and its sample PR trace. State that the case details are
        illustrative, not observed production evidence. Establish what code history can
        answer, what it cannot establish about intent, then crystallize the three context
        layers and a question-to-provider router.
    "Connecting Foundry IQ":
      emphasis: high
      note: >
        Treat Foundry as infrastructure, not another agent: azd provision plus a
        postprovision hook builds the index, knowledge sources, and knowledge base, and
        outputs the MCP endpoint Copilot calls. Copilot is the only agent; it calls as the
        developer, so name identity, the Search Index Data Reader grant, and owner separately. Setup snippets are examples;
        verify them against current first-party documentation before use.
    "The Organizational Memory Pattern":
      emphasis: high
      note: >
        Use the dated architecture-review excerpt as explicitly illustrative source
        material, then compare the same question with and without Foundry IQ. Preserve
        the two-provider artifact and six reasoning steps. Distinguish tool request,
        service permission, human authorization, retrieved historical evidence, current
        verification, and approval to act.
    "Recognizing Intent Problems":
      emphasis: medium
      note: >
        Present signal phrases beside the counterexample: missing or low-value
        organizational records do not become useful by indexing everything. Replace
        the unmeasured 5–10% heuristic with four readiness checks a team can run
        without Foundry, then end with a two-week pilot and a transfer decision.
  preamble: []
  appendix: []
  highlightMoments:
    - "GitHub evidence can trace a code change; only a separate organizational source can supply a documented rationale."
    - "A tool being offered, a caller being permitted, and a person approving a code change are three different decisions."
    - "A March 2023 review excerpt is illustrative evidence in the teaching case, not an observed Foundry retrieval."
    - "The six-step loop checks whether a historical reason still holds before proposing any code change."
    - "Four readiness checks run without Foundry; a team counts its own why-questions instead of borrowing a percentage."
  slides:
    - { id: title, part: 0, claim: "A coding agent can combine repository evidence with organizational rationale through distinct context providers.", scene: "deck: provider paths converge on a coding question; motion: routes appear in sequence", seconds: 20 }
    - { id: core-question, part: 0, claim: "Add organizational memory only when the task needs a documented reason beyond repository context.", scene: "frame: learner question, three practitioner roles, and the decision", seconds: 40 }
    - { id: contents, part: 0, claim: "The talk moves from the context gap through wiring and reasoning to a bounded adoption decision.", scene: "frame: four linked parts", seconds: 30 }
    - { id: part-1, part: 1, claim: "Repository evidence and organizational rationale answer different questions.", scene: "frame: three cards introduce the context gap", seconds: 25 }
    - { id: code-gap, part: 1, claim: "Code history can identify a change while leaving its intent and present validity unresolved.", scene: "deck: sample code beside traceable facts and an unanswered question", seconds: 100 }
    - { id: memory-layers, part: 1, claim: "Implementation, operational, and organizational context route to different authorities.", scene: "scorecard: three context layers and their questions", seconds: 100 }
    - { id: context-router, part: 1, claim: "Route what/how questions to repository sources, current-state questions to operational tools, and why questions to decision records.", scene: "signals: question signals map to context providers", seconds: 70 }
    - { id: intent-boundary, part: 1, claim: "A retrieved rationale explains a past decision but does not prove that the constraint still applies.", scene: "showdown: historical record versus current validation", seconds: 70 }
    - { id: part-2, part: 2, claim: "Connecting Foundry IQ is infrastructure: provision, ingest, and hand Copilot one MCP endpoint.", scene: "frame: provision, ingest, connect", seconds: 25 }
    - { id: integration-map, part: 2, claim: "The Copilot client requests tools while provider services retrieve their own authoritative context.", scene: "deck: actor-labeled Copilot, GitHub MCP, Foundry IQ, and document paths", seconds: 95 }
    - { id: azd-provision, part: 2, claim: "azd provision plus a postprovision hook builds the knowledge base and outputs its MCP endpoint; no agent is deployed.", scene: "terminal: env set, provision, get-value KB_MCP_ENDPOINT", seconds: 75 }
    - { id: deployment-manifest, part: 2, claim: "One azure.yaml provisions the project and model; the hook builds the knowledge base; the only output Copilot needs is the MCP endpoint.", scene: "deck: four cards (project, search service, hook, endpoint output)", seconds: 90 }
    - { id: source-quality, part: 2, claim: "Foundry IQ knows only connected sources: decision documents crawled into an index (cited), or Microsoft 365 email, meetings, and Teams chats asked live through Work IQ (preview, permission-scoped, uncited).", scene: "deck: indexed versus remote lanes with bypass examples and an owner-scope-path rule", seconds: 90 }
    - { id: identity-boundary, part: 2, claim: "Identity, permission, and approval are separate controls with separate owners; each fails differently when missing.", scene: "deck: three control cards (question, bypass-question answer, owner, failure signal) over a rule band; identity is the developer calling through Copilot", seconds: 90 }
    - { id: part-3, part: 3, claim: "The organizational-memory pattern combines implementation trace with dated rationale before proposing action.", scene: "frame: code, historical record, reviewed answer", seconds: 25 }
    - { id: illustrative-review, part: 3, claim: "The March 2023 decision record supplies the risk owner, the alternative, and an expiry; each answers a question the PR left open.", scene: "deck: ADR-042 document card with fields mapped to the PR questions", seconds: 90 }
    - { id: answer-compare, part: 3, claim: "With repository context alone the agent stops at a missing decision source; with Foundry IQ it proposes a bounded check with the owner.", scene: "deck: same question, repository-only vs repository + org memory panes with outcome bands", seconds: 100 }
    - { id: agent-tools, part: 3, claim: "Copilot is already the agent: one .agent.md file scopes two MCP servers (GitHub and the knowledge base endpoint), and four instructions drive the bypass run to a proposal; instructions route while permission and the owner govern.", scene: "deck: agent-file card (tools + lettered instructions) beside six bypass steps tagged by instruction, over a controls band", seconds: 130 }
    - { id: surfaced-debt, part: 3, claim: "Connecting decision records surfaces debt beyond the question asked: an expired time-box, an unfinished follow-up, and conflicting guidance; each becomes an owner issue, and conflicts are cited and stopped.", scene: "deck: three find cards (record says, signal, move) over an owners-decide band", seconds: 100 }
    - { id: part-4, part: 4, claim: "Intent signals justify a local fit check; missing sources or ordinary code tasks point elsewhere.", scene: "frame: signals, exclusions, local threshold", seconds: 25 }
    - { id: signal-phrases, part: 4, claim: "Four overheard phrases reveal an intent gap; each surfaces in a meeting the team already runs, names what is missing and where it was written down, and shows that the person asking is rarely the person who knows.", scene: "deck: 2x2 scenario cards with heard-in, missing, look-in source chips, and asks/knows roles", seconds: 120 }
    - { id: what-not-to-index, part: 4, claim: "Route each question to the place that can answer it: code to Copilot + repo, quick facts to the owner, unrecorded decisions to a new ADR, and written-but-scattered rationale to Foundry IQ.", scene: "signals: four question rows routed to four destinations", seconds: 90 }
    - { id: readiness-checks, part: 4, claim: "Four team-level checks run without Foundry (why-questions heard, decisions written down, sources owned, answers slow to find); a yes on all four earns a two-week pilot.", scene: "deck: four check rows with how-to-check and if-no columns over a pilot band", seconds: 110 }
    - { id: before-after, part: 0, claim: "Role by role, the running example shifts from asking around and approving on LGTM to cited records, an expiry check, and one owner-reviewed issue.", scene: "deck: role chips with before and after rows over an authority band", seconds: 75 }
    - { id: today, part: 0, claim: "Start with one real why-question, identify the authoritative record, then measure whether retrieval changes the decision.", scene: "frame: today, this week, this month transfer plan", seconds: 90 }
    - { id: references, part: 0, claim: "First-party quickstarts and protocol documentation are the verification path for evolving setup details.", scene: "frame: first-party sources", seconds: 30 }
    - { id: thanks, part: 0, claim: "The transferable decision is when a task needs organizational context and who approves action on it.", scene: "frame: closing question and provider map", seconds: 30 }
