  accepted:
    - title: "Microsoft Foundry extension for Azure Developer CLI is generally available"
      published: "2026-11-05"
      source: "https://devblogs.microsoft.com/foundry/microsoft-foundry-azure-developer-cli-ga/"
      verified: "2026-11-06"
      releaseStatus: "ga"
      importance: "supporting"
      targetSection: "2. Connecting Foundry IQ (slides hosted-setup, deployment-manifest)"
      action: "update"
      summary: >
        `azd ext install microsoft.foundry` (1.0, GA; azd 1.37.0+) scaffolds hosted agents with
        `azd ai agent init --template <sample azure.yaml> --deploy-mode code --src .`, then
        `azd provision`, local test with `azd ai agent run` / `azd ai agent invoke --local`,
        and `azd deploy`. The sample azure.yaml declares an `azure.ai.project` service with
        `deployments` (model, version, sku) and an `azure.ai.agent` service with
        `codeConfiguration` (runtime, entryPoint), `uses: [ai-project]`, and `container.resources`.
        Patch hosted-setup's transcript to the GA command flow and replace the deployment-manifest
        artifact (gpt-4.1 `model:` block, `dependencies: azure.ai.model`, `endpoint`) with the
        current shape, keeping GITHUB_MCP_ENDPOINT and TOOLBOX_ENDPOINT as the talk's additions.
        Add `azd deploy --preview` and `azd ai agent doctor` to the notes as review and
        permission-diagnosis aids that support the talk's authority boundary.
      limitations:
        - "Hosted agents still require Foundry permissions and model quota; provisioned resources incur charges."
        - "Exact env-var syntax for tool endpoints in the new schema needs confirmation against the azure.yaml reference."
      recipeImpact: "confirm"
      slideImpact: "patch"

