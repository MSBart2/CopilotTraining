# REVIEW: Copilot CLI Rubber Duck was unavailable in VS Code. Claude Opus 5
# supplied the independent adversarial review used in this reconciliation.

version: 1

deck:
  title: "Agentic Lifecycle Orchestration"
  subtitle: "Evidence-Gated Handoffs from Issue to Pull Request"
  tagline: "Make every transition inspectable, authorized, recoverable, and owned"

  agenda:
    - title: "Choose Workflow Judgment"
      takeaway: "Use recurrence, bounded inputs, constrained outputs, and authority to qualify four phases."
      whyItMatters: "Deterministic steps stay in Actions and unbounded judgment stays human-led."
    - title: "Watch Approval Carry Authority"
      takeaway: "See issue #482 reach coding through one exact command from an authorized maintainer."
      whyItMatters: "An unauthorized comment leaves repository state unchanged."
    - title: "Recover in the Open"
      takeaway: "Route a failed check through a visible blocked state with an owner and resume evidence."
      whyItMatters: "Every stop exposes its phase, reason, and the person able to clear it."

  arcToc: "Select Judgments → Visible State → Preserve Authority → Measure and Recover"
  arcNarrative: >
    Workflow selection establishes why four bounded judgments belong in separate phases and
    how source compilation, permissions, and safe outputs constrain their authority. The
    visible state machine then follows issue #482 through intake evidence and a reviewable
    plan to the approval boundary. Authority supplies the peak when one exact command advances
    a fresh plan, an unauthorized request produces a visible no-op, and review routes evidence
    to a named human. Measurement and recovery close with local timing definitions, an owner
    ledger, and the compile gate required before a repository pilot.

  sectionOrder:
    - "1. Select Workflow-Owned Judgments"
    - "2. Make the State Machine Visible"
    - "4. Preserve Authority from Approval to Merge"
    - "5. Measure the Handoffs Locally"

  sectionModes:
    "1. Select Workflow-Owned Judgments":
      emphasis: medium-high
      note: >
        Open on the five questions each workflow phase answers. Show trigger choice, read
        permissions, mutation boundaries, source-to-lock compilation, and declared safe
        outputs. Mark all four sources as uncompiled candidates and name the platform owner
        who reviews generated permissions and tracks gh-aw schema changes.
    "2. Make the State Machine Visible":
      emphasis: medium-high
      note: >
        Use the phase, trigger, evidence, success, stop, and next-owner table as the spine.
        Follow issue #482 from intake evidence into a bounded plan with scope, exclusions,
        commands, rollback, and a named approver. End on the approval block so the next
        section opens at the consequential gate.
    "4. Preserve Authority from Approval to Merge":
      emphasis: high
      note: >
        Fire the approval gate here. Compare the authorized transition with the observable
        expected no-op from an unauthorized request, then show the create-pull-request safe
        output and draft-PR evidence. Close with review submitting COMMENT while deterministic
        checks and a CODEOWNER retain merge acceptance. Keep candidate framing visible.
    "5. Measure the Handoffs Locally":
      emphasis: medium-low
      note: >
        Use two slides: local timing definitions with quality companions, then the recovery
        ledger and bounded pilot. Keep stopped runs in the denominator. Close by asking
        attendees to compile all four sources, inspect generated permissions, and pilot one
        handoff before expanding the lifecycle.

  preamble: []
  appendix: []

  highlightMoments:
    - "State, required evidence, and next-owner authority agree before a transition advances."
    - "Four workflow sources and four instruction files make the candidate lifecycle inspectable."
    - "One exact maintainer approval advances a fresh plan into implementation authority."
    - "An unauthorized transition is expected to produce a no-op and leave repository state unchanged."
    - "A blocked label, stop evidence, and named implementation owner create a recoverable handoff."

# OPEN DECISION RESOLVED: Present issue #482 as a narrated candidate walkthrough. Runtime
# behavior remains expected until a target repository compiles and exercises all four sources.