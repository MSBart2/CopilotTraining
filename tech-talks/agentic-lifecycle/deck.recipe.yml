# Recipe history
# - 2026-10-21: original recipe, critiqued cross-model (rubber-duck subagent on gpt-5.6-sol; primary
#   Claude). Accepted from that critique and still in force: the three-layer authority chain (source
#   declares, lock implements, run evidence shows it); narrowing a wizard draft as the climax; actor
#   labels on every trace; outcome efficiency compared within one workflow; experimental labels on
#   evals; FanHub only in the closing slides.
# - 2026-10-22: restructured after live delivery feedback (too much, too deep, too fast, too little
#   why/when). Deck cut from 65 to 34 slides, use cases first, one visual per slide with depth in
#   speaker notes. Then evals and Outcomes got worked slides (36 slides), the title and core question
#   were simplified, and the real FanHub triage-wizard artifacts replaced invented examples.
# - 2026-10-22 (this revision): recipe rewritten to describe the approved, delivered deck. The user
#   approved the deck as is, so no cross-model review was run for this documentation pass.
# SLIDE BUDGET EXCEPTION (user-approved): 36 slides, above the default 30-slide cap. Depth lives in
# speaker notes, so most slides carry one visual and three to five callouts.
version: 1

deck:
  title: "GitHub Agentic Workflows"
  subtitle: "Automate the Repository Chores That Take Judgment"
  tagline: "What they are, when to use one, and how to run it safely"
  coreQuestion: "Which repository chores fit an agent, and how do you keep it in bounds?"

  agenda:
    - title: "Pick the chore first"
      takeaway: "Use the three-part test (recurs, needs judgment, small bounded write) to choose work, with IssueOps triage as the model and a gallery for what comes next."
      whyItMatters: "The first workflow sets the team's trust; a reversible write lets maintainers check it within a week."
    - title: "Read the contract and grant only the writes it needs"
      takeaway: "Frontmatter grants authority, safe outputs are the only write path, staged previews come first, and the lock and audit show the contract in effect."
      whyItMatters: "Approve or narrow any workflow pull request, including one a wizard or agent wrote."
    - title: "Run it, judge it, and recover"
      takeaway: "Read the run Summary, gh aw audit, and gh aw logs; weigh cost against evals (did it follow instructions) and Outcomes (did people find it useful); trace each symptom to its owning block."
      whyItMatters: "Promotion, revision, and retirement become decisions backed by run evidence."

  arcToc: "Why and When → Read the Contract → Build One Live → Run and Troubleshoot"

  arcNarrative: >
    The talk opens on the maintainer: CI handles the predictable work, and what still lands on the
    desk is recurring work that needs reading and judgment. Part 1 answers which of those chores
    earns an agent: what scripts, raw tokens, and manual toil make hard; the three-part test; a
    two-slide use-case gallery (reactive and scheduled); Peli's Agent Factory as the "what people
    actually run" slide; IssueOps end to end; and the handoff of implementation to the Copilot cloud
    agent. Part 2 reads one real file, triage-wizard.md from FanHub, frontmatter then body, then
    follows it through compile to the lock, safe outputs, staged mode, and a hostile issue that tries
    to steer the agent. Part 3 builds one live: the wizard, its intent, the generated draft narrowed
    with four controls (allowed, max, target, staged), then refine and the first loop. Part 4 covers
    life after day one: where to look, whether it is worth it (cost, then worked slides on evals and
    Outcomes), symptom-to-block troubleshooting, where it stops fitting, a time-boxed ladder, and the
    real FanHub #202 /triage run as the closing evidence.

  sectionOrder:
    - "1. Why and When"
    - "2. Read the Contract"
    - "3. Build One Live"
    - "4. Run and Troubleshoot"

  frame:
    - "1 Title: Automate the Repository Chores That Take Judgment"
    - "2 Core Question: three chores (triage, report, scope work) and three safety facts (1 Markdown file, a read-only agent, 1.22 AI credits)"
    - "3 Table of Contents"
    - "34 What You Can Do Today · 35 References · 36 Thank You"

  sectionModes:
    "1. Why and When":
      emphasis: high
      slides: "4–11 (8)"
      note: >
        Opener (hard to script, risky to wire by hand, costly to staff); What Would This Take
        Otherwise; Three-Part Test; Use Cases React; Use Cases Run on Their Own; Peli's Agent
        Factory (label Repo Assist figures as GitHub-published); IssueOps Flow; Cloud Agent Handoff.
        Map Your Own Work lives in speaker notes.
    "2. Read the Contract":
      emphasis: high
      slides: "12–19 (8)"
      note: >
        Opener (one file two halves, compiled to a lock, safe by default); Who Acts; triage-wizard.md
        Frontmatter (real FanHub artifact from examples/; flags roles: all + min-integrity: none as a
        deliberate risk choice); triage-wizard.md Body; Compile to the Lock (7 jobs, 5,000 AIC daily
        default confirmed in the lock); Safe Outputs (illustrative, staged); Staged Mode; Hostile Issue (five layered defenses: trust filter, tokens kept outside, network firewall,
        safe outputs, write review). Body Asks
        to Close and the Five Questions checklist live in speaker notes.
    "3. Build One Live":
      emphasis: high
      slides: "20–24 (5)"
      note: >
        Climax. Opener; Wizard; Live Demo Wizard Intent (real wizard output from
        examples/example-flow-prompt.md as the fallback); Narrow the Draft (four controls);
        Refine and First Loop (gh workflow run triage-wizard.lock.yml -f issue_number=202).
        Intent Becomes Evaluation lives in speaker notes.
    "4. Run and Troubleshoot":
      emphasis: medium
      slides: "25–33 (9)"
      note: >
        Opener; Where to Look (run Summary, gh aw audit, gh aw logs); Is It Worth It (cost caps,
        pointers to the next two slides); Evals in Practice (all five BinEval answers, labeled
        illustrative because triage-wizard has not run on FanHub; 400 AIC evals cap; results
        committed to evals/triagewizard); Outcomes in Practice (real gh aw outcomes output for run
        39669929991: 2/2 accepted, 0.810 AIC per accepted outcome); banner "Evals tell you whether it
        followed instructions. Outcomes tell you whether people found it useful."; When It Misbehaves
        (symptom → owning block → fix); Where It Stops Fitting; Ladder (15 minutes / 1 hour /
        2–4 hours); FanHub 202 (observed on gh-aw v0.92.6). Upgrade Discipline and FanHub
        #110 → #193 live in speaker notes.

  preamble: []
  appendix: []

  highlightMoments:
    - "Pick the chore first, then grant only the writes it needs: one Markdown file, a read-only agent, and a separate job that applies only the declared writes."
    - "The real triage-wizard.md, read frontmatter then body, compiles to a lock that shows every job and its permissions."
    - "In the live demo, four controls (allowed, max, target, staged) narrow a one-minute wizard draft into the right contract."
    - "Evals tell you whether it followed instructions; Outcomes tell you whether people found it useful. On FanHub #202, /triage produced four reasoned labels and found duplicate #7 for 1.22 AI credits, and both outputs were accepted."

# Evidence labels the deck relies on:
# - Observed: FanHub #202 run (gh-aw v0.92.6), gh aw audit 1.22 AIC, gh aw outcomes 2/2 accepted.
#   audit and outcomes count credits differently; never compare them directly.
# - Confirmed from the compiled lock: 7 jobs, 5,000 AIC daily default, 400 AIC evals cap.
# - Illustrative: eval answers on slide 28, Safe Outputs code on slide 17, lifecycle YAML shapes.