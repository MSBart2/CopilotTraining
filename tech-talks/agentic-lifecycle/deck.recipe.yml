# Recipe history
# - 2026-10-21: original recipe, critiqued cross-model (rubber-duck subagent on gpt-5.6-sol; primary
#   Claude). Accepted from that critique and still in force: the three-layer authority chain (source
#   declares, lock implements, run evidence shows it); narrowing a wizard draft as the climax; actor
#   labels on every trace; outcome efficiency compared within one workflow; experimental labels on
#   evals; FanHub only in the closing slides.
# - 2026-10-22: restructured after live delivery feedback (too much, too deep, too fast, too little
#   why/when). Deck cut from 65 to 34 slides, use cases first, one visual per slide with depth in
#   speaker notes. Then evals and Outcomes got worked slides (36 slides), the title and core question
#   were simplified, and the real FanHub triage-wizard artifacts replaced invented examples.
# - 2026-10-22 (this revision): recipe rewritten to describe the approved, delivered deck. The user
#   approved the deck as is, so no cross-model review was run for this documentation pass.
# SLIDE BUDGET EXCEPTION (user-approved): 36 slides, above the default 30-slide cap. Depth lives in
# speaker notes, so most slides carry one visual and three to five callouts.
# CONVERSION REFRESH — 2026-10-30
# Decision: preserve. Approved for faithful mechanical conversion by the user's explicit
# instruction to proceed without review pauses. Preserve all 36 source slides and their order; the FanHub proof slide
# uses the shared before-after frame to carry closing proof without adding a slide.
# Speaking budget: 3,110 seconds (51m 50s) against a 55-minute README duration, reserving 3m 10s
# for questions. 10 spine/template slides + 26 teaching slides.
version: 1

deck:
  title: "GitHub Agentic Workflows"
  subtitle: "Automate the Repository Chores That Take Judgment"
  tagline: "What they are, when to use one, and how to run it safely"
  coreQuestion: "Which repository chores fit an agent, and how do you keep it in bounds?"

  agenda:
    - title: "Pick the chore first"
      takeaway: "Use the three-part test (recurs, needs judgment, small bounded write) to choose work, with IssueOps triage as the model and a gallery for what comes next."
      whyItMatters: "The first workflow sets the team's trust; a reversible write lets maintainers check it within a week."
    - title: "Read the contract and grant only the writes it needs"
      takeaway: "Frontmatter grants authority, safe outputs are the only write path, staged previews come first, and the lock and audit show the contract in effect."
      whyItMatters: "Approve or narrow any workflow pull request, including one a wizard or agent wrote."
    - title: "Run it, judge it, and recover"
      takeaway: "Read the run Summary, gh aw audit, and gh aw logs; weigh cost against evals (did it follow instructions) and Outcomes (did people find it useful); trace each symptom to its owning block."
      whyItMatters: "Promotion, revision, and retirement become decisions backed by run evidence."

  arcToc: "Why and When → Read the Contract → Build One Live → Run and Troubleshoot"

  arcNarrative: >
    The talk opens on the maintainer: CI handles the predictable work, and what still lands on the
    desk is recurring work that needs reading and judgment. Part 1 answers which of those chores
    earns an agent: what scripts, raw tokens, and manual toil make hard; the three-part test; a
    two-slide use-case gallery (reactive and scheduled); Peli's Agent Factory as the "what people
    actually run" slide; IssueOps end to end; and the handoff of implementation to the Copilot cloud
    agent. Part 2 reads one real file, triage-wizard.md from FanHub, frontmatter then body, then
    follows it through compile to the lock, safe outputs, staged mode, and a hostile issue that tries
    to steer the agent. Part 3 builds one live: the wizard, its intent, the generated draft narrowed
    with four controls (allowed, max, target, staged), then refine and the first loop. Part 4 covers
    life after day one: where to look, whether it is worth it (cost, then worked slides on evals and
    Outcomes), symptom-to-block troubleshooting, where it stops fitting, a time-boxed ladder, and the
    real FanHub #202 /triage run as the closing evidence.

  sectionOrder:
    - "1. Why and When"
    - "2. Read the Contract"
    - "3. Build One Live"
    - "4. Run and Troubleshoot"

  frame:
    - "1 Title: Automate the Repository Chores That Take Judgment"
    - "2 Core Question: three chores (triage, report, scope work) and three safety facts (1 Markdown file, a read-only agent, 1.22 AI credits)"
    - "3 Table of Contents"
    - "4 Part 1 opener · 5–11 choose the chore, compare tools, inspect patterns, and hand off"
    - "12 Part 2 opener · 13–19 actors, real source and body, lock, writes, staging, threat boundary"
    - "20 Part 3 opener · 21–24 wizard, illustrative live fallback, narrow, compile, preview"
    - "25 Part 4 opener · 26–33 observe, evaluate, troubleshoot, boundaries, ladder, FanHub proof"
    - "33 FanHub #202 uses the shared before-after frame: real issue input → observed output and separately labelled run/outcome evidence"
    - "34 What You Can Do Today · 35 References · 36 Thank You"

  sectionModes:
    "1. Why and When":
      emphasis: high
      slides: "4–11 (8)"
      note: >
        Opener (hard to script, risky to wire by hand, costly to staff); What Would This Take
        Otherwise; Three-Part Test; Use Cases React; Use Cases Run on Their Own; Peli's Agent
        Factory (label Repo Assist figures as GitHub-published); IssueOps Flow; Cloud Agent Handoff.
        Map Your Own Work lives in speaker notes.
    "2. Read the Contract":
      emphasis: high
      slides: "12–19 (8)"
      note: >
        Opener (one file two halves, compiled to a lock, safe by default); Who Acts; triage-wizard.md
        Frontmatter (real FanHub artifact from examples/; flags roles: all + min-integrity: none as a
        deliberate risk choice); triage-wizard.md Body; Compile to the Lock (7 jobs, 5,000 AIC daily
        default confirmed in the lock); Safe Outputs (illustrative, staged); Staged Mode; Hostile Issue (five layered defenses: trust filter, tokens kept outside, network firewall,
        safe outputs, write review). Body Asks
        to Close and the Five Questions checklist live in speaker notes.
    "3. Build One Live":
      emphasis: high
      slides: "20–24 (5)"
      note: >
        Climax. Opener; Wizard; Live Demo Wizard Intent (real wizard output from
        examples/example-flow-prompt.md as the fallback); Narrow the Draft (four controls);
        Refine and First Loop (gh workflow run triage-wizard.lock.yml -f issue_number=202).
        Intent Becomes Evaluation lives in speaker notes.
    "4. Run and Troubleshoot":
      emphasis: medium
      slides: "25–33 (9)"
      note: >
        Opener; Where to Look (run Summary, gh aw audit, gh aw logs); Is It Worth It (cost caps,
        pointers to the next two slides); Evals in Practice (all five BinEval answers, labeled
        illustrative because triage-wizard has not run on FanHub; 400 AIC evals cap; results
        committed to evals/triagewizard); Outcomes in Practice (real gh aw outcomes output for run
        39669929991: 2/2 accepted, 0.810 AIC per accepted outcome); banner "Evals tell you whether it
        followed instructions. Outcomes tell you whether people found it useful."; When It Misbehaves
        (symptom → owning block → fix); Where It Stops Fitting; Ladder (15 minutes / 1 hour /
        2–4 hours); FanHub 202 (observed on gh-aw v0.92.6). Upgrade Discipline and FanHub
        #110 → #193 live in speaker notes.

  preamble: []
  appendix: []

  highlightMoments:
    - "Pick the chore first, then grant only the writes it needs: one Markdown file, a read-only agent, and a separate job that applies only the declared writes."
    - "The real triage-wizard.md, read frontmatter then body, compiles to a lock that shows every job and its permissions."
    - "In the live demo, four controls (allowed, max, target, staged) narrow a one-minute wizard draft into the right contract."
    - "Evals tell you whether it followed instructions; Outcomes tell you whether people found it useful. On FanHub #202, /triage produced four reasoned labels and found duplicate #7 for 1.22 AI credits, and both outputs were accepted."

  slides:
    - { id: title, part: 0, kind: spine, question: "What useful recurring work can a maintainer delegate?", claim: "A readable authority contract makes recurring repository judgment inspectable.", scene: "title + source → lock → audit visual", seconds: 25 }
    - { id: core-question, part: 0, kind: spine, question: "Which repository chores fit an agent, and how do I keep it in bounds?", claim: "Pick the chore first, then grant only the writes it needs.", scene: "core-question", seconds: 65 }
    - { id: contents, part: 0, kind: spine, question: "How will the decision unfold?", claim: "Four parts move from chore choice through evidence and transfer.", scene: "contents; opener links 4, 12, 20, 25", seconds: 25 }
    - { id: part-1, part: 1, kind: opener, question: "Why choose recurring judgment work first?", claim: "Recurring work that needs judgment and a bounded write is the candidate.", scene: "opener", seconds: 20 }
    - { id: otherwise, part: 1, kind: teaching, question: "What does this work take without an agentic workflow?", claim: "A separate write job makes recurring judgment reviewable without putting repository writes in the model job.", scene: "showdown: brittle or direct work versus bounded workflow; reveal context, job boundary, human decision", seconds: 100 }
    - { id: three-part-test, part: 1, kind: teaching, question: "When does a job earn an agentic workflow?", claim: "The task must recur, need judgment, and end in a small bounded write.", scene: "signals: show each condition and its example", seconds: 90 }
    - { id: use-cases-react, part: 1, kind: teaching, question: "Which workflows react to a person or event?", claim: "IssueOps, ChatOps, and LabelOps pair a named initiator with a bounded output.", scene: "relay: trigger → output → human next step", seconds: 105 }
    - { id: use-cases-scheduled, part: 1, kind: teaching, question: "Which workflows run on a schedule or queue?", claim: "Reports, queues, and research-to-plan handoffs make recurring judgment actionable.", scene: "relay: owner trigger → bounded work → human checkpoint", seconds: 105 }
    - { id: agent-factory, part: 1, kind: teaching, question: "What work does the gh-aw team report running?", claim: "GitHub reports more than 100 workflows; Repo Assist figures are published claims, not local forecasts.", scene: "scorecard: attributed portfolio and Repo Assist evidence", seconds: 75 }
    - { id: issueops-flow, part: 1, kind: teaching, question: "How does an issue become agent-ready work?", claim: "IssueOps moves from bounded triage through scoped plan to a human-owned implementation decision.", scene: "relay: triage → plan → decide", seconds: 135 }
    - { id: cloud-agent-handoff, part: 1, kind: teaching, question: "Who owns implementation after planning?", claim: "A person chooses the workflow-per-stage or workflow-plus-cloud-agent handoff and still reviews the merge.", scene: "showdown: auditable stages versus fewer files and iterative implementation", seconds: 110 }
    - { id: part-2, part: 2, kind: opener, question: "What is in the contract, and what keeps it bounded?", claim: "Source declares authority, lock implements it, audit shows the run.", scene: "opener", seconds: 20 }
    - { id: who-acts, part: 2, kind: teaching, question: "Who acts at each point in a workflow?", claim: "Requester starts, agent proposes, safe-outputs job writes, maintainer decides.", scene: "relay: contract owner → requester/agent → write job/maintainer", seconds: 75 }
    - { id: frontmatter, part: 2, kind: teaching, question: "What authority does the real frontmatter grant?", claim: "Five review questions expose trigger, reads, reach, writes, and runaway limits.", scene: "signals: real FanHub frontmatter blocks mapped to reviewer questions", seconds: 135 }
    - { id: workflow-body, part: 2, kind: teaching, question: "What judgment does the Markdown body ask for?", claim: "The body asks for bounded evidence before classification; frontmatter enforces authority.", scene: "terminal: issue input → evidence instructions → authority boundary", seconds: 100 }
    - { id: compile-lock, part: 2, kind: teaching, question: "What proves the source contract is implemented?", claim: "The seven-job lock keeps model jobs read-only and applies writes in a separate job.", scene: "relay: source → compiled lock → run audit", seconds: 130 }
    - { id: safe-outputs, part: 2, kind: teaching, question: "How can the agent write without holding repository write authority?", claim: "A separate job applies only declared outputs, targets, allowlists, and limits.", scene: "signals: agent proposal → bounded writes → honest stop", seconds: 100 }
    - { id: staged-mode, part: 2, kind: teaching, question: "How can a maintainer inspect a write before it happens?", claim: "Staged mode shows built-in safe-output previews before real writes.", scene: "terminal: staged setting → Summary preview → no resources created", seconds: 100 }
    - { id: hostile-issue, part: 2, kind: teaching, question: "What contains an untrusted issue that tries to redirect the agent?", claim: "Independent trust, credential, network, output, and detection controls contain the request.", scene: "signals: hostile input → five corresponding controls", seconds: 100 }
    - { id: part-3, part: 3, kind: opener, question: "How does a prompt become a reviewed workflow?", claim: "The wizard prompts; a coding agent drafts; the reviewer narrows authority.", scene: "opener", seconds: 20 }
    - { id: wizard, part: 3, kind: teaching, question: "What does the wizard ask for and hand to the coding agent?", claim: "Seven inputs produce a prompt, not an approved workflow.", scene: "four-phases: Why/How → When/Where → Extras/Agent → prompt", seconds: 80 }
    - { id: wizard-intent, part: 3, kind: teaching, question: "What does the actual prompt and repository-aware draft look like?", claim: "A concrete FanHub intent becomes a repository-aware draft; the reviewer still owns authority.", scene: "terminal: saved prompt → generated file; recorded fallback, not a live run", seconds: 180 }
    - { id: narrow-draft, part: 3, kind: teaching, question: "What decisions remain with the reviewer after generation?", claim: "The reviewer chooses allowlist, limits and target, staging, and trust/permission exceptions.", scene: "signals: generated contract → four reviewer decisions", seconds: 135 }
    - { id: refine-first-loop, part: 3, kind: teaching, question: "How does the reviewer refine, compile, and inspect the first run?", claim: "Compile and preview first; promote only after several representative issues match.", scene: "terminal: refine → compile → run staged → compare", seconds: 105 }
    - { id: part-4, part: 4, kind: opener, question: "What evidence shows whether the workflow works and is worth keeping?", claim: "Read the output, measure value, and trace failures to the owning block.", scene: "opener", seconds: 20 }
    - { id: where-to-look, part: 4, kind: teaching, question: "Which run view answers which question?", claim: "Summary, audit, and logs distinguish outcome, one-run cause, and trend.", scene: "relay: Summary → audit → logs", seconds: 90 }
    - { id: cost-and-value, part: 4, kind: teaching, question: "How do I compare workflow value with bounded spend?", claim: "Caps constrain spend while Outcomes and evals measure separate value signals.", scene: "signals: per-run/per-day limits → eval signal → accepted outcome", seconds: 100 }
    - { id: evals, part: 4, kind: teaching, question: "Did the run follow its declared instructions?", claim: "Evals ask whether the output followed instructions; the shown answers are illustrative.", scene: "terminal: five checks and labelled YES/NO/UNKNOWN example", seconds: 140 }
    - { id: outcomes, part: 4, kind: teaching, question: "Did maintainers keep the outputs from a real run?", claim: "FanHub Outcomes accepted both recorded safe outputs; repository state supplies the evidence.", scene: "terminal: observed run output with acceptance separate from status", seconds: 140 }
    - { id: troubleshoot, part: 4, kind: teaching, question: "Which contract block owns each failure symptom?", claim: "Trace the symptom to its engine, integrity, network, source, lock, or trigger owner.", scene: "signals: symptom → owning block → recovery", seconds: 100 }
    - { id: boundary, part: 4, kind: teaching, question: "When does an agentic workflow stop fitting?", claim: "Route deterministic work, broad writes, unowned review, and single-task implementation elsewhere.", scene: "showdown: workflow fit versus boundary and alternate tool", seconds: 70 }
    - { id: adoption-ladder, part: 4, kind: teaching, question: "What is a safe first move, first pilot, and next expansion?", claim: "Use staged previews and maintainer comparison before expanding the pilot.", scene: "four-phases: 15 minutes → 1 hour → 2–4 hours", seconds: 60 }
    - { id: fanhub-202, part: 4, kind: teaching, question: "What did the real FanHub #202 run produce, and what evidence supports it?", claim: "The observed /triage run produced reasoned labels and duplicate evidence; job status, audit cost, and Outcomes are separate.", scene: "before-after: issue input → observed output; three separately labelled evidence values", seconds: 120 }
    - { id: today, part: 0, kind: spine, question: "What can I try in my own repository next?", claim: "Choose one real task, preview its bounded output, and decide from evidence.", scene: "today: today → this week → this month with signals and validation", seconds: 90 }
    - { id: references, part: 0, kind: spine, question: "Where can I verify the talk's claims?", claim: "Primary docs and FanHub artifacts back the talk's claims.", scene: "references: product docs and observed artifacts", seconds: 30 }
    - { id: thanks, part: 0, kind: spine, question: "Which real chore will I map first?", claim: "Transfer the recurring, bounded, reviewable decision to one repository task.", scene: "thanks + transfer visual", seconds: 15 }

