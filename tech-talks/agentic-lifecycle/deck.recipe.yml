# Independent critique: rubber-duck subagent on gpt-5.6-sol (cross-model; primary is a Claude model).
# Reconciliation:
# - Accepted: open on #202 /triage; move #193 to the close as the multi-stage capstone.
# - Accepted: three-part anchor scoping "only pen" to repository writes, with the lock as the reviewable artifact.
# - Accepted: present min-integrity: none as an owned, version-specific exception with remaining
#   controls and a review trigger; report the friction drop as an operational observation.
# - Accepted: producer/owner framing (requester and contract owner) and a request-to-decision trace.
# - Accepted: lock review model (people review source, CI checks lock drift, reviewers read lock diffs
#   on permission or version changes).
# - Adjusted: the reviewer weighted "Test the Contract" high; the #202 command case now lives in section 1,
#   so section 3 carries the schedule and event patterns at medium and section 4 carries the climax.
# - Moved to README only: engine alternatives, imports/sharing, per-failure detail beyond one table.
version: 1

deck:
  title: "GitHub Agentic Workflows"
  subtitle: "Reviewable Contracts for Repository Judgment Work"
  tagline: "Frontmatter grants authority, safe outputs are the only pen, and the lock makes it reviewable"

  agenda:
    - title: "Match recurring work to the right actor"
      takeaway: "Sort jobs across Actions, an agentic workflow, and the Copilot cloud agent with three questions: judgment, initiator, smallest write."
      whyItMatters: "Those three answers become the trigger and safe-outputs blocks of a workflow you can defend in review."
    - title: "Read authority straight from the contract"
      takeaway: "Walk the real /triage frontmatter block by block, then see 76 source lines compile to a 2,203-line lock."
      whyItMatters: "Reviewers see exactly what the agent may read, call, and write before it ever runs."
    - title: "Operate the boundary with evidence"
      takeaway: "Use gh aw audit, self-filed [aw] issues, and an owned integrity exception to keep runs trustworthy and affordable."
      whyItMatters: "Production trust comes from per-run evidence, named owners, and a recovery path for every failure."

  arcToc: "Choose the Judgment → Write the Contract → Test on Real Work → Operate"

  arcNarrative: >
    Open on a single observed result: a maintainer comments /triage on user-style bug #202 and,
    six minutes later, the issue carries four allowlisted labels, a comment citing the exact cache
    lines in Episodes.js, and a pointer to duplicate #7. That result makes the core question concrete
    and introduces the two actors: the requester who asks and decides, and the contract owner who
    answers for authority. The actor grid and three questions turn the example into a method.
    Section 2 opens the same workflow and shows that every behavior the audience just saw traces to
    a frontmatter block, with safe outputs as the only repository write path and the compiled lock as
    the reviewable artifact; the anchor lands here. Section 3 runs the method against the other two
    trigger shapes: a scheduled digest whose missing row shows why read-derived claims get spot-checked,
    and the label-driven event pattern that sets up the capstone. Section 4 is the climax for the
    platform owner: the defensive layers, a real integrity exception recorded with owner, controls,
    and a retest trigger, audit cost per run, failures that filed themselves as issues, and the #110
    lifecycle ending at draft PR #193 awaiting a person. Close with fit boundaries and the three-question
    worksheet so the audience leaves with a first workflow to stage in their own repository.

  sectionOrder:
    - "1. Choose the Judgment and Its Owner"
    - "2. Write a Reviewable Authority Contract"
    - "3. Test the Contract Against Real Work"
    - "4. Operate the Boundary"

  sectionModes:
    "1. Choose the Judgment and Its Owner":
      emphasis: medium
      note: >
        Lead with the #202 /triage result as proof: the user-style bug title, the four labels with
        reasons, the cited Episodes.js episodeCache lines, duplicate #7, and the maintainer's follow-up
        (close #202, assign #7 to the cloud agent). Show the one-line trace from comment to maintainer
        decision. Name the requester and the contract owner explicitly. Follow with the three-column
        actor grid (Actions, agentic workflow, cloud agent) and the three questions. Budget 3–4 slides.
    "2. Write a Reviewable Authority Contract":
      emphasis: high
      note: >
        Split triage.md across two legible code slides: frontmatter first, then the abbreviated body.
        Pair them with the block-to-authority-question table. Make the point that the body steers and
        the frontmatter enforces: an instruction to close the issue has no safe output to act through.
        Show the compile command and the 76-line source to 2,203-line lock reveal with the four-part
        review model (people review source, CI checks lock drift, reviewers read lock diffs on
        permission or version changes, commit both together). Land the anchor on its own slide.
        Budget 5–6 slides.
    "3. Test the Contract Against Real Work":
      emphasis: medium
      note: >
        Recap the command pattern in one line and spend the time on the schedule pattern: the digest
        frontmatter (fuzzy schedule compiled to a scattered cron, create-issue max 1 with
        close-older-issues) beside the observed digest #209 sections. Give the omitted lang:node row
        its own callout as the reason to spot-check read-derived counts. Close with the three-row
        "who decides the agent acts" table, introducing the label-driven event pattern that section 4
        completes. Budget 3 slides.
    "4. Operate the Boundary":
      emphasis: high
      note: >
        This is the climax for the platform owner. One diagram slide for the six layers plus the
        firewall and staged mode. One slide for the integrity exception as a four-row record
        (observed, decision, remaining controls, review trigger) with the strict-mode compile message;
        report the 47.75 to 0.17 AIC friction change as an operational observation. One slide pairing
        the audit cost table (1.22 and 0.91 AIC per run) with the three self-filed [aw] failures and
        their recoveries. One capstone slide for #110 to draft PR #193: four narrow contracts, honest
        stops, and a draft awaiting a person. Finish with fit boundaries, the 15-minute / 1-hour /
        2–4-hour ladder, and the three-question worksheet. Budget 6–7 slides; the user has approved
        exceeding the default budget here when the content requires it, within the 30-slide cap.

  preamble: []
  appendix: []

  highlightMoments:
    - "One /triage comment on user-style bug #202 produced four allowlisted labels, cited the exact Episodes.js cache lines, and found duplicate #7 for 1.22 AI credits."
    - "Every behavior traces to frontmatter: 76 reviewed source lines compile to a 2,203-line lock whose only repository writes run in a separate safe-outputs job."
    - "The daily digest #209 omitted its lang:node row, so read-derived counts get the same spot-check a colleague's summary would."
    - "An integrity guard that rated every issue 'none' became an owned exception with remaining controls and a retest trigger, recorded beside the setting."
    - "Four label-triggered contracts carried #110 to draft PR #193, which waits for a person exactly where the contracts end."

# OPEN DECISION: Show the #110 lifecycle as a single capstone slide (current plan, keeps the deck near
# 24 slides) or give it a two-slide treatment with the implementation contract excerpt (adds depth for
# teams planning multi-stage workflows, pushes the deck toward 26 slides).
