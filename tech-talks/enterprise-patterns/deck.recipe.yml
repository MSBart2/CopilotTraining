# REFRESH DATE: 2026-08-10
# COUNCIL DECISION: REVISE
# RATIONALE: Preserve the thesis, section order, weighting, and demos while separating shared
# knowledge from the managed-settings control plane, adding migration readiness, and grounding
# ROI in product-backed directional metrics.

version: 1

deck:
  title: "Scaling GitHub Copilot Across Organizations"
  subtitle: "Enterprise Patterns for AI Adoption at Scale"
  tagline: "One change, all repos, instantly — from pilot teams to org-wide capability"

  agenda:
    - title: "Standards at Scale"
      takeaway: "Propagate organization-wide instructions across repositories."
      whyItMatters: "Consistency becomes structural instead of aspirational."
    - title: "Shared Skill Libraries"
      takeaway: "Publish vetted expertise as reusable organizational assets."
      whyItMatters: "One teams insight compounds across every other team."
    - title: "ROI Instrumentation"
      takeaway: "Use impact-dashboard ROI and agent-app activity metrics with explicit caveats."
      whyItMatters: "Leadership gets product-backed evidence without claiming audited attribution."

  arcToc: "Standards → Skills & Knowledge → Governance & Licensing → Adoption & Enablement"

  arcNarrative: >
    Open with the organizing problem: 50 teams each reinvent security rules, coding standards,
    and framework patterns, wasting 40+ hours per team while knowledge remains fragmented. S1
    resolves that fragmentation with organization-wide instructions that propagate a standards
    floor to every repository. S2 then multiplies institutional knowledge: Agent Skills encode
    reusable expertise and Knowledge Bases provide cross-repository context. Keep those knowledge
    mechanisms distinct from the managed-settings control plane; knowledge helps teams understand
    and act, while managed settings govern which enterprise choices teams may specialize. S3 makes
    the investment defensible through model policy, licensing, compliance controls, and a concise
    supported-model migration-readiness callout: enable and verify an approved replacement before
    affected workflows depend on it. S4 closes on adoption and proof. Give managed-settings
    coordination a dedicated slide showing the enterprise floor, permitted team specialization,
    and bounded merge behavior, then pair self-service enablement with product-backed evidence.
    Use impact-dashboard ROI directionally, join agent activity on stable agent_id, and avoid
    double counting nested and top-level interactions. Preserve the 16x platform-investment
    example as illustrative context, not audited attribution.

  sectionOrder:
    - "Organization-Wide Standards"
    - "Organizational Skills & Knowledge Bases"
    - "Governance & Licensing"
    - "Adoption & Enablement"

  sectionModes:
    "Organization-Wide Standards":
      emphasis: high
      note: >
        The foundational fix and early climax moment — one org-level instruction change reaches
        every repo instantly, ending the 50-teams × 40-hours reinvention tax. Cover what to
        standardize (security requirements, framework patterns, quality standards), monorepo
        nested playbooks, and the "50 teams = 50 reinventions without this" framing. This is the
        talk's organizing claim and must land with force before S2 can build on it. The "whoa"
        moment: one change propagates to 500+ developers with zero per-repo config.

    "Organizational Skills & Knowledge Bases":
      emphasis: medium-high
      note: >
        Agent Skills (GA) and Knowledge Bases (Enterprise Cloud only) encode reusable expertise
        and cross-repository context. Keep the audience segmentation and roughly three-slide
        treatment, but do not present shared knowledge as the enterprise control plane. Knowledge
        helps teams understand and act across domains; managed settings separately define the
        enterprise floor and the team-specific choices administrators permit. Preserve the
        knowledge-compounds-with-use moment, then hand off managed-settings coordination to its
        dedicated slide in Adoption & Enablement.

    "Governance & Licensing":
      emphasis: medium-high
      note: >
        Critical trust-builder for regulated industries and cost-conscious engineering leaders.
        Cover model access and auto-selection policies, flexible licensing with the existing
        30-40% cost-reduction claim, and compliance automation with audit trails, content
        filtering, and data residency. Add supported-model migration readiness as a concise
        callout, not a new section: enable an approved replacement in policy and verify it appears
        in affected model selectors before workflows depend on it. Land this control layer before
        ROI so the investment remains defensible.

    "Adoption & Enablement":
      emphasis: high
      note: >
        The adoption and evidence payoff. Keep the self-service 30-minute quick start and existing
        metrics framework, but give managed-settings coordination a dedicated slide: enterprise
        administrators lock the floor, mark permitted overrides, map team specializations, and
        preserve additive or least-restrictive behavior only within that boundary. Follow with
        product-backed measurement: treat impact-dashboard ROI as directional rather than audited
        attribution; join agent-app history on stable agent_id; and never add nested
        user_initiated_interaction_count to the top-level total. Preserve the 16x example as
        illustrative platform-investment context and the existing Adoption & Enablement rename.

  highlightMoments:
    - "16x ROI: 180 hours platform investment → 2,900+ hours saved year 1 (50 teams × 40 hrs reinvention avoided)"
    - "One org-wide instruction change reaches 500+ developers instantly — no per-repo config needed"
    - "Managed settings establish the enterprise floor while permitted team specialization preserves autonomy"
    - "Agent Skills (GA) vs Knowledge Bases (Enterprise Cloud only) — audience segmentation that matters"
    - "Product-backed directional ROI plus stable-ID agent activity — evidence without double counting or audited-attribution claims"

# OPEN DECISION: Should the S1 opening slide ("The Traditional Problem") be promoted to a
# standalone framing slide before S1, or does it serve well as S1's entry slide? Current
# structure embeds it inside Part 1 — acceptable if the hook lands within the first 60 seconds.
# Promote only if live delivery shows the problem framing needs more breathing room.
