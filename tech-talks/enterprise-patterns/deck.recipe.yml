version: 1

deck:
  title: "Scaling GitHub Copilot Across Organizations"
  subtitle: "Enterprise Patterns for AI Adoption at Scale"
  tagline: "One reviewed baseline can reach every repository; teams specialize inside its boundary."

  agenda:
    - title: "Encode the shared floor"
      takeaway: "Place organization, repository, file-pattern, and directory guidance where each belongs."
      whyItMatters: "Teams inherit repeatable context while local work keeps its own commands and constraints."
    - title: "Share knowledge with an owner"
      takeaway: "Choose skills for reusable expertise and knowledge bases for cross-repository context."
      whyItMatters: "The source, reviewer, and update path stay visible as guidance compounds."
    - title: "Measure and govern the boundary"
      takeaway: "Inspect policy, adoption, workflow movement, and directional ROI with their limits attached."
      whyItMatters: "Leaders can make the next investment decision with evidence they can explain."

  arcToc: "Set standards → Share knowledge → Govern evidence → Enable teams"

  arcNarrative: >
    Keep the approved four-part order. Part 1 opens inside the standards problem and
    proves where each instruction belongs, then shows an illustrative organization
    baseline, a review loop, and the assumptions behind the reinvention arithmetic.
    Part 2 separates Agent Skills from Knowledge Bases by the job each performs and
    makes source ownership and update review visible. Part 3 moves from that reusable
    capability into model, licensing, telemetry, tool, and compliance boundaries;
    migration readiness stays a concise, durable policy check. Part 4 gives managed
    settings its own control-plane proof, then connects onboarding and measurement to
    a clearly labeled illustrative investment model. The memorable reveal is one
    organization policy floor with permitted team specialization and observable
    results. A separate rollout section was rejected because it would dilute the
    approved four-part spine; the rollout becomes a practical decision path in Part 4.

  sectionOrder:
    - "Organization-Wide Standards"
    - "Organizational Skills & Knowledge Bases"
    - "Governance & Licensing"
    - "Adoption & Enablement"

  sectionModes:
    "Organization-Wide Standards":
      emphasis: high
      note: >
        Land the practical selector: repository-wide organization guidance,
        repository context, file-pattern instructions, and nearest directory playbooks.
        Show an illustrative instruction fragment beside its scope and review evidence.
        Keep the 50-team calculation explicitly hypothetical and name its assumptions.
    "Organizational Skills & Knowledge Bases":
      emphasis: medium-high
      note: >
        Give each mechanism a distinct job: skills encode reusable procedures and
        knowledge bases retrieve context across indexed repositories. Show an
        illustrative query and a human-owned source, review, and update path.
    "Governance & Licensing":
      emphasis: medium-high
      note: >
        Make authority, policy, and evidence boundaries visible across model access,
        current licensing terms, telemetry destinations, tool discovery, and compliance
        review. Treat legacy savings and outcome figures as estimates or illustrations,
        never as measured results.
    "Adoption & Enablement":
      emphasis: high
      note: >
        Prove managed settings with an enterprise floor, explicitly overridable keys,
        team mappings, bounded merge rules, and a validation step for a multi-team user.
        Pair product-backed adoption signals with their caveats, a self-service kit,
        and a transfer plan teams can adapt.

  preamble: []
  appendix: []

  highlightMoments:
    - "A single organization instruction change can set a baseline across repositories; local standards still need owners and verification."
    - "Agent Skills encode reusable expertise; Knowledge Bases retrieve context across indexed repositories."
    - "Managed settings permit named team specialization beneath enterprise choices, with explicit merge and product boundaries."
    - "The 16x saved-hours ratio is an illustrative scenario calculation, not audited attribution or a customer result."
    - "Impact-dashboard ROI is directional; agent activity uses stable agent_id and avoids nested-count double counting."

