# Refresh 2026-10-23 (structural, user-directed). Decision: restructure.
# Independent critique: rubber-duck subagent (cross-model; primary is a Claude model).
# Reconciliation:
# - Rejected: cap at 30 slides with ~3 slides per part. The user directed full treatment per agent
#   (under 10 each) and Part 4 as long as needed; budgets tightened instead to 6/6/5 + 13.
# - Accepted: one climax. Measure drops to medium; Part 4 is the payoff, anchored on
#   "Every push reopens the question; a person ends the loop."
# - Accepted: vary the shared skeleton; merge setup with context, and vary the proof per part
#   (issue rewrite, browser gap, enforceable gate).
# - Accepted: Part 4 closes with three synthesis slides plus one transfer slide, not six.
# - Accepted: "staged quality issue" rather than "defect"; every timing labeled as one observed run.
# - Accepted: state that #221 remained draft with no merge decision; #210 supplies the merged decision record.
# - Accepted: role labels where authority changes; first-mention preview labels for Copilot approvals,
#   Fix with Copilot, and AI findings.
# - Accepted: direct-positive phrasing in the narrative.version: 1

deck:
  title: "Copilot on GitHub"
  subtitle: "Produce, Reason, Measure"
  tagline: "Three agents, one pull request. A person ends the loop."

  agenda:
    - title: "Know which agent does which job"
      takeaway: "The cloud agent produces the change, code review reasons about intent, and Code Quality measures it against rules."
      whyItMatters: "Teams that conflate the three ask each one for evidence it never produces."
    - title: "Read a pull request as a sequence of events"
      takeaway: "See which step a person invokes, which fires automatically, and which commit each agent saw."
      whyItMatters: "Order of operations explains every surprising review, missing finding, and stale open issue."
    - title: "Wire the loop and decide who ends it"
      takeaway: "Turn on re-review after each push, hand findings back to the agent, and promote one setting at a time."
      whyItMatters: "Each promotion changes who holds authority, so the team chooses it deliberately and can reverse it."

  arcToc: "Produce → Reason → Measure → Wire It Together"

  arcNarrative: >
    Cold open on the one-page flow: a swimlane of Person, Cloud agent, Code review, and Code Quality across
    generic pull request events, every cell marked 👤 human-invoked, ⚡ automatic, or ⏸ waits for a person.
    The audience sees the whole system and the anchor line, "Every push reopens the question; a person ends the
    loop," before any part. Parts 1-3 then light one row at a time and teach each agent in isolation with the
    same visual rhythm (job and wake event, setup and use, evidence and authority boundary), so the audience
    distinguishes each agent by the evidence it returns. Each part varies its proof: the issue rewrite, the
    browser gap, the enforceable gate. FanHub supplies drill-down proof in "In practice" panels. Part 4 is the payoff:
    one issue walked step by step on the same swimlane, with the general rule as the headline and the #221
    event as the proof, showing measurement within seconds, review two minutes later, re-review after every
    push, a stale thread carried forward, and a staged quality issue caught by both agents with different framing.
    Part 4 closes with three synthesis slides (what ends the loop with the evidence and decision record;
    configuration, promotion, and cost; the event-map recap) and a transfer exercise that replays the audience's last merged PR
    against the event map. Rejected alternative: keeping the #210 decision cold open, because it teaches the
    authority conclusion before the audience can tell the three agents apart.

  sectionOrder:
    - "1. Produce: Copilot Cloud Agent"
    - "2. Reason: Copilot Code Review"
    - "3. Measure: GitHub Code Quality"
    - "4. Wire It Together"

  sectionModes:
    "1. Produce: Copilot Cloud Agent":
      emphasis: high
      note: >
        Budget 6 slides. Opener with the Produce row lit on the swimlane and the
        value statement. Triggers table with 👤/⚡ badges (assign, Agents tab plan, @copilot / Fix with Copilot (public preview) /
        @Copilot on a finding). Setup: copilot-setup-steps, firewall, MCP, custom agents. Context: the issue
        template (problem, acceptance criteria, scope) beside the #159 rewrite as In practice. Use: the six-question
        acceptance check and steering by comment. Troubleshoot: signal → cause → move table with the #221
        lockfile commit and the x/crypto justification. Authority: platform-fixed boundary. Keep good-fit and
        keep-human-led lists folded into the opener. Merge setup and context onto one slide if density allows.
    "2. Reason: Copilot Code Review":
      emphasis: high
      note: >
        Budget 6 slides. Triggers table must make Review new pushes unmistakable:
        without it, the first automatic review is the only one. Setup: rulesets, Lite versus Balanced effort with
        credit ranges, authorized-users switch. Context: shared instruction files and excludeAgent. Use: check
        which commit the review saw, read assessment with open-issues list, send fixes back, close threads
        deliberately, run what the review left unexecuted. In practice: #198 inert Retry beside four passing tests.
        Troubleshoot: plan-only review, 🟢 with "1 open issue", no review after fix. Authority: advisory until
        Copilot approvals (preview) are turned on, with preview status labeled.
    "3. Measure: GitHub Code Quality":
      emphasis: medium
      note: >
        Budget 5 slides. Standard versus AI findings table (reproducibility, status,
        where, gate capability), with AI findings labeled public preview. Triggers: every push, within seconds, not held at Approve and run. Setup: enable,
        ruleset with threshold and coverage, Evaluate before Active. Use: inline finding, Commit suggestions,
        @Copilot handoff, dismiss with reason; #201 Autofix and #199 coverage gate as In practice drill-downs.
        Troubleshoot: no findings, two CodeQL checks, unexpected block. Authority: the only agent whose result can
        block a merge on its own; AI findings stay advisory.
    "4. Wire It Together":
      emphasis: high
      note: >
        About 13 slides: opener, 8 step slides, three synthesis slides, one transfer slide. This is the climax. Every step slide uses the swimlane strip on top with
        the active step lit, the general rule as the headline, and a compact In practice panel from #221 with
        time and SHA, labeled "Observed on FanHub #221, one run, 2026-10-23". Name the role (requester, PR owner,
        reviewer, platform owner) on every 👤 step. Group the 13 README steps into about 8 step slides: assign and plan commit; Code Quality and
        review on the plan commit; lockfile push and 🟡; self-correction and 🟢 with a stale open issue; person
        resolves and asks @copilot; rework push and 🟢 No open issues; staged push caught by both (label STAGED quality issue);
        @Copilot on the finding and final 🟢. Fold the four facts from the run into the step slides where each
        is observed. Synthesis: (1) what ends the loop + evidence on the final head + decision record, stating
        that #221 remained draft with no merge decision and using #210 as the merged example, with "tests were
        not executed" visible; (2) configuration map + promotion ladder + cost in one line; (3) the event-map
        recap. Transfer: replay your last merged PR against the event map, with What You Can Do Today folded in.

  preamble: []
  appendix: []

  highlightMoments:
    - "Observed on FanHub #221: Code Quality started within about five seconds of every push; code review followed about two minutes later."
    - "With Review new pushes on, code review ran on all eight pushes of #221; without it, the first automatic review of #210 saw only the plan commit."
    - "Code review flagged a lockfile-only commit and the agent's next push corrected it with no person involved."
    - "On a staged quality issue, Code Quality named the rule and offered a fix, code review explained the cost, and one @Copilot reply cleared both."
    - "Every Copilot review stated that tests were not executed; a person decides what evidence is enough to merge."

# OPEN DECISION: total deck is ~36 slides for 60 minutes. If rehearsal runs long, cut Part 4 step slides 2 and 4 into their neighbors first.
