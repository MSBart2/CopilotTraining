# Conversion recipe approved autonomously under the user's explicit waiver of review pauses.
# Approved 2026-10-30. Preserve the 2026-10-23 structural refresh and its FanHub proof;
# this is a format conversion, not a current-news refresh.
version: 1

deck:
  title: "Copilot on GitHub"
  subtitle: "Produce, Reason, Measure"
  tagline: "Three agents, one pull request. A person ends the loop."

  agenda:
    - title: "Know which agent does which job"
      takeaway: "The cloud agent produces, code review reasons, and Code Quality measures against rules."
      whyItMatters: "Each agent returns different evidence for the same pull request."
    - title: "Read a pull request as a sequence of events"
      takeaway: "Identify the human action, automatic trigger, and commit each agent saw."
      whyItMatters: "The event order explains missed reviews, findings, and stale threads."
    - title: "Wire the loop and decide who ends it"
      takeaway: "Re-review after pushes, route findings to rework, and promote authority deliberately."
      whyItMatters: "A person accepts residual risk and decides when the change ships."

  arcToc: "Produce → Reason → Measure → Wire It Together"

  arcNarrative: >
    Keep the approved thesis and section order. Open with the event model: a person starts
    work, the cloud agent produces a draft, code review and Code Quality wake on configured
    events, pushes can reopen both, and a person ends the loop. Parts 1–3 distinguish the
    agents by their job, trigger, context, returned evidence, recovery path, and authority.
    Preserve the issue rewrite, browser-gap review, ruleset gate, and detailed FanHub #221
    event walk as practical proof. Label the #221 timings as one observed run dated
    2026-10-23, and the staged quality issue as deliberately introduced. End with the
    decision record, configuration and promotion ladder, event-map synthesis, and transfer
    exercise. The target is 55:50 speaking time from the 60-minute README duration, leaving
    4:10 for questions. Keep all 39 existing slides; consolidate no teaching proof.

  sectionOrder:
    - "1. Produce: Copilot Cloud Agent"
    - "2. Reason: Copilot Code Review"
    - "3. Measure: GitHub Code Quality"
    - "4. Wire It Together"

  sectionModes:
    "1. Produce: Copilot Cloud Agent":
      emphasis: high
      note: >
        Preserve the six focused slides after the opener. Establish good-fit versus
        human-led work, three invocation paths, setup environment, the issue as prompt,
        six-question acceptance check, troubleshooting signals, and the platform-fixed
        authority boundary. The issue rewrite (#159) and observed lockfile/dependency
        decisions (#221) are proof, not decoration.
    "2. Reason: Copilot Code Review":
      emphasis: high
      note: >
        Preserve Review new pushes as the decisive trigger; show settings, Lite/Balanced
        effort and cost as dated estimates, shared instructions and excludeAgent, the
        commit-specific assessment and open-issues list, and recovery. Use #198 to prove
        that passing tests and a green build can coexist with an inert browser interaction.
        Mark Copilot approvals as public preview and advisory by default.
    "3. Measure: GitHub Code Quality":
      emphasis: medium
      note: >
        Preserve standard versus AI finding differences and dated status, the push trigger,
        Evaluate-to-Active promotion, #201 Autofix and #199 coverage-gate proof, and
        troubleshooting. Separate Code Quality from code review and security CodeQL.
        Standard findings can gate at configured thresholds; AI findings remain advisory.
    "4. Wire It Together":
      emphasis: high
      note: >
        Keep the eight-step #221 event walk, naming the actor, event, commit, evidence,
        and date on each slide. Identify 2026-10-23 as one observed run; mark the
        nil-guard commit as staged. Keep #221's draft/no-merge status separate from #210's
        maintainer merge decision and independently executed tests. Close with the evidence
        record, configuration/promotion/cost, a before/after event-model synthesis, and a
        concrete replay of the audience's last merged PR.

  preamble: []
  appendix: []

  highlightMoments:
    - "On FanHub #221, Code Quality started about five seconds after each push; code review followed about two minutes later in one observed run."
    - "With Review new pushes enabled, code review ran on all eight pushes of #221, including plan commits."
    - "Code review found an inert Retry interaction in #198 even though four component tests passed and the build was green."
    - "On a deliberately staged quality issue, Code Quality named a rule and offered Autofix while code review explained the cost."
    - "A person decides what evidence is enough to merge; every review on #221 said tests were not executed."

  slides:
