# Recipe refresh 2026-11-06 (resurrection and conversion to native). Decision: restructure.
# Approved by the user on 2026-11-06 in chat.
# Rationale: the March 2026 talk toured five tools (Agent Debug panel, Chat Debug view,
# thinking tokens, a Diagnostics view, extension logs). By v1.145 the product is one evidence
# trail: the Agent Customizations editor and Discovery events show what loaded, the Chat Debug
# view shows what the model received, the Agent Debug Logs panel (Logs, Summary, flow chart,
# Cache Explorer) shows what the agent did, /troubleshoot reads those logs to explain a run,
# and file logging plus OpenTelemetry make the trail persistent and shareable. The Diagnostics
# chat action, Edit Mode, and the /docs/copilot/* URLs are gone.
# Facts: VS Code release notes v1.110 through v1.145 and docs under /docs/agents and
# /docs/agent-customization, gathered 2026-11-06. Version-unverified items carry [verify].
# Structure considered and rejected: one part per tool (the old talk). It teaches a menu of
# views; the question order teaches a practitioner how to localize a failure.
version: 1

deck:
  title: "Copilot Chat Internals"
  subtitle: "Read the Evidence Every Agent Run Leaves"
  tagline: "What loaded, what was sent, what it did, and the trail you keep."

  agenda:
    - title: "Localize a surprise in four questions"
      takeaway: "Ask in order: did my setup load, what did the model receive, what did the agent do, and can I keep the trail."
      whyItMatters: "Each answer rules out a whole class of causes, so a surprise becomes a located fault in minutes."
    - title: "Let the agent explain its own run, then check it"
      takeaway: "Use /troubleshoot on the current or a past session, then confirm its answer in the Logs view."
      whyItMatters: "The explanation is fast; the log events make it trustworthy."
    - title: "Keep the trail for your team"
      takeaway: "Turn on file logging, export a session, and send OpenTelemetry traces to a collector."
      whyItMatters: "A teammate or a dashboard can inspect the same evidence after the window closes."

  arcToc: "Did It Load → What Was Sent → What It Did → Keep the Trail"

  arcNarrative: >
    Open cold on one ordinary surprise: the agent ignored a team instruction. Four questions
    appear beside it, each pointing at the view that answers it; that picture is the talk.
    Part 1 answers "did my setup load?" with the Agent Customizations editor and Discovery
    events (loaded, skipped, rejected), using an applyTo glob miss as the worked example.
    Part 2 answers "what did the model receive?" with the Chat Debug view, the context
    window indicator, compaction, and Cache Explorer. Part 3 is the climax: the Agent Debug
    Logs panel shows tool calls, hooks, subagents, and errors, and /troubleshoot reads the
    same events to explain the run; the anchor moment is the agent naming the skipped file,
    followed by the presenter confirming it in the Logs view. Part 4 makes the trail durable:
    file logging, export and import, OpenTelemetry spans, and a symptom-to-view decision map
    practitioners take to their own repository.

  sectionOrder:
    - "1. Did My Setup Load?"
    - "2. What Did the Model Receive?"
    - "3. What Did the Agent Do?"
    - "4. Keep the Trail"

  sectionModes:
    "1. Did My Setup Load?":
      emphasis: medium
      note: >
        Most surprises start here, so it comes first and moves fast. Chat: Open Customizations
        opens the Agent Customizations editor (instructions, prompts, agents, skills, hooks,
        MCP servers, plugins) with source and errors per file. Discovery events in Agent Debug
        Logs say loaded, skipped, or rejected, with the reason. Worked example: an
        .instructions.md whose applyTo glob misses the edited file. The Chat Customizations
        Evaluations extension lints instruction files for contradictions and ambiguity in the
        Problems panel [verify ship version]. Lens: Context.
    "2. What Did the Model Receive?":
      emphasis: high
      note: >
        Developer: Show Chat Debug View shows, per model request, the system prompt, user
        prompt, context, response, and tool responses; the proof move is finding the
        instruction text inside the system prompt. Then the context window: indicator with
        token use and session cost in AI credits (v1.126), automatic and /compact compaction
        and what it summarizes or omits, a new chat within the session, and subagents for
        isolation. Terminal output compression (chat.tools.compressOutput.enabled, v1.120)
        and deferred tools explain why context is smaller than expected. Cache Explorer
        diffs consecutive requests to the first divergence. Lenses: Context, Verification.
    "3. What Did the Agent Do?":
      emphasis: high
      note: >
        The anchor. Developer: Open Agent Debug Logs (Preview; renamed in v1.116) has Logs
        (flat or tree), Summary (tool calls, tokens, errors, duration), the agent flow chart,
        and Cache Explorer. Show subagents: stateless, transcript as a read-only peer chat in
        the Agents window, model and active tool shown inline (v1.131). Reasoning: effort and
        context size in the model picker (v1.142) and the View Mode verbosity control
        (Conversation, Compact, Verbose; chat.persistentProgressVerbosity, v1.145,
        Experimental). Centerpiece: /troubleshoot (Preview) asked "Which customizations were
        loaded, and did any fail?", then #session for a past run; the presenter confirms the
        answer in the Logs view. Boundary: the explanation is a hypothesis the events prove.
        Close with MCP server output and hooks (harness-specific; execute_hook spans).
        Lenses: Verification, Delegation.
    "4. Keep the Trail":
      emphasis: medium
      note: >
        github.copilot.chat.agentDebugLog.fileLogging.enabled writes JSONL that persists
        across sessions; chat.agentHost.agentDebugLog.enabled covers Agent Host sessions.
        Export produces OTLP JSON; import and #debugEventsSnapshot let a teammate inspect the
        same run. github.copilot.chat.otel.enabled and otel.otlpEndpoint emit invoke_agent,
        chat, execute_tool, and execute_hook spans (v1.119; github.copilot.* attributes,
        v1.122); admins can mandate an endpoint in managed settings (v1.128). Authority: the
        org decides where traces go. End on the symptom-to-view decision map and a short
        "what changed since v1.110" list. Lenses: Verification, Authority.

  preamble: []
  appendix: []

  highlightMoments:
    - "/troubleshoot reads the agent's own debug events and names the instruction file that was skipped and why."
    - "Discovery events report every customization as loaded, skipped, or rejected, so a silent miss becomes a visible line."
    - "The Chat Debug view shows the exact system prompt; if your instruction text is absent, the model never saw it."
    - "Cache Explorer finds the first point where two consecutive requests diverge."
    - "OpenTelemetry spans (invoke_agent, chat, execute_tool, execute_hook) put every agent run on the team's existing dashboards."

