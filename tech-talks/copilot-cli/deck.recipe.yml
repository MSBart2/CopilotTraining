version: 1

deck:
  title: "GitHub Copilot CLI: AI at the Point of Work"
  subtitle: "Bring AI to Where Work Lives and Steer It from Anywhere"
  tagline: "Close distance across intent, complexity, context, time, and geography."

  agenda:
    - title: "Turn Intent into Evidence"
      takeaway: "Shape an ambiguous Docker request into an approved plan and two targeted checks."
      whyItMatters: "Clarifying scope gives the operator a review point before execution."
    - title: "Choose Autonomy with Confidence"
      takeaway: "Match interactive, CI, parallel, delegated, and scheduled work to explicit boundaries."
      whyItMatters: "Permissions, containment, review, and cost define a trustworthy handoff."
    - title: "Keep Context and Reach"
      takeaway: "Preserve useful session state, recover wrong turns, and steer work where it runs."
      whyItMatters: "A durable session helps only when evidence and human authority remain visible."

  arcToc: "Clarify intent → Choose a mode → Keep context → Steer remotely"

  arcNarrative: >
    Plan Mode opens with the five-part Distance Model and closes the intent gap
    through the source talk's illustrative Docker diagnosis. Operating Modes
    closes the complexity and time gaps by pairing interactive, headless,
    fan-out, delegated, and scheduled work with explicit permission,
    containment, review, and cost boundaries. Context Management establishes
    the session as a durable, recoverable unit of work and creates a focused
    breath before the climax. Remote Sessions completes the geography arc
    through device handoff and host-local forensics, with execution locality
    and operator locality shown together. The sequence prepares the audience
    to understand what runs, what persists, and what stays under human
    approval. Quantified scenarios remain labeled as estimates or illustrations;
    no new release or product-news content is added.

  sectionOrder:
    - "Plan Mode: Collaborative Planning Before Implementation"
    - "Interactive Mode vs Programmatic Mode vs Cloud Delegation"
    - "Automatic Context Management and Repository Memory"
    - "Remote Sessions: The Last Distance Falls"

  sectionModes:
    "Plan Mode: Collaborative Planning Before Implementation":
      emphasis: medium
      note: >
        Preserve the five-part Distance Model, then tell one complete
        illustrative Docker story: ambiguous request, clarifying questions,
        operator-approved plan, two targeted checks, and an example port
        diagnosis. Keep steering and rejection as quality checkpoints.
        Treat the 45-minute/eight-attempt and eight-minute/two-check figures as
        source-talk estimates, not measured results. Keep model catalogs and
        exact release-dependent controls in notes.
    "Interactive Mode vs Programmatic Mode vs Cloud Delegation":
      emphasis: high
      note: >
        Build a task-and-boundary ladder: interactive diagnosis for uncertainty,
        copilot -p for reproducible CI reports, /fleet for parallel subtasks
        within one plan and host, ampersand delegation for asynchronous
        repository work, and session-scoped scheduled prompts for recurring
        patrol. Give each path its output, permissions, containment, human
        review, and cost boundary. Keep the 25-minute/5-minute CI values labeled
        as source estimates. Distinguish cloud sandboxing from cloud delegation.
    "Automatic Context Management and Repository Memory":
      emphasis: medium-low
      note: >
        Preserve both approved ideas: durable session context through
        auto-compaction, repository memory, /resume, and /chronicle; and
        turn-level recovery through /rewind, which restores Copilot-changed
        files while preserving developer-authored edits. Contrast /worktree as
        experimental isolation requiring Git. Include command syntax,
        storage, model/cost controls, sidebar mechanics, and version limits in
        presenter notes rather than feature-inventory slides.
    "Remote Sessions: The Last Distance Falls":
      emphasis: high
      note: >
        Deliver the geography payoff by showing execution locality alongside
        operator locality. Show an authorized host session handed to web or
        mobile, then use the walking incident and 12 GB log corpus as
        explicitly illustrative scenarios. Keep /fleet to one approved plan
        on one host; show multi-host work as separately steered sessions.
        Pair remote access with scoped permissions, host containment,
        enterprise policy, and human approval. Mention Agent Plugins as a
        dated consumer capability with a link to its dedicated talk. End with
        a staging-host action and an own-work transfer question.

  preamble: []
  appendix: []

  highlightMoments:
    - "Plan Mode structures a Docker diagnosis as clarifying questions, an approved plan, and two targeted checks; its source comparison is an estimate."
    - "A copilot -p CI step produces a reviewable failure report; the source's 25-minute and 5-minute figures are estimates."
    - "/rewind can restore Copilot-changed files while skipping developer-authored edits; Git remains an optional safety net."
    - "--remote lets an operator steer a host-local session without copying the illustrative 12 GB log corpus to a phone."

