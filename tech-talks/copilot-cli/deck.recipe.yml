    decision: restructure
    approvalStatus: "Approved 2026-11-03 by user: Approve the distance-first structure and opening scene; implement."
    alternativeConsidered: >
      Keep the current order and add distance labels/callbacks. This preserves more layout work but leaves planning, feature modes, and remote mechanics as the visible spine. The four-distance structure better answers why CLI exists while retaining the approved working artifacts.
    rejectedCoverage:
      - "Standalone mode-ladder scorecard: fold distinctions into actual placement examples and notes."
      - "Standalone fleet-work and fleet-across-machines: keep fleet and multi-host limits as optional notes; they interrupt this argument."
      - "Standalone remote-approval: fold policy continuity into the remote example and authority slide."
      - "Standalone compaction scorecard: merge commands into the next-plan proof."
      - "Agent roster, model catalog, and prerelease capabilities: no new evidence for the selected distances."
      - "Invented timing gains, live diagnoses, complete workflow extension, or zero-exposure claims."
    openingScene:
      name: "Within reach"
      concept: >
        Replace the physical cutaway with a full-width terminal investigation, visually dominant enough to read as a working instrument rather than a card in a diagram. A developer enters copilot beside a running service's shell context. Reveal one requested journal command, its short representative failure evidence, and Copilot's next diagnostic check. Four understated distance brackets annotate the same working scene: worker/work, intelligence/data, workflow/system, now/later. A small continuation strip carries the same session into a later moment; no fabricated completion time or repair result.
      motion: >
        Begin close on the prompt; reveal the service evidence and reasoning response; widen to expose the workflow and continuation strip. Brackets shorten once as useful context comes within operational reach. They do not depict moving the service, corpus, or model. The final frame remains fully legible and states the four distances.
      guardrails: >
        No nodes, connecting-edge topology, stacked cutaway, stock brain, decorative particles, or four generic feature tiles. Label this a conceptual representative sequence. Provider location remains explicit and separate from host tools. Keep product name and thesis prominent.
    publicationGate:
      relevant: "Developer/platform engineer needs to diagnose, explain, and continue a runtime task using approved evidence."
      compelling: "The terminal can put reasoning in the existing loop across places, processes, and time."
      actionable: "Choose one gap, execute a bounded task, inspect its artifact, and stop or recover when evidence fails."
