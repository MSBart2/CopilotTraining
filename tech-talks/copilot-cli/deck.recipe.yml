# 2026-11-03 · decision: restructure · approved by user.
# User: "Approve the distance-first structure and opening scene; implement".
# Baseline: 40 slides / 2500 seconds, planning → placement → context → remote.
# Make the user's four distances the section spine; preserve concrete proofs.
version: 1

deck:
  title: "GitHub Copilot CLI: Intelligence Within Reach"
  subtitle: "Bring intelligence to the work, and keep the worker within reach."
  tagline: "Close the distance between worker and work, intelligence and data, workflow and running system, now and later."
  agenda:
    - title: "Worker ↔ Work"
      takeaway: "Inspect Docker outputs and choose the next check in the same working loop."
      whyItMatters: "The developer can shape Copilot's next action beside the task."
    - title: "Intelligence ↔ Data"
      takeaway: "Start on staging, inspect the provider separately, and check a bounded source-backed finding."
      whyItMatters: "Reasoning can reach approved evidence without manually carrying the corpus."
    - title: "Workflow ↔ Running System"
      takeaway: "Run copilot -p in failed CI and create a reusable staging investigation."
      whyItMatters: "An existing workflow can return a source-backed explanation alongside its result."
    - title: "Now ↔ Later"
      takeaway: "Verify what survives delegation, interruption, a later run, and a device change."
      whyItMatters: "The practitioner can continue without guessing which state or environment remains."
  arcToc: "Worker ↔ work → Intelligence ↔ data → Workflow ↔ system → Now ↔ later"
  arcNarrative: >
    Answer why CLI exists: it can reduce the distance between the person, the evidence, the process, and the next useful action. This is the talk's practitioner thesis, not a claim about the product's historical origin or superiority over other surfaces. Begin with a developer investigating a service from a terminal. The title scene makes useful proximity visible through one concrete investigation rather than stacked planes or nodes. Introduce the four distances before navigation; make them the navigation. First keep the worker and work in one inspectable request/tool/result loop: plan a Docker investigation, observe two checks, choose the next action. Then follow decisive evidence to staging. Separate host-side tools from model inference; local-model selection is one deliberate option. A log-host example demonstrates bounded analysis without manually carrying the corpus. Cloud placement closes distance to repository work, not host-only state. Next put reasoning inside the running process: CI returns a proposed why beside its failed test; dynamic workflows preserve the collection and analysis procedure. Permissions and containment make this proximity bounded. Finally cross time: delegate now/review later, repeat an investigation, schedule within a live session, retain checked context, recover a wrong turn, and keep the same host investigation reachable from another device. Remote steering keeps the worker close as attention moves; it is not durable unattended execution. Cloud continuation preserves different state. End by revisiting all four distances with their concrete artifacts. Every teaching slide exposes what is separated, the CLI action that brings it closer, and an observable consequence. A primary distance is a narrative lens; capabilities can close several distances.
  sectionOrder:
    - "Worker ↔ Work"
    - "Intelligence ↔ Data"
    - "Workflow ↔ Running System"
    - "Now ↔ Later"
  sectionModes:
    "Worker ↔ Work":
      emphasis: medium
      note: >
        Audience question: can I ask, inspect, and decide where I am already working? Open with the developer at a failing backend, not a Plan Mode feature introduction. Planning earns space as the short path from an ambiguous request to inspectable action. Preserve the representative Docker commands and valid 5001:5000 mapping. Land the visible payoff: Copilot reads host tool output, revises its explanation, and proposes a probe in the same working loop. Manual redirect keeps evidence intact. No repair, time saving, or HTTP success is claimed without observation.
    "Intelligence ↔ Data":
      emphasis: high
      note: >
        Audience question: can help reach the evidence that decides this task? Lead with SSH then copilot on staging, because it proves execution placement. Then show provider endpoint inspection and local Ollama discovery as a separate inference choice. Host-local tools do not mean host-local inference, offline operation, or zero data movement. Make log-host analysis a command/source/aggregate proof rather than another generic terminal request. Show a labeled synthetic source and expected aggregate if no live run is available. Model, tool, steering, and authority distinctions remain in notes and concrete scene labels; remove the standalone four-decision scorecard. End with the choice: host evidence belongs on its host; a repository task may fit cloud.
    "Workflow ↔ Running System":
      emphasis: high
      note: >
        Audience question: can the process ask for an explanation at the moment it has the evidence? CI is the centerpiece: preserve failure-gated Actions YAML running copilot -p, captured log, why.md/job summary, and the original failed test status. Show a source-cited proposed why. Follow with the three-slide dynamic-workflow lesson: reusable process, natural-language creation/review/registration, invocation and report. It is extension code in public preview, not YAML or a supplied complete extension. Synthetic reports and the tested stub-agent core remain distinct from live Copilot results. Workflow reuse also bridges time. Place permission decisions and sandbox reach beside the process they constrain. Keep assisted permissions GA, managed-policy recovery, MXC/platform limits, and best-effort file checks accurate. Fleet stays an optional contrast in notes, not an orchestration detour.
    "Now ↔ Later":
      emphasis: high
      note: >
        Audience question: what can I carry forward without starting over? Distinguish the thing preserved in every example: delegated task/PR, scheduled intent, checked conversation context, reviewed repository guidance, recoverable edits, running original-host session, or cloud files/in-progress work. Recap workflow-definition reuse here without repeating its setup tutorial. Schedules are experimental and active- session-only, not a durable scheduler. Combine compaction mechanics and the next-plan check into one evidence-focused slide. Reframe rewind as recovering useful progress. Remote control demonstrates worker reach across a change of device; require the host/session to stay alive and keep policy intact. Fold the repeated remote-approval slide into this example and the Part 3 authority slide. Connected-cloud continuation needs identity, files, actual test evidence, and a supported second client; it does not migrate staging state. End with one own-work distance, artifact, owner, and stop signal.
  preamble: []
  appendix: []
  highlightMoments:
    - "Copilot uses two Docker outputs to revise its explanation within the developer's working loop."
    - "The staging command shows exactly where tools run; provider inspection separately establishes where inference runs."
    - "A failed CI job returns a proposed why beside its original failure evidence."
    - "A reviewed workflow preserves the investigation procedure while agents interpret fresh evidence."
    - "The practitioner continues the same investigation elsewhere and verifies which host and state remain."
