version: 1

refresh:
  talk: "tech-talks/copilot-cli"
  cutoff: "2026-08-25"
  feed:
    url: "https://developer.microsoft.com/api/changelog/rss"
    checked: "2026-08-25"
    lastBuildDate: "Tue, 25 Aug 2026 20:00:07 GMT"
  status: approved
  approved: "2026-08-25"
  updateLevel: content
  rationale: >
    Same-day named-talk refresh after the 2026-08-25 apply. Microsoft feed since
    the README cutoff has no CLI news. First-party chronicle and command-reference
    pages now name /chronicle improve (not instructions) and document /chronicle
    standup as a schedulable exception. Those are wording/accuracy patches inside
    the existing S3 climax. Thesis, section order, and phone-steering demo stay.
  userEmphasis:
    - "Refresh the copilot-cli deck using the cheap path — no council, no wipe."

  accepted:
    - title: "/chronicle improve replaced /chronicle instructions"
      published: "2026-08-25"
      source: "https://docs.github.com/en/copilot/how-tos/copilot-cli/use-copilot-cli/chronicle"
      verified: "2026-08-25"
      releaseStatus: ga
      importance: supporting
      targetSection: "Session History and `/chronicle`"
      action: replace
      summary: >
        First-party chronicle how-to and CLI command reference now list
        standup, tips, cost tips, search, improve, reindex, and skills
        subcommands. The talk still names /chronicle instructions as the S3
        climax. Replace that command with /chronicle improve. Keep the same
        climax: propose and apply updates to .github/copilot-instructions.md.
      limitations:
        - "improve is scoped to the current repository or working directory."
        - "Do not promote cost tips, search, or skills subcommands into new slides."
      recipeImpact: confirm
      slideImpact: patch
    - title: "/chronicle standup is a documented schedulable slash command"
      published: "2026-08-25"
      source: "https://docs.github.com/en/copilot/reference/copilot-cli-reference/cli-command-reference"
      verified: "2026-08-25"
      releaseStatus: experimental
      importance: supporting
      targetSection: "Scheduled Prompts: `/every` and `/after`"
      action: update
      summary: >
        Command reference examples schedule /chronicle standup. Schedule-prompts
        how-to still says built-in slash commands such as /clear cannot be
        scheduled. Tighten the talk so the ban is not absolute: user-invocable
        skills plus documented schedulable slash commands such as /chronicle
        standup. Do not invent a catalog of every schedulable command.
      limitations:
        - "/every and /after remain experimental and session-scoped."
        - "Most built-in slash commands still cannot be scheduled."
      recipeImpact: none
      slideImpact: none

  ignored:
    - title: "Visual Studio Code 1.135 (Insiders)"
      source: "https://code.visualstudio.com/updates/v1_135"
      reason: >
        Feed review item for vscode-latest and chat internals. Does not change
        Copilot CLI commands, sessions, or --remote steering.
      relatedTalks:
        - "tech-talks/vscode-latest"
        - "tech-talks/copilot-chat-internals"
    - title: "1.0.81-* prerelease line"
      source: "https://github.com/github/copilot-cli/releases"
      reason: >
        Latest stable remains v1.0.80. Crash-restore, copilot app, defaultMode,
        and Ctrl+Space voice stay off the talk until a stable release or docs.
      relatedTalks: []
    - title: "security-review built-in agent in the command reference"
      source: "https://docs.github.com/en/copilot/reference/copilot-cli-reference/cli-command-reference"
      reason: >
        Command reference lists security-review; the practitioner how-to roster
        still lists six agents. Do not expand the roster until the how-to page
        or a stable weekly agrees.
      relatedTalks: []

  removals:
    - "Replace `/chronicle instructions` with `/chronicle improve` in README and deck."
    - "Replace the absolute 'built-in slash commands cannot be scheduled' line."

  anomalies:
    - "npm run content:route -- --since DATE still swallows --since. Use node scripts/content-router.mjs --since DATE."
    - "No copilot-cli decisions are proposal-created in ledger.json. Do not invent ledger rows."
    - "Latest stable CLI release is still v1.0.80 (2026-08-14). 1.0.81-* is prerelease."

  recipeReview:
    required: false
    question: >
      Not required. Command rename and schedule-exception wording stay inside
      the existing S3 climax.

  validation:
    firstPartySourcesVerified: true
    readmePatched: true
    recipeApproved: false
    slidesRegenerated: false
    deckBuildPassed: true
