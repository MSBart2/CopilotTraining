  updateLevel: structural
  rationale: >
    The October 31 native conversion explicitly excluded product-news updates;
    its source verification and prior refresh stop at August 25. Review that
    evidence gap as well as October 31 through the feed build. Connected cloud
    sessions, local model discovery, GA sandboxing, assisted permissions, and
    dynamic workflows strengthen the user's distance thesis. Propose a revised
    decision model and cloud-continuity proof alongside the existing host-local
    demonstration. Apply the approved README, recipe, deck, and directly
    related walkthrough updates.
  userEmphasis:
    - "Minimize distance between worker and work, intelligence and data, workflow and running system, now and later."
    - "Fit release updates into those relationships rather than adding a feature inventory."
    - "Keep the staging investigation as a reusable code-defined process combining commands, agent reasoning, and a reviewable report; checkpoints are optional detail."

  framework:
    thesis: "Bring intelligence to the work, and keep the worker within reach."
    distances:
      - "Worker to work: choose an execution environment and a steering surface."
      - "Intelligence to data: put the right model and tools near decisive evidence."
      - "Workflow to running system: inspect, act, and verify within explicit access boundaries."
      - "Now to later: preserve context and bounded work across interruptions."
    proofQuestions:
      - "What is separated?"
      - "What brings it closer?"
      - "What observable result improves?"
    boundary: >
      Reduce distance to execution while keeping approval deliberate. Model
      location, tool location, session continuity, and permission policy are
      separate decisions.

  accepted:
    - title: "Connected cloud sessions and cloud sandboxes are generally available"
      published: "2026-10-28"
      source: "https://github.blog/changelog/2026-10-28-work-from-anywhere-with-a-new-connected-copilot-cloud-experience"
      corroboration:
        - "https://docs.github.com/en/copilot/concepts/security-governance-and-network-settings/about-cloud-sandboxes"
        - "https://docs.github.com/en/copilot/concepts/copilot-surfaces/copilot-on-github"
      verified: "2026-11-02"
      releaseStatus: ga
      importance: headline
      distance: ["worker to work", "now to later"]
      targetSection: "Part 2 / Part 4"
      targetSlides: ["cloud-containment", "delegate-cloud", "cloud-continuity", "before-after"]
      action: replace
      summary: >
        Replace the experimental cloud-sandbox account with copilot --cloud,
        then distinguish a cloud session continued across clients from remote
        steering of a session still executing on its original host. Cloud
        sandbox snapshots preserve files and in-progress work for resumption.
        Teach Cloud versus Actions as an environment choice, with CLI local
        execution still the default. Keep the existing host-local forensics
        demonstration and add a compact cross-client cloud-continuity proof.
      proof: >
        Start a low-risk cloud task, inspect its changed file and test evidence,
        then continue the same session from another supported client. Separately
        inspect a remote-controlled host session and identify its execution host.
      limitations:
        - "Cloud GA is announced for paid Copilot plans; confirm organization access."
        - "copilot --cloud is interactive and cannot be combined with -p or -i."
        - "Cloud and Actions environments are selected at session start; changing environment requires a new session."
        - "Actions-only setup steps and runner requirements still require Actions."
        - "The announcement says cloud-sandbox billing begins in November 2026 using a shared Actions compute entitlement; confirm current rates before a demo."
        - "Do not interpret the announcement's cloud-default wording as changing ordinary CLI sessions to cloud execution."
      recipeImpact: restructure
      slideImpact: replace-demo

    - title: "Discover local Ollama models inside Copilot CLI"
      published: "2026-10-07"
      source: "https://github.blog/changelog/2026-10-07-discover-local-models-in-github-copilot-cli"
      corroboration:
        - "https://docs.github.com/en/copilot/how-tos/copilot-cli/customize-copilot/add-llm-models"
        - "https://github.blog/changelog/2026-10-09-github-copilot-weekly-releases-october-5"
      verified: "2026-11-02"
      releaseStatus: "documented; announcement starts with v1.0.94-0"
      importance: supporting
      distance: ["intelligence to data"]
      targetSection: "Part 2 · Intelligence ↔ Data"
      targetSlides: ["interactive-diagnosis", "local-model", "host-forensics"]
      action: expand
      summary: >
        Promote model placement from a provider footnote into one concrete
        decision: /model discovers an already-running local Ollama service;
        the practitioner checks provider and endpoint before adding a model
        and optionally switching the current session without restarting.
      proof: >
        Inspect the model endpoint and discovery status, add a prepared local
        model, and run a bounded task over synthetic repository evidence.
      limitations:
        - "The runtime and model must already be installed; discovery installs neither."
        - "The model must support tool calling and streaming."
        - "Automatic discovery is local-machine only; remote Ollama needs provider configuration."
        - "Local model selection does not enable offline mode or disable telemetry."
        - "COPILOT_OFFLINE=true does not prevent a configured remote provider from receiving context."
        - "Intelligent local routing is announced for future availability; do not demonstrate it as shipped."
      recipeImpact: revise
      slideImpact: patch

    - title: "Local sandboxing is generally available"
      published: "2026-10-07"
      source: "https://github.blog/changelog/2026-10-07-local-sandboxing-for-github-copilot-now-generally-available"
      corroboration:
        - "https://docs.github.com/en/copilot/concepts/security-governance-and-network-settings/about-cloud-and-local-sandboxes"
      verified: "2026-11-02"
      releaseStatus: ga
      importance: supporting
      distance: ["workflow to running system"]
      targetSection: "Part 3 / Part 4"
      targetSlides: ["authority-boundary", "local-containment", "staging-transfer"]
      action: replace
      summary: >
        Remove experimental labels and the experimental-startup prerequisite
        from local sandboxing. Show /sandbox enable and inspection of the
        actual policy. Explain how containment makes tool access near useful
        host evidence more bounded without replacing permission decisions.
      proof: >
        On a disposable supported host, inspect policy and compare an allowed
        test operation with a denied out-of-scope operation.
      limitations:
        - "Local sandboxing is off by default unless managed policy requires it."
        - "MXC provides OS-level restrictions, not a separate VM or container."
        - "Built-in in-process file tools check policy best-effort."
        - "Platform prerequisites and enforcement differ; current Windows support requires a suitable Windows 11 build."
        - "Windows proxy and host rules do not provide the same direct-connection protection as macOS and Linux."
      recipeImpact: confirm
      slideImpact: patch

    - title: "Assisted permissions are generally available"
      published: "2026-10-26"
      source: "https://github.blog/changelog/2026-10-26-github-copilot-assisted-permissions-generally-available"
      corroboration:
        - "https://docs.github.com/en/copilot/concepts/customizations/allowing-safe-commands"
        - "https://github.com/github/copilot-cli/releases/tag/v1.0.104"
      verified: "2026-11-02"
      releaseStatus: ga
      importance: supporting
      distance: ["worker to work", "workflow to running system"]
      targetSection: "Part 3 / Part 4"
      targetSlides: ["authority-boundary", "remote-locality", "walking-incident"]
      action: expand
      summary: >
        Add /permissions assisted alongside manual and allow-all. A model
        evaluates eligible unresolved requests; requests judged safe can
        proceed automatically. Update claims that imply a human approves
        every tool call, while retaining human acceptance of consequential
        outcomes.
      proof: >
        Inspect /permissions show, observe an eligible approval decision,
        and inspect an explicitly denied or escalated request.
      limitations:
        - "The review model can approve dangerous or unintended actions; containment remains separate."
        - "Existing deny rules and enterprise restrictions remain effective."
        - "Eligible enterprise ask rules can be satisfied by model approval."
        - "Requests to bypass local sandboxing are not reviewed by assisted permissions."
        - "In autopilot and non-interactive runs, requests still needing human approval are denied."
        - "Administrators can disable assisted and allow-all independently."
      recipeImpact: confirm
      slideImpact: patch

    - title: "Dynamic workflows turn a useful investigation into a reusable program"
      published: "2026-10-01"
      source: "https://github.blog/changelog/2026-10-01-dynamic-workflows-in-copilot-cli-and-the-copilot-app/"
      corroboration:
        - "https://docs.github.com/en/copilot/concepts/agents/dynamic-workflows"
        - "https://docs.github.com/en/copilot/how-tos/use-copilot-agents/use-dynamic-workflows"
      verified: "2026-11-02"
      releaseStatus: preview
      importance: supporting
      distance: ["workflow to running system", "now to later"]
      targetSection: "Part 3"
      targetSlides: ["part-3", "workflow-reuse", "workflow-definition", "workflow-report", "before-after"]
      replacesSlide: "workflow-checkpoint"
      proposedSlides: ["workflow-reuse", "workflow-definition", "workflow-report"]
      action: replace
      summary: >
        Build on the staging-host investigation: fixed code gathers approved
        service state and logs, agents analyze independent hypotheses, code
        assembles findings with source IDs and uncertainty, and a practitioner
        reviews the evidence. Reuse closes workflow-to-system and now-to-later.
        Teach overview, natural-language authoring with Copilot, review and
        registration, then repeat invocation. Show a clearly labeled synthetic
        report and distinguish recurring workflows from one copilot -p prompt.
      proof: >
        Execute the dependency-free JavaScript core with synthetic fixtures
        and stub agents. Inspect a cited timeout lead beside its source.
        Verify assembly, unknown-source-ID rejection, and agent-failure
        propagation separately from unperformed live Copilot execution.
        Recheck the documented Copilot authoring flow: ask it to create a project
        workflow, review generated code, confirm registration in a fresh session,
        and run it separately. The slides illustrate that flow and a synthetic
        report; the executable fixture core remains optional implementation depth.
      limitations:
        - "Public preview; the announcement requires experimental features in CLI."
        - "Workflows live in extensions and need explicit tool and permission scope."
        - "copilot workflow run does not display permission approval prompts; grant needed permissions before starting."
        - "Public docs defer the extension API to built-in guidance; CLI v1.0.105 bundles it (defineWorkflow, joinSession, ctx.step/parallel/agent). examples/extension.mjs is illustrative and stub-tested, not a recorded live run."
        - "CLI invocation runs in its existing environment; it does not connect to staging or deploy across hosts."
        - "result-file writes only a returned result on successful completion; failed, paused, or interrupted runs leave an existing file unchanged."
        - "Fixture findings are stub outputs, not observed agent diagnoses; source-ID checks do not prove a claim follows from evidence."
        - "Live collection needs Linux systemd, journal access, an audited adapter, and approved data redaction; extension code is outside agent-tool approval scope."
        - "Checkpoints are optional; they do not imply an unattended durable scheduler."
      artifacts:
        - "tech-talks/copilot-cli/examples/staging-investigation.mjs"
        - "tech-talks/copilot-cli/examples/staging-input.json"
        - "tech-talks/copilot-cli/examples/walkthrough.md"
      recipeImpact: revise
      slideImpact: regenerate

    - title: "Current remote steering and scheduled-prompt documentation"
      published: null
      source: "https://docs.github.com/en/copilot/how-tos/copilot-cli/steer-remotely"
      corroboration:
        - "https://docs.github.com/en/copilot/how-tos/copilot-cli/automate-copilot-cli/schedule-prompts"
      verified: "2026-11-02"
      releaseStatus: "remote control documented; scheduling experimental"
      importance: reference
      distance: ["worker to work", "now to later"]
      targetSection: "Part 4 · Now ↔ Later"
      targetSlides: ["scheduled-patrol", "remote-locality", "walking-incident"]
      action: update
      summary: >
        Use the current documented /remote on, /remote off, and bare /remote
        status flow. Distinguish view-only session sync from steerable remote
        access. The host and session must remain running. Scheduling now
        documents self-paced /every prompts, /loop as an alias, and a broader
        subset of schedulable work commands; replace the chronicle-only
        exception wording in notes without adding a command catalog.
      limitations:
        - "Documentation observation dates are not announcement dates or GA evidence."
        - "Remote access requires the same signed-in account; data and result communication still cross service boundaries."
        - "/every and /after remain experimental and fire only while their session runs."
        - "Self-paced schedules have model-selected cadence; inspect and delete unwanted runs."
        - "Resumption restores schedules; an overdue /after can fire immediately."
        - "Do not infer that older --remote syntax was removed merely because the how-to now teaches /remote on."
      recipeImpact: confirm
      slideImpact: patch

    - title: "Managed settings can require fresh policy and minimum sandbox-capable clients"
      published: "2026-10-13"
      source: "https://github.blog/changelog/2026-10-13-enterprise-managed-settings-enforcement-updates"
      verified: "2026-11-02"
      releaseStatus: "announced; no separate GA label"
      importance: reference
      distance: ["workflow to running system"]
      targetSection: "Part 3 / Part 4"
      targetSlides: ["authority-boundary", "local-containment", "staging-transfer"]
      action: update
      summary: >
        Add a setup and recovery note: forceRemoteSettingsRefresh can require
        current server policy at startup and fail closed when it cannot be
        confirmed. A managed sandbox key can require a newer client. A blocked
        startup requires restoring policy access or updating the client, not
        bypassing governance.
      limitations:
        - "Keep this in notes and prerequisite checks, not a governance detour."
        - "A server-managed freshness requirement begins after the client receives it; MDM or file delivery can apply before first sign-in."
      recipeImpact: confirm
      slideImpact: patch

