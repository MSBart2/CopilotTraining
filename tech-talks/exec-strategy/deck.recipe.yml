# deck.recipe.yml - executive talk recipe (deck-recipe-review, executive mode)
# TDM reframe proposed 2026-11-10. Research brief, structure, and per-slide plan approved by the user 2026-11-10.
# Fusion benchmark approved for the moving-target slide: unnamed competitor, labeled commercially interested.

version: 1

deck:
  title: "Choosing the AI Platform for Your SDLC"
  subtitle: "Better software, faster, on the delivery system you already run"
  tagline: "Evaluate the system around the model. Prove it on one team before you scale."

  audience: >
    Technical decision makers: CTO, VP Engineering, heads of platform engineering and
    developer experience. They choose and standardize the AI coding platform and own
    delivery quality, security posture, and engineering spend.

  coreQuestion: "Which AI platform helps my teams ship better software, faster?"

  thesis: >
    AI amplifies the delivery system it runs in. Better software, faster, comes from putting
    agents inside the SDLC system of record, where code, pull requests, checks, security, and
    policy already live, so every agent action lands as reviewable evidence under controls the
    organization already runs. GitHub Copilot is built for that position.

  tension: >
    Tool bake-offs compare editor demos and model output, and both change monthly. Copilot itself
    routes models from several vendors and hosts partner agent apps under one policy and one
    metrics surface. The durable decision is the system around the model.

  anchor: "One pull request carrying evidence from three agents, merged by a named human."

  competitivePosture: >
    No named competitor comparisons. Present four evaluation questions any vendor can be held to,
    and answer each with first-party sourced Copilot capabilities. Commercially interested sources
    carry that label once, where the number appears.

  boundary: >
    The integration case is strongest when GitHub is the system of record for code and pull
    requests. Budget-gated features (Chat, code review, cloud agent) need available enterprise
    budget. Impact-dashboard ROI figures are directional estimates. Merge, production release,
    access changes, and risk acceptance stay with named humans.

  agenda:
    - title: "Look Past the Model"
      takeaway: "Outcomes vary with context; AI multiplies the delivery system it lands in."
      whyItMatters: "A TDM evaluates the platform's fit with the SDLC, not a single model or demo."
    - title: "Four Questions for Any AI Platform"
      takeaway: "Context, Delegation, Verification, Authority, each answered by Copilot from first-party sources."
      whyItMatters: "Gives the TDM vendor-neutral criteria and shows where Copilot answers them natively."
    - title: "What an AI-Enabled SDLC Looks Like"
      takeaway: "One issue becomes one evidence-rich pull request; recurring chores run as governed workflows."
      whyItMatters: "Makes 'better software, faster' concrete and inspectable."
    - title: "Prove It in Your Org"
      takeaway: "A 90-day platform pilot with a baseline, platform metrics, and a predeclared gate."
      whyItMatters: "Turns the platform choice into a measured, reversible decision."

  arcToc: "Look Past the Model -> Four Questions -> AI-Enabled SDLC -> Prove It"

  arcNarrative: >
    The briefing opens with the TDM's real decision and the evidence that AI outcomes vary with the
    system around the tool. Four evaluation questions then give leaders criteria they can apply to
    any vendor, with Copilot's first-party answer for each; this is the competitive case, earned
    rather than asserted. The AI-enabled SDLC section makes it concrete: one change flowing from issue
    to agent to review to measured merge, plus governed recurring work and a readiness bar. The close
    converts conviction into a controlled 90-day pilot measured with platform metrics and DORA delivery
    signals, so the standardization decision is evidence-based and reversible.

  sectionOrder:
    - "Look Past the Model"
    - "Four Questions for Any AI Platform"
    - "What an AI-Enabled SDLC Looks Like"
    - "Prove It in Your Org"

  sectionModes:
    "Look Past the Model":
      emphasis: medium
      note: >
        Octoverse 2026 shows agent work went mainstream (40%+ of PRs start with an agent draft); the
        impact dashboard's adoption cohorts show each organization its own return. METR stays in notes
        as the independent counterpoint. DORA 2025: AI is an amplifier.
        Models change monthly; Copilot Fusion routes across enabled models, model policy controls
        availability per enterprise, org, team, and agent app, and partner agent apps report into the
        same usage metrics. Therefore evaluate the system.
    "Four Questions for Any AI Platform":
      emphasis: high
      note: >
        Context (repo, issues, PR history, custom instructions, portable custom agents, MCP, governed org
        knowledge). Delegation (IDE, CLI, cloud agent, agentic workflows, SDK; one agent file across
        surfaces). Verification (Copilot code review, Code Quality, CodeQL Autofix, Actions, secret scanning,
        all on the PR). Authority (enterprise, org, team, repo, personal layers; managed settings; model
        policy API; rulesets; usage metrics and telemetry routing). Frame each as a question the TDM asks
        every vendor.
    "What an AI-Enabled SDLC Looks Like":
      emphasis: high
      note: >
        The anchor: issue assigned to the cloud agent, draft PR, Copilot code review, Code Quality findings,
        human steers rework and merges. Agentic workflows handle recurring repository chores through safe
        outputs with audited runs. Readiness: the L3 launchpad (reliable context, repeatable checks, habitual
        use). State the boundary honestly.
    "Prove It in Your Org":
      emphasis: medium
      note: >
        Keep the strongest parts of the prior pilot design, trimmed: one team, one workflow, four-week
        baseline, 90 days, named owners. Measure with the usage metrics API (per-agent activity, code review
        addressed rate), the impact dashboard (directional ROI), and DORA delivery metrics. Label evidence
        classes. Predeclare thresholds; scale, adjust once, or stop.

  preamble: []
  appendix: []

  highlightMoments:
    - "AI multiplies the delivery system it runs in; the platform decision is a delivery-system decision."
    - "Four questions any vendor can be held to: where does context come from, where can work be delegated, what evidence lands on the change, and who controls it."
    - "One pull request carries evidence from the cloud agent, Copilot code review, and Code Quality, and a named human merges it."
    - "Copilot routes multiple vendors' models and governs partner agent apps under one policy and one metrics surface."
    - "A 90-day platform pilot with a predeclared gate turns standardization into a measured, reversible decision."

