# Guides slide generation from README.md. Use this file to name and order sections,
# set the slide budget per section, and surface authoring priorities the generator
# should follow.

version: 1

deck:
  title: "The Agent Dev Loop"
  subtitle: "From Repo to Feature with Copilot in VS Code"
  tagline: "Build the toolkit that makes every future feature faster."

  # arcToc: short → chain displayed as the TocSlide subtitle. One line, ≤ 80 chars.
  arcToc: "Context First → Build the Toolkit → Plan, Risk, and Ship → The Compounding Effect"

  # arcNarrative: prose rationale explaining WHY the sections are ordered this way.
  arcNarrative: >
    The talk opens by establishing workspace context as the prerequisite for everything
    that follows — the /init step is brief but architecturally critical, since every
    subsequent section depends on Copilot having project knowledge. Section 2 is the
    creative centerpiece where teams do the most original work: building two kinds of
    reusable assets (prompts for evaluation, skills for action), with both demonstrated
    through full inline artifacts. The "aha" moment lands here as developers realize
    they are not just writing features — they are building a team toolkit, and both
    asset types are just Markdown files in .github/. Section 3 completes the loop by
    showing how those tools are used in combination: a plan is generated, reviewed for
    risk, refined, and then implemented — the complete go/no-go cycle in sequence. Peak
    engagement hits at the risk triage table, which makes the "No-go on current plan"
    finding concrete and visually striking. Section 4 closes by zooming out to the
    compounding payoff: four use cases with measurable outcomes, and a time-boxed action
    list that gives every developer something to do in the next 15 minutes. The arc
    moves from Set Up → Build → Execute → Scale — a natural adoption curve that matches
    how teams actually progress with the pattern.

  # Ordered list of sections (must match sectionModes keys below).
  sectionOrder:
    - "Context First"
    - "Build the Toolkit"
    - "Plan, Risk, and Ship"
    - "The Compounding Effect"

  # Per-section editorial guidance for the slide generator.
  sectionModes:
    "Context First":
      # medium = 2–3 slides
      emphasis: medium
      note: >
        Cover the /init prompt, show the AGENTS.md artifact example, and land the
        "permanent multiplier" framing in one tight sequence. One overview slide +
        one artifact slide showing the nonogram SPA AGENTS.md. Cut the "why this
        matters" prose — lead directly with the artifact and let the content speak.
        The section establishes the prerequisite; it does not need to justify itself at length.

    "Build the Toolkit":
      # high = 4–5 slides
      emphasis: high
      note: >
        This is the creative centerpiece of the talk. Show both artifact types in
        sequence: evaluate-issue.prompt.md (prompts for evaluation) then
        create-spa-page.skill.md (skills for action). The "whoa" moment is that both
        are just Markdown files that live in .github/ and become slash commands
        automatically. Allocate one slide per artifact with the file contents visible.
        Add a transition beat between prompts and skills that names the distinction:
        "Prompts answer 'evaluate this.' Skills answer 'do this.'"

    "Plan, Risk, and Ship":
      # high = 4–5 slides
      emphasis: high
      note: >
        Anchor the section on the risk triage table — it is the most visually concrete
        and surprising moment in the talk. Show the /plan output (alphabet puzzle plan)
        on one slide, then the triage table with the "No-go on current plan" finding on
        the next. Make the plan-as-hypothesis framing explicit: a plan is not a
        commitment, it is a hypothesis to be stress-tested. The sequence is: generate
        the plan → review for risk → the table → No-go finding → plan is updated →
        implementation starts. Do not skip the "go/no-go" beat — that is the payoff.

    "The Compounding Effect":
      # medium = 2–3 slides
      emphasis: medium
      note: >
        Close with the four real-world use cases and their measurable outcomes (onboarding
        down from 5 days to 2, context switches eliminated, feature on original estimate,
        zero structural review comments). Then embed the "In 15 Minutes" call to action
        as the final actionable beat — not just a bullet list but framed as the first step
        of the team's accumulation curve. Tie back to the talk's thesis: the real output
        of the agent dev loop is the growing toolkit, not any single feature.

  preamble: []
  appendix: []

  # 3–5 high-signal moments the generator must surface in the deck.
  highlightMoments:
    - "AGENTS.md generated in 30 seconds becomes a permanent context multiplier for every subsequent Copilot interaction in the project"
    - "A .prompt.md file is just Markdown — /evaluate-issue is invokable the moment it is saved to .github/prompts/"
    - "/review-plan returns 'No-go on current plan' before a single line of implementation code is written — the risk triage table catches what code review would have found too late"
    - "After adopting the loop, first merged PR for new developers: down from 5 days to 2; mid-sprint context switches from incomplete tickets: eliminated"
