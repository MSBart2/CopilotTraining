# Conversion plan reviewed and approved under the user's no-pause waiver, 2026-10-31.
# Preserve source scope and artifacts; label synthetic evidence and unresolved behavior.
# No feature refresh, Azure provisioning, or cloud mutation is part of this conversion.
version: 1

deck:
  title: "GitHub Copilot + Azure Skills Plugin"
  subtitle: "Conversational Azure Prototyping and Deployment"
  tagline: "Use live context to shape infrastructure proposals; keep authority explicit."


  agenda:
    - title: "Ask Azure with context"
      takeaway: "Trace a natural-language request to a scoped Azure resource query."
      whyItMatters: "Identity, subscription, and returned evidence determine what the answer means."
    - title: "Plan before proposing changes"
      takeaway: "Separate an illustrative plan from verified subscription facts and deployable code."
      whyItMatters: "A human can review assumptions before any consequential action."
    - title: "Bound authority"
      takeaway: "Distinguish tool availability, identity permissions, and human approval."
      whyItMatters: "The integration inherits configured authority; it does not make an unsafe workflow safe by itself."

  arcToc: "Query → Plan → Compose → Bound"

  arcNarrative: >
    Start with a visible request and response, then ask what the response proves. The payment API
    Plan Mode scenario is the centerpiece, but the recipe itself marks Skills activation inside
    Plan Mode unverified. Keep that uncertainty visible; label transcripts and checks as
    illustrative rather than observed. Explain Skills, MCP, and Azure after the intended workflow
    is clear. End by separating authentication, Azure authorization, host confirmation, and
    organizational approval. Retain the source's 45-to-8-minute comparison only as an unmeasured
    historical estimate. The argument teaches contextual delegation and verification without
    provisioning resources or changing Azure.

  sectionOrder:
    - "Query Azure with Live Context"
    - "Plan Before Any Change"
    - "Compose Skills, MCP, and Azure"
    - "Keep Authority Explicit"

  sectionModes:
    "Query Azure with Live Context":
      emphasis: medium
      note: >
        Show how a scoped resource question can return structured state and support a bounded
        follow-up. Use fictional resource names and mark transcript output illustrative, not
        observed. Carry subscription, identity, selected fields, and freshness context with the
        result. Do not imply that conversational output is inherently current, complete, or a
        replacement for portal/CLI checks.

    "Plan Before Any Change":
      emphasis: high
      note: >
        Make the payment API/App Service example the centerpiece. Retain its clarifying questions,
        subnet/quota/firewall checks, proposed architecture, generated-code review, and manual
        deployment boundary as explicitly illustrative source material. Path A, Skills activation
        during Plan Mode, remains an unverified assumption; do not narrate it as behavior. Treat
        45 and 8 minutes as unmeasured estimates, not an experiment.

    "Compose Skills, MCP, and Azure":
      emphasis: high
      note: >
        Draw the control/data path: host and instructions, optional Skills guidance, MCP tool
        discovery/call, server credential, Azure authorization, result. Keep the 21-skill and
        200-plus-tool/40-plus-service counts dated to the source talk and not independently
        refreshed. Preserve installation routes and configuration lessons, marking command shapes
        version-specific and asking presenters to verify current docs.

    "Keep Authority Explicit":
      emphasis: medium-low
      note: >
        Separate tool availability, authentication, Azure RBAC/data-plane authorization, host
        approval prompts, and separate organizational review. Least privilege is a property of
        configured identities and scopes, not an MCP default. Preserve Reader/Contributor/Owner
        and production/dev separation guidance, use-case boundaries, recovery paths, and transfer.
        No live Azure access, credential creation, or provisioning occurs.

  preamble: []
  appendix: []

  highlightMoments:
    - "A resource answer earns confidence when its scope, identity, fields, and freshness are inspectable."
    - "Skills guidance and MCP tool availability are different layers; neither proves a tool call happened."
    - "Authentication, Azure authorization, host confirmation, and service-owner approval are separate controls."
    - "The source's 45-minute and 8-minute cycle figures have no supplied measurement method and are not observed outcomes."
    - "Generated infrastructure is a proposal; review, validation, and deployment remain separate actions."

