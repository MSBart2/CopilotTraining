# deck.recipe.yml — Agentic SDLC talk guidance
#
# Updated for the enriched five-level maturity model and the four-part
# native conversion. The final part turns the model into a local plan.

version: 1

deck:
  title: Agentic SDLC
  subtitle: "Designing the SDLC Your Agents Deserve"
  tagline: >
    Five maturity levels — platform readiness, developer adoption, and governance that compound together

  agenda:
    - title: "Maturity Model"
      takeaway: "Assess platform readiness and adoption together; choose repository boundaries from real change patterns."
      whyItMatters: "A repeatable launchpad gives later delegation evidence and context to build on."
    - title: "PR Workflows"
      takeaway: "Give Copilot bounded intent, then route evidence and approval to accountable owners."
      whyItMatters: "Automation handles repeatable checks while people keep authority over risk."
    - title: "Trust Manufacturing"
      takeaway: "Use fast, reliable CI, visible flake ownership, valid caches, and provenance."
      whyItMatters: "A fast green signal matters only when its scope and inputs remain trustworthy."
    - title: "Implementation Roadmap"
      takeaway: "Advance from L3 to L5 when local measurements support the next investment."
      whyItMatters: "The roadmap pairs platform work with adoption, governance, and evidence."

  arcToc: "Assess → Govern → Trust → Scale"
  arcNarrative: >
    One framework, five levels — each level has platform signals, adoption signals, and governance expectations. The talk moves from maturity and repository boundaries to PR authority, CI evidence, and an implementation roadmap. The constraint changes from readiness to review capacity to trust production to measurement.
  sectionOrder:
    - "Maturity Model"
    - "PR Workflows"
    - "Trust Manufacturing"
    - "Implementation Roadmap"

  sectionModes:
    "Maturity Model":
      emphasis: high
      note: >
        Six teaching slides: pair the L1–L5 platform/adoption map with the L3 launchpad signals; label the 300-to-15,000 review-volume model as illustrative; show the instruction hierarchy; then decide repository boundaries and inspect a monorepo topology.
    "PR Workflows":
      emphasis: high
      note: >
        Six teaching slides: map review-mode progression; show a bounded intent contract; assemble an evidence bundle; separate policy checks from four human decisions; distinguish contextual triage from approval; and name the developer, Copilot, CI, reviewer, and service owner. Treat 22-to-4 and 90% as proposed design figures, not results.
    "Trust Manufacturing":
      emphasis: medium-high
      note: >
        Six teaching slides: stage CI; compare four-iteration wait scenarios; demonstrate affected analysis; define flake ownership; pair hermetic inputs with safe cache invalidation; inspect attestations. Keep time/throughput and cache figures labeled as estimates or targets.
    "Implementation Roadmap":
      emphasis: high
      note: >
        Four teaching slides: one Platform & Tooling plus Adoption & Governance checklist per L3, L4, and L5 phase, followed by the FanHub walkthrough as own-work transfer. Preserve repository topology in Part 1 and revisit its measurement in Phase 1.

  highlightMoments:
    - >
      Illustrative review-volume comparison: 300 lines/day to 15,000 lines/day; the decision shifts toward intent, risk, and evidence.
    - >
      Unverified coordination scenario: three repositories and multiple handoffs are compared with one atomic change; measure your own elapsed time before estimating savings.
    - >
      CI scenario math: four 60-minute waits equal 240 minutes; four 8-minute waits equal 32 minutes. Idle shares and feature counts remain estimates until tested against a workload.
    - >
      Governance design proposal: four named human checkpoints with automation for repeatable checks; the source's 22-gate and 90% figures are not observed organization-wide results.
    - >
      The source's 100x throughput projection is unsupported and is not presented as an achieved or promised outcome.
    - >
      In this maturity model, platform readiness without adoption leaves capability unused; adoption without repeatable infrastructure makes outcomes inconsistent. L3 is the launchpad where the two begin to compound.
    - >
      Instruction Hierarchy as highest-leverage cross-cutting investment: org instructions → repo instructions → AGENTS.md → prompt files → coding guidelines — compounds at every level
    - >
      L3 is the launchpad: where repeatability, adoption depth, and quality infrastructure first compound; treat higher autonomy as dependent on evidence from that foundation
  slides:
    - { id: title, part: Frame, scene: title + sdlc-loop, intent: Introduce the delivery-system argument, seconds: 20 }
    - { id: core-question, part: Frame, scene: core-question, intent: State the learner's question and thesis, seconds: 60 }
    - { id: contents, part: Frame, scene: contents, intent: Route the audience through four decisions, seconds: 30 }
    - { id: part-1, part: 1, scene: opener, intent: Frame maturity as paired platform and adoption assessment, seconds: 20 }
    - { id: maturity-map, part: 1, scene: maturity-map, intent: Compare platform, adoption, and unlocks across five levels, seconds: 220 }
    - { id: l3-launchpad, part: 1, scene: signals, intent: Show the observable L3 foundation signals, seconds: 220 }
    - { id: volume-breakpoint, part: 1, scene: volume-breakpoint, intent: Explain the modeled shift from code production to trust capacity, seconds: 220 }
    - { id: instruction-hierarchy, part: 1, scene: instruction-stack, intent: Place versioned instructions at the layers that need them, seconds: 220 }
    - { id: repo-decision, part: 1, scene: showdown, intent: Decide when monorepo coordination savings justify complexity, seconds: 220 }
    - { id: monorepo-topology, part: 1, scene: topology, intent: Show app/library boundaries and a separate control-plane option, seconds: 220 }
    - { id: part-2, part: 2, scene: opener, intent: Shift from repository coordination to human review capacity, seconds: 20 }
    - { id: review-maturity, part: 2, scene: signals, intent: Show how review mode changes across readiness levels, seconds: 220 }
    - { id: intent-contract, part: 2, scene: intent-contract, intent: Pair a representative request with constraints and acceptance evidence, seconds: 220 }
    - { id: evidence-bundle, part: 2, scene: scorecard, intent: Show what evidence a reviewer inspects, seconds: 220 }
    - { id: governance-gates, part: 2, scene: four-phases, intent: Separate automated policy checks from four human decisions, seconds: 220 }
    - { id: context-aware-review, part: 2, scene: showdown, intent: Contrast rule matches with contextual triage and human verification, seconds: 220 }
    - { id: human-ownership, part: 2, scene: signals, intent: Distinguish developer, Copilot, CI, reviewer, and service-owner authority, seconds: 220 }
    - { id: part-3, part: 3, scene: opener, intent: Frame CI as repeatable evidence production, seconds: 20 }
    - { id: trust-pipeline, part: 3, scene: four-phases, intent: Stage fast, comprehensive, and pre-production checks, seconds: 220 }
    - { id: ci-feedback, part: 3, scene: showdown, intent: Compare wait-time scenarios without claiming measured throughput, seconds: 220 }
    - { id: affected-analysis, part: 3, scene: terminal, intent: Show a representative affected-analysis command and output, seconds: 220 }
    - { id: flake-policy, part: 3, scene: signals, intent: Show a first-flake quarantine, repair, and measurement path, seconds: 220 }
    - { id: hermetic-cache, part: 3, scene: showdown, intent: Contrast pinned inputs and safe cache invalidation, seconds: 220 }
    - { id: attestations, part: 3, scene: terminal, intent: Identify provenance fields and the human sufficiency decision, seconds: 220 }
    - { id: part-4, part: 4, scene: opener, intent: Set out evidence-led phase progression, seconds: 20 }
    - { id: phase-l3, part: 4, scene: phase-checklist, intent: Establish repeatable CI, ownership, context, and baseline measures, seconds: 220 }
    - { id: phase-l4, part: 4, scene: phase-checklist, intent: Optimize governance and tool use from observed exceptions, seconds: 220 }
    - { id: phase-l5, part: 4, scene: phase-checklist, intent: Expand autonomy with measurement and recovery controls, seconds: 220 }
    - { id: fanhub-walkthrough, part: 4, scene: four-phases, intent: Transfer the model through the linked FanHub exercise, seconds: 220 }
    - { id: before-after, part: Frame, scene: before-after, intent: Summarize the system-level behavior change without unsupported multipliers, seconds: 50 }
    - { id: today, part: Frame, scene: today-plan, intent: Give a repository-level action for today, this week, and this month, seconds: 50 }
    - { id: references, part: Frame, scene: references, intent: Link first-party evidence and core technical references, seconds: 20 }
    - { id: thanks, part: Frame, scene: thanks + sdlc-loop, intent: Close with an own-work transfer question, seconds: 10 }
  preamble: []
  appendix: []

