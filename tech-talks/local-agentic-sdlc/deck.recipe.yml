# 2026-11-06 recipe rewrite: live FanHub run. After rehearsing the team on FanHub issue 202, the user
# asked for "a branch with the issue ID", for Part 4 to "do the demo" live with a 50-credit budget and
# ten minutes, and for the Part 4 setup to ask "how much do you think this will cost?". The user
# approved teaching Parts 2-3 from the real rehearsal record and retiring the episode-filter example.
# Earlier approvals preserved as history: CLI-first rebuild, pacing revision, orchestrator-first
# reorder, episode-filter redesign.
# Question: How do I build local agents that can work together on a coding task?
# Thesis: Agent files define the team; an orchestrator, a shared .team/ folder with one writer per file,
# and checks plus a reviewer turn them into a run a person can trace, resume, and decide on.
#
# Source map:
# - Teaching source: slides/tech-talks/local-agentic-sdlc/slides.js (notes-first).
# - Team: FanHub .github/agents/ and AGENTS.md, pinned at
#   https://github.com/MSBart2/FanHub/tree/61bf87964b964c2c0c9e098cf6ebb1900501315b/.github/agents
# - Rehearsal record: tech-talks/local-agentic-sdlc/evidence/fanhub-202-rehearsal/ — every .team/ file,
#   check and lint output, the Episodes.js diff, and the new test file from one real run.
# - Pricing: https://docs.github.com/en/copilot/reference/copilot-billing/models-and-pricing
# - Historical proof: FanHub issues 4 and 5 and draft PR 217 (scale-up slide only).
#
# Evidence boundaries:
# - Rehearsal numbers are observed on GPT-6.1 Sol: 11m21s, 39.88 credits, 9 tests, check-1 and check-2 at 9/9,
#   lint-1 with 4 errors routed to test-writer, lint-2 clean, accept in round 3.
# - The rehearsal used an earlier agent revision: a person made the branch, the orchestrator improvised
#   the lint step, and round numbering drifted. Notes name each difference once; 61bf879 fixes them.
# - Fusion run (evidence/fanhub-202-fusion/): Luna, 1.79 credits read from the CLI, A1-A2 only, 2 tests,
#   accepted with the All Seasons crash still live. FanHub 74b040b adds the Found stop and E# edge tests;
#   Part 4 runs those files, so the live run can stop a second time and can cost more than the rehearsal.
# - The live run is not the rehearsal. The while-it-works clock is the rehearsal clock, labeled as such.
# - The CLI ignores an agents: metadata key; the worker list is an instruction. --max-ai-credits and
#   the tools list are enforced. Path limits are instructions, and the diff shows whether they held.
#
# Structural review:
# - Parts 1-3 explain from a real record so every term the live run uses is already defined.
# - Memorable moment: the cost guess. Hands up, then 39.88 credits, about forty cents, under a budget
#   the person set. Then the room watches the same team do it again.
# - Second anchor: passing tests were half the Check; lint failed and step 5 routed it to the file owner.
# - Judgment lenses: context in task.md and plan.md; delegation in one file per worker; verification
#   in check-N.txt, lint output, and review.md; authority in task approval, the credit budget,
#   enforced versus instructed limits, and the person's merge decision.
#
# Presenter budget: 39 slides, 40:00 spoken + 5:00 discussion. Part 4 is a 10-minute live run.
version: 1

deck:
  title: "Local Agentic SDLC: Build the Crew, Run the Loop"
  subtitle: "Build the Crew, Run the Loop"
  tagline: "Five agent files. One real bug. A record you can read, and a live run you can watch."

  agenda:
    - title: "The team, top down"
      takeaway: "Read the orchestrator file, the .team/ folder, and the four workers it calls."
      whyItMatters: "Every action in the run traces back to one line in one file."
    - title: "How a run works"
      takeaway: "Follow the FanHub #202 rehearsal from an approved task.md to an accept."
      whyItMatters: "Passing tests are half the Check; a routed lint failure shows the loop working."
    - title: "Trust the record"
      takeaway: "Answer every question from a file, know which limits are enforced, resume from status.md."
      whyItMatters: "The record outlives the session and the summary."
    - title: "Run it live"
      takeaway: "Guess the cost, then watch the same team fix the same bug on stage under a 50-credit budget."
      whyItMatters: "Unattended, reviewable work for under fifty cents is the reason to build the team."

  arcToc: "The Team, Top Down → How a Run Works → Trust the Record → Run It Live"

  arcNarrative: >
    FanHub issue 202 opens the talk: choose Season 2 right after the page loads and the old list stays,
    because one unkeyed cache answers first. Part 1 reads the team top down: the crew map, the anatomy
    of an agent file, the whole orchestrator file, its seven steps with the tool and file each uses, the
    .team/ folder with one writer per file, and the four workers. Part 2 follows the real rehearsal.
    One command branches to issue-202 and drafts task.md; a person approves A1-A3. Planner finds three
    problems, implementer removes the cache and guards stale responses, and test-writer adds nine tests.
    Check-1 passes 9 of 9, lint finds four errors in the test file, step 5 routes them to test-writer,
    and check-2 is clean. The reviewer accepts and names what it could not see. status.md tells the run
    in ten rows. Part 3 answers every question from a file, separates three kinds of proof, labels
    each limit by enforcement, compares a cheaper fusion run that passed every check and missed the All
    Seasons crash, and resumes a stopped run from status.md. Part 4 asks the room to guess
    the cost, reveals about forty cents, then runs the team live under a 50-credit budget while the
    room watches .team/ fill in. The close shows Squad (bradygaster/squad) as what deep investment in agents looks like, transfers the team to the audience's own issue, and scales
    to branches, worktrees, a Stop hook, and an integrated review before a person merges.

  sectionOrder:
    - "1. The Team, Top Down"
    - "2. How a Run Works"
    - "3. Trust the Record"
    - "4. Run It Live"

  sectionModes:
    "1. The Team, Top Down":
      emphasis: high
      note: >
        Start from the bug, then read every file before any run. The orchestrator comes before its
        workers; its steps slide maps each action word (branch, wait, route, resume) to its source
        sentence and tool, so nothing in Part 2 appears from nowhere.
    "2. How a Run Works":
      emphasis: high
      note: >
        One step per slide from the rehearsal record, each a call, a one-line reply, and the file it
        wrote. The person approves task.md before any worker runs. Give route-lint the most time; it
        carries the thesis. End on the ten-row status trail.
    "3. Trust the Record":
      emphasis: medium
      note: >
        Read the record as a person would. Separate test, reviewer, and person evidence. Label every
        limit as enforced or instruction. Show that a cheaper model narrowed task.md and with it the tests,
        and how the agent files now ask for edge coverage. Resume from status.md with a fresh rerun.
    "4. Run It Live":
      emphasis: high
      note: >
        The cost question sets the stakes, the reveal answers it with measured rehearsal numbers, and
        the live run proves the team again. Ten minutes on stage; the while-it-works notes keep the lesson if
        the clock wins.

  preamble: []
  appendix: []

  highlightMoments:
    - "The person approves what done means before any worker runs."
    - "Check-1 is 9 of 9 green, lint fails, and one rule in step 5 routes it to test-writer."
    - "The reviewer accepts and says what it could not see."
    - "Same team, two models: 39.88 credits fixed All Seasons, 1.79 credits passed every check and missed it."
    - "How much do you think this will cost? About forty cents, under a fifty-cent budget."
    - "The same team fixes the same bug live while .team/ fills in on screen."

