# Harness Fundamentals — refreshed 2026-11-18
# Decision: revise with user approval — one slide per example, retaining configuration
# snippets; full walkthroughs are follow-up material. 29 slides, 40:25 in a 45-minute slot.

version: 1

deck:
  title: "Harness Fundamentals"
  subtitle: "From the Agent Loop to a Harness Choice"
  tagline: "Read the five jobs, bring the Microsoft Copilot SDK into an app, and test where it fits."

  agenda:
    - title: "Read a harness"
      takeaway: "Trace loop, context, tools, control, and evidence in pi's readable source."
      whyItMatters: "The five jobs give every SDK option a place and every custom harness a boundary."
    - title: "Put a harness in an app"
      takeaway: "Follow a release question through a Microsoft Copilot SDK session and a narrow app tool."
      whyItMatters: "Your service keeps user authorization, business approval, and the source of truth."
    - title: "Choose with evidence"
      takeaway: "Use a harness scorecard, then test one method in your own workflow."
      whyItMatters: "You can compare the SDK with the cost and control of owning another harness."

  arcToc: "Read the jobs → Embed the SDK → Set the view → Choose with evidence"

  arcNarrative: >
    Start with pi because a short source reading gives practitioners a transferable model
    before the product choice appears. Mirror the same five jobs in a release-dashboard
    integration sketch using Microsoft Copilot SDK 2.0. Each example gets one self-contained
    slide: purpose, the configuration that makes it work, result, boundary, and follow-up.
    The blind-tests and fresh-eyes apps show how a deliberate view changes the check.
    Keep permission versus process isolation as a separate, general concept.
    End with Microsoft's sourced product claim, one concise harness-comparison result, and a
    scorecard that names where the SDK fits and where a team-owned harness may fit better.
    The strongest alternative is SDK-first, followed by pi as a sidebar. That order asks
    people to accept a product choice before they can inspect the harness jobs it takes over,
    and risks turning the talk into a product tour. The five-job mirror earns the choice:
    the audience sees what the SDK runs, what the app still owns, and what a one-method spike
    can verify. The release dashboard remains a clearly labeled sketch; the FanHub result
    comes from the 2026-11-18 blind-tests run on SDK 2.0.0.
    No live demo is planned. Detailed walkthroughs live in the speaker-note handout and
    linked samples. Consolidation reduces the planned content from 55:35 to 40:25;
    the 45-minute slot leaves discussion time. These budgets await a timed rehearsal.

  sectionOrder:
    - "What a Harness Is"
    - "Drive the Microsoft Copilot SDK"
    - "Decide What It Sees"
    - "Controls and the Choice"

  sectionModes:
    "What a Harness Is":
      emphasis: high
      note: >
        Preserve the seven-slide read-only pi tour and the five-job order. The anchor is
        runLoop: a small readable implementation makes the harness concrete. Show context,
        tool contract and execution, control, and evidence only where each changes a decision.
        pi is an example, not the only valid architecture. Keep source excerpts pinned and
        under the existing line limits. Do not let the section become a pi feature tour.
    "Drive the Microsoft Copilot SDK":
      emphasis: high
      note: >
        Keep the five-job mirror and licensing decision. Consolidate sdk-why, sdk-loop,
        sdk-context, sdk-tools, sdk-control, sdk-evidence, and release-flow into release-flow.
        Show the named tool's schema and service handler, narrow session tool selection,
        permission callback, and request beside the illustrative result and user-authorization
        boundary. Use SDK 2.0 shapes. Move lifecycle, context modes, and event wiring into
        follow-up notes linked to the five runnable quickstarts; no live demo is planned.
    "Decide What It Sees":
      emphasis: high
      note: >
        Consolidate blind-app, blind-result, visibility-policy, and run-evidence into one
        blind-result slide: show selected visibility rules and SDK callback wiring beside
        the contract-only task and observed host rerun (12 pass, 2 fail). Keep the referee
        mapping as a lead, with the API owner deciding. Add one fresh-eyes slide with its
        docs-only rules, report_friction tool, setup result, and docs-owner boundary.
        Link each app and its run command. Keep policy details and the four log layers
        in follow-up notes. Retain host-boundary as a general concept independent of
        either sample: mediated permission is distinct from OS execution isolation.
        permissions.sandbox is experimental and untested here; MXC details stay in notes.
    "Controls and the Choice":
      emphasis: high
      note: >
        Start with the sourced Microsoft company-wide claim as vendor evidence, then qualify
        managed Foundry as public preview and Copilot Studio as one of three harness choices.
        Never turn that claim into "default in every Microsoft experience" or name M365 or
        the Microsoft Copilot app as verified examples. Keep one result from GitHub's
        same-model harness study, label its source once, and remove the separate model-results
        chart. Remove the app-ideas roundup; fresh-eyes now has its own Part 3 slide.
        End with a scorecard that includes fit boundaries
        and a one-method spike: choose one existing method, name its user check and execution
        boundary, run the spike, and inspect UI, service audit, and telemetry. Close with a
        fair pi-versus-SDK comparison: both embed in-process; pi is minimal and extensible,
        while SDK 2.0 loads Microsoft's native Copilot runtime in-process by default and offers
        documented per-session identity, state, and tools. Highlight the SDK column in white,
        keep pi muted, and retain the no-sandbox/no-crash-isolation caveat in notes only.
        Compare fit without ranking maturity or dividing by enterprise
        versus non-enterprise use.

  preamble: []
  appendix: []

  highlightMoments:
    - "pi's runLoop fits in about 160 lines, giving the five-job model a readable anchor."
    - "The SDK runs the harness loop; an app still owns the user's authority and business result."
    - "The 2026-11-18 blind-test run on SDK 2.0.0 recorded 14 tests: 12 passed and 2 failed; the host reran them and a separate referee mapped the findings as leads."
    - "Microsoft says it adopted the harness company-wide and is standardizing its Copilot experiences on it; the article names Copilot Code, Copilot Studio, the GitHub Copilot app, the CLI, VS Code, and more."
    - "A scorecard plus one-method spike tests the SDK's fit against the cost of owning another harness."

