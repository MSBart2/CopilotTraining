# deck.recipe.yml — Harness Fundamentals (Revision 4, five jobs twice)
#
# Reviewed 2026-10-26. Single structural analysis; the user's approval is the review gate.
# Native conversion plan approved 2026-10-31 under the user's explicit autonomous-build waiver.
# The 31-slide plan preserves the current four-part narrative and evidence; no news refresh is in scope.
#
# Slide budget: 20 content slides (6 + 7 + 4 + 3) plus 11 structural slides = 31 total.
# Sections one and two walk the same five jobs in the same order (loop, context, tools, control,
# evidence), one slide per job, so the audience can line each pi slide up with its SDK slide.
# Treat each section's slide count as a maximum.
#
# Evidence labels carry onto slides: "Observed" = live run on 2026-10-26 (SDK 1.0.26, model auto,
# FanHub 0ea9e78); "Tested" = deterministic unit test in examples/; "Documented" = first-party docs;
# "Source" = pi excerpt at earendil-works/pi@f9daca3 (MIT). Every pi code block carries the
# attribution line "pi · MIT · earendil-works/pi@f9daca3 · <path>#<lines>" and stays under 25 lines.
# Each content slide answers one audience question; examples distinguish illustrative and observed results.
# Each job slide carries one code block; SDK integration excerpts are labeled sketches. Label documented SDK behavior
# "Documented" and recorded runs "Observed"; never mark a documented claim as observed.
# Copilot claims stay at the SDK surface: what a host configures and observes.

version: 1

deck:
  title: "Harness Fundamentals"
  subtitle: "Getting Inside the Agent Loop"
  tagline: "Understand the loop, then bring AI into your existing apps with tools, controls, and telemetry."

  agenda:
    - title: "Read a whole harness"
      takeaway: "pi's agent loop is one function of about 170 lines, and its loop, context, tools, control, and evidence jobs each fit on a slide."
      whyItMatters: "Every hook and SDK callback you write afterward has a clear place: it takes over one named job."
    - title: "Take over the jobs in GitHub's harness"
      takeaway: "An existing app can host the SDK and expose selected methods as tools, keeping service authorization, approval gates, UI, and telemetry."
      whyItMatters: "A release engineer can ask the dashboard what blocks a release; its existing service supplies facts through a narrow tool, with app-owned checks and observable results."
    - title: "Design the view, then own the harness"
      takeaway: "One visibility policy at two SDK checkpoints produced a blind test suite that surfaced an undocumented API mismatch, with a named owner for every result."
      whyItMatters: "You leave with a pattern for perspective-driven agents, the evidence that backs them, and the pre-flight for sharing one."

  arcToc: "What a Harness Is → Drive GitHub's Harness → Decide What It Sees → Own It"

  arcNarrative: >
    The talk opens by making the harness visible. Section one reads pi as source, one slide per
    job: the whole loop on one screen as the anchor, context rebuilt every turn, a self-contained
    write tool with find handing its work to fd (the boundary the talk returns to), a
    beforeToolCall hook that returns a reason the model reads, and an emit stream any subscriber can
    read. Section two walks the same five jobs in the same order inside an existing release dashboard,
    using explicitly labeled integration sketches. The tool handler calls an existing service method;
    SDK permissions bound requests while the service authorizes the user and retains approval gates.
    Session events feed the UI and telemetry; the service audit records business results.
    Fresh-eyes remains supporting README material. Section three extends that control model:
    the same host, with a different view, writes a blind test suite whose failure the referee labels
    undocumented; the fd boundary returns as what the host cannot see, and the joined event log shows
    the evidence job in practice. Section four is short and practical: the controls other people
    already own around Copilot, and the pre-flight and named owner that make a harness shareable.
    Reading pi first gives every later lever a name, so each SDK slide lands as a familiar job and section three
    lands as a design choice the audience can repeat.

  sectionOrder:
    - "What a Harness Is"
    - "Drive GitHub's Harness"
    - "Decide What It Sees"
    - "Own It"

  sectionModes:
    "What a Harness Is":
      emphasis: high
      note: >
        Six content slides, read-only source excerpts with no live run, one slide per job in the
        order loop, context, tools, control, evidence. Slide 1 answers "What does a harness do?": the
        five-jobs table with the pi location for each. Slide 2 (Loop) is the anchor, "Where is the
        agent loop?": the trimmed runLoop excerpt with the five jobs labeled in the margin and three
        callouts: the agent keeps going while the model asks for tools, people can steer mid-run,
        every turn emits an event. Slide 3 (Context) answers "What does the model see each turn?":
        the transformContext and convertToLlm excerpt, with prepareRequest swapping model or thinking
        level and declareToolChanges announcing tool changes. Slide 4 (Tools) answers "What is inside
        one tool?": the write excerpt labeled schema (contract), prompt snippet (context), mutation
        queue and abort checks (safety), and swappable ops (where the action lands); one callout
        carries find: ensureTool("fd") and spawn hand the search to an external program, so the
        harness decides the call and sees its result while the operating system governs the process.
        Slide 5 (Control) answers "How does a harness say no?": the beforeToolCall excerpt, the block
        reason returned as a tool result the model reads, the truncated-reply rule (stopReason
        "length" fails the whole tool batch), and the agent-session.ts wiring where pi's coding agent
        installs its extensions into beforeToolCall: the loop owns the hook point, the product
        supplies the policy. Slide 6 (Evidence) answers "How do I see what happened?": the
        afterToolCall and tool_execution_end excerpt with the event vocabulary in one line and the
        three-line subscribe excerpt; callouts: afterToolCall can rewrite a result before the model
        reads it, each event names tool, call, result, error, and duration, and anything can listen.
    "Drive GitHub's Harness":
      emphasis: high
      note: >
        Seven content slides, preserving the five-jobs mirror. One existing release dashboard is
        the primary SDK story; label every integration excerpt as a sketch, never as observed.
        Slide 1 maps pi jobs to SDK surfaces. Slide 2 (Loop) starts a session from a dashboard
        question and returns the answer to its UI; cancellation and lifecycle are in notes.
        Slide 3 (Context) names the release assistant role and the readiness tool as its source
        of facts. Slide 4 (Tools) wraps releaseService.getReadiness(user, releaseId) with
        defineTool and exposes only release_readiness. Distinguish application objects from SDK APIs.
        Slide 5 (Control) approves only that custom-tool name; the existing service still validates
        arguments, authorizes the app user, and retains business approval gates. Repository hooks
        remain opt-in with enableFileHooks and cannot inspect every internal service operation.
        Slide 6 (Evidence) sends streamed text to the UI and selected execution metadata to app
        telemetry. Separate successful execution from ready: false; the service audit carries the
        business result, and correlation is application wiring. Slide 7 walks question, tool request,
        method call, example blocker, UI answer, and control boundaries together. Quickstarts and
        the observed fresh-eyes report remain supporting README examples, not the SDK value statement.
    "Decide What It Sees":
      emphasis: high
      note: >
        Four content slides, the climax. Slide 1 answers "How do I express what the agent sees?": the
        createVisibilityPolicy call and the two-checkpoint table, with write-content inspection and
        per-segment command allowlists as the checks a host makes beyond a hook script (both Tested),
        tied back to beforeToolCall seeing the whole context. Slide 2 is the blind test writer on one
        slide: api_contract from SETUP.md with bug hints stripped, hidden paths including BUGS.md,
        writes only in __tests__/blind, host rerun 10 passing and 2 failing, POST /api/characters →
        500 mapped to BUGS.md #19, and the seasonId filter labeled undocumented by the referee because
        SETUP.md documents seasonId while the route reads season_id. Label test status apart from the
        domain finding. Slide 3 answers "What sits outside the host's view?": executed test code, processes
        outside mediated tools, and whether contract or code is right, framed as pi's find → fd
        boundary in GitHub's harness, with the container as the outer limit and the API owner deciding
        which side changes. Slide 4 answers "What evidence does a run leave?": four real JSONL lines
        (repo-hook, host-policy deny, runtime tool.complete, host session-end) joined by sessionId,
        plus the repository floor active inside both apps (19 preToolUse runs in fresh-eyes, 12 in
        blind tests).
    "Own It":
      emphasis: medium
      note: >
        Three content slides. Slide 1 answers "Which controls surround my harness?": policy hooks loaded
        machine-wide ahead of repository hooks and kept running under disableAllHooks, and the
        governance table condensed to access, model availability versus requested model, billing by
        authentication route (signed-in user or token follows Copilot policy; BYOK follows provider
        terms), tool and MCP policy with managedApprovalRequired, and process reach. Slide 2 combines
        the pre-flight checklist with the how-deep decision tree and names the owner who accepts each
        report. Slide 3 offers six existing-app integrations, from CI and release methods to
        runbook drills, a learning app, and an issue-to-release portal. Preserve app authority
        and evidence in each idea. Close by choosing one existing method to expose as a tool,
        its user checks and approval boundary, and what the app UI and telemetry will show.

