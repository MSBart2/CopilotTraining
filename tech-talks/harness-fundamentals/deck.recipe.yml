      claim: "The talk moves from a readable harness, to an SDK-hosted app, to visibility and a grounded harness choice."
      scene: "frame: four-part route linking to slides 4, 12, 16, and 20"
      seconds: 30
    - id: part-1
      part: 1
      claim: "Reading pi's source gives each later SDK callback a named place in the loop."
      scene: "frame: shared opener"
      seconds: 20
    - id: five-jobs
      part: 1
      claim: "Loop, context, tools, control, and evidence are five jobs a harness performs."
      scene: "deck: five aligned job rows with pi source locations"
      seconds: 110
    - id: pi-loop
      part: 1
      claim: "pi repeats model turns while tools or queued messages remain, then stops when the loop has no next work."
      scene: "deck: model request, tool result, next turn, and stop condition"
      seconds: 130
