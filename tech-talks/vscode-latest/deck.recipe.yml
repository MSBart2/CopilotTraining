#   ranking (sole `high`, primary live demo, metadata and agenda lead). Diverging from
#   README order would desync the deck from the canonical source for no evidentiary gain.
# - A fifth "Boundaries and Control" section: cost visibility, OTel, managed settings, MCP
#   allowlists, and sensitive prompt handling are qualifiers on other capabilities, not a
#   standalone narrative. They are woven into the sections they constrain.
# - Release-by-release catalog spine: removed by the approved refresh; it organizes by
#   changelog rather than by operating model.
# - Commit-attribution revert highlight: removed by the approved refresh; no longer
#   represents the highest-value current workflow.
# - Browser tab-sharing demo: superseded by the GA build-validate-review loop with device
#   emulation and element comments.
# - Standalone Claude / single-vendor section: model and harness choice is now the story;
#   harness portability is one line in Agent Infrastructure.
# - Live multi-session, peer-fork, or remote-reconnect demos: Preview surfaces with the
#   highest failure risk in the deck. Shown as prepared evidence instead.
# - "Fleet" framing carried over from the prior recipe: the 1.121–1.132 evidence is about
#   portability, model openness, and closing the loop, not about scale of orchestration.
# - VS Code 1.133: excluded as future-dated and unconfirmed per the refresh anomaly.
# - Individual model arrivals and non-editor changelog items (code review effort levels,
#   impact dashboard ROI, CLI session changes): out of scope, routed to other talks.
