      scene: "deck compare: five operating steps from the first-party docs (Open Compare Models in the Agents window or Ctrl+Alt+M · add 2–10 attempts and configure Judge/Synthesis · Run N Attempts from the last commit · read the Judge scorecard and Open Attempt N · continue in the winner or Synthesize; nothing auto-merges); reading-the-results strip (A: changes 14 files, tests pass; B: changes 2 files and adds a test, tests pass; smaller diff, same evidence, developer picks B); boundary (commit first, Allow all, judge is not proof, per-attempt usage, Agents window only, not Dev Containers). Badges: 1.143 Preview; 1.144 on by default + folderless chats."
      seconds: 170
    - id: pick-fusion
