# Recipe refresh approved by the user on 2026-11-01.
# Approval covers the 47-slide / 36-feature-card announcement-first structure,
# exact ordering and timing, four sections, and the proposed refresh candidates.
# Preserve evidence gaps, especially the unresolved first-party 1.143 date.
version: 1

approval:
  status: approved
  approved: "2026-11-01"
  scope: "Expanded announcement-first recipe and proposed content.refresh.yml candidates"

deck:
  title: "VS Code Copilot through 1.144"
  subtitle: "Find a better answer, keep work moving, delegate with fewer interruptions, and check more than the code"
  tagline: "A dated capability map with a proof path for every meaningful release."

  agenda:
    - title: "Choose an answer path"
      takeaway: "Inspect Fusion, comparisons, explicit models, context, and visual input against the task."
      whyItMatters: "The route, cost, policy, and evidence boundary remain visible."
    - title: "Carry work across boundaries"
      takeaway: "Follow session, workspace, host, and worktree state through interruptions and handoffs."
      whyItMatters: "A reopened conversation does not guarantee copied files or a running host."
    - title: "Accept evidence, not fluency"
      takeaway: "Use permissions, screenshots, browser feedback, diffs, tests, and PR evidence as separate checks."
      whyItMatters: "A tool approval or passing test does not prove the whole result."

  arcToc: "Answer → Continuity → Control → Evidence"
  arcNarrative: >
    Keep the four exact outcome sections and make each meaningful feature
    independently legible. Part 1 starts with the dated model and context
    choices. Part 2 follows session state across clients, hosts, containers,
    worktrees, and cloud. Part 3 moves from isolation to steering, permissions,
    and reversible changes. Part 4 closes with browser and artifact evidence.
    The release sequence is evidence-first rather than a single login story.
    Each feature card names its version, publication date, status, use case,
    newly possible action, proof plan, limitation, and capture state. The
    selected structure wins over a feature-family taxonomy because it preserves
    the four user-approved practitioner questions while making release
    provenance auditable. 1.140–1.143 items are proposed additions until the
    expanded refresh is approved; the inherited 1.139 baseline and approved
    1.144/Universe items remain marked as such.

  sectionOrder:
    - "Find a Better Answer"
    - "Keep Work Moving"
    - "Delegate with Fewer Interruptions"
    - "Check More Than the Code"

  sectionModes:
    "Find a Better Answer":
      emphasis: high
      note: >
        Use dated cards for the redesigned model picker (1.142), local models
        and comparison (1.143), Fusion GA and expanded comparisons (1.144),
        BYOK stateful responses (1.142), utility/context controls, and visual
        input. The reviewer sees the exact prompt, route, model/policy choice,
        and returned artifact. Never call a route better without a measured
        result. Proposed cards retain their proposed status.
    "Keep Work Moving":
      emphasis: high
      note: >
        Show the state that travels and the state that does not: multi-root
        and remote hosts (1.140), external sessions and sandboxing (1.141),
        canvases and moving chats (1.142), large-chat and worktree handling
        (1.143), and cloud continuity plus remote environments (1.144).
        Every card includes the reopen or move action and its host/workspace
        prerequisite.
    "Delegate with Fewer Interruptions":
      emphasis: high
      note: >
        Separate isolation, steering, permission, and acceptance. Cover peer
        chats, remote delegation, background-shell controls, queued messages,
        working-set/discard recovery, assisted permissions GA, and experimental
        computer use. A permission result never stands in for review of the
        resulting change.
    "Check More Than the Code":
      emphasis: medium-high
      note: >
        Keep the login page as one independent local example only here. Pair
        browser scope, screenshot/emulation, element feedback, measurement,
        tests, diffs, and PR evidence with a visible capture status. Browser
        capture is a later implementation task; desktop capture is unavailable
        in this review. Use first-party media links instead of invented images.

  preamble: []
  appendix: []

  highlightMoments:
    - "Fusion GA routes a request across models and exposes effort and billing, while policy and plan limits remain visible."
    - "Cloud sessions reopen across clients with a separate workspace; local uncommitted changes do not copy automatically."
    - "A peer chat shares files while a separate worktree isolates changes, so the delegation boundary is a deliberate choice."
    - "Assisted permissions can approve lower-risk calls, while higher-risk or uncertain calls still require confirmation."
    - "A screenshot, measurement, test, diff, and PR review answer different questions about the resulting behavior."

