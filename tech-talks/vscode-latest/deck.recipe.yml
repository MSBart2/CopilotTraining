      scene: "deck route-setup: four steps (Manage Language Models · Add Models → Custom Endpoint · API type Responses · pick it) beside chatLanguageModels.json for local Ollama with the statefulResponses line highlighted; dashed on-device card with real requirements (NVIDIA GPU 96 GB+ VRAM, ~55 GB disk, llama.cpp b11658+, GitHub sign-in) and its two settings."
      seconds: 100
    - id: pick-route-proof
      part: 1
      claim: "Same follow-up, two answers: a stateless server forgets unless VS Code resends the history."
      scene: "deck route-proof: two-turn conversation; default column answers Unknown with no error, statefulResponses false answers Teal (observed 2026-11-03, local Ollama 0.40.6); inference lane checked, tools/MCP/extensions lane unproven; boundary."
      seconds: 90
