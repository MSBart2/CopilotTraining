      scene: "deck fusion: Standard/High/Max effort selector → routed model path → usage/billing detail. Badge 1.144 GA. Boundary: each model used is billed; High/Max plan limits; model policy is not a data boundary."
      seconds: 110
    - id: pick-route-setup
      part: 1
