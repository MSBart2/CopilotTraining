# deck.recipe.yml — VS Code Latest talk guidance
#
# REFRESH: 2026-08-12
# COUNCIL DECISION: RESTRUCTURE — high confidence (prior 2026-08-10)
# FOLLOW-UP: 2026-08-12 — ADJUST. Author feedback: many teams still do not open the
# Agents window, and daily Vision paste (e.g. Excel clipboard → image attachment) is
# under-taught. Raise Parallel Agent Work to medium with an awareness/how-to-open lead;
# add Copilot Vision paste as a GA beat inside Closed-Loop Delivery. Keep Open Model
# Workbench as the sole high-emphasis peak and the GA browser loop as climax.
# PRIOR: 2026-08-10 — PRESERVE for model-retirement wording only.

version: 1

deck:
  title: "VS Code Copilot 1.121–1.132"
  subtitle: "Portable Agent Infrastructure, Open Models, and a Closed Review Loop"
  tagline: "Bring any model — including local Ollama — with no GitHub sign-in required"

  agenda:
    - title: "Run Any Model You Choose"
      takeaway: "Configure BYOK providers, local Ollama models, and a Stable Custom Endpoint in the model picker without a GitHub sign-in."
      whyItMatters: "Model choice, cost, and data residency become configuration decisions your team controls."
    - title: "Open the Agents Window"
      takeaway: "Leave side-chat-only habits: open the dedicated Agents window and run multi-session work with live activity."
      whyItMatters: "Most of the parallel and review story is invisible until this surface is open."
    - title: "Close the Loop In-Window"
      takeaway: "Paste vision evidence, emulate a device, screenshot, take element-anchored feedback, and route review back into the same session."
      whyItMatters: "Validation and context handoff stop costing a context switch on every iteration."

  arcToc: "Agent Infrastructure → Open Models → Parallel Work → Closed-Loop Delivery"

  arcNarrative: >
    The talk follows the README's own order because that order is the argument, not just
    a table of contents. Agent Infrastructure comes first as the substrate: the Copilot
    SDK and the open Agent Host Protocol separate the session from the window, so an
    agent can run on a machine the team owns and be reconnected later. It is deliberately
    short — mental model, not protocol tour — and Preview, so prepared evidence beats a
    live reconnect demo. Open Model Workbench remains the peak and the only high-emphasis
    section: BYOK without GitHub sign-in, Ollama, Stable Custom Endpoint, utility models,
    and 1M-token contexts — all GA and demoable — plus the firm boundary that inline/NES
    still need GitHub sign-in. Parallel Agent Work is no longer the most compressed
    section. Author delivery feedback is that many practitioners never open the Agents
    window at all, so the section now leads with awareness and open paths (title bar,
    Command Palette, code --agents), then the workspace claim (multi-session, worktrees,
    multi-chat), then the GA /btw and live-pills beats. Multi-session live demos stay
    off-limits as fragile Preview choreography; opening the window and showing its layout
    is the required awareness demo. Closed-Loop Delivery remains the practical climax:
    Copilot Vision paste (GA) for everyday evidence handoff, GA browser tools with device
    emulation and chat-attached screenshots, and v1.132 element comments. In-window diff
    review, CI, and PR response stay Preview direction-of-travel. Boundaries stay woven
    into the sections they constrain. End on a working loop, not a policy checklist.

  sectionOrder:
    - "Agent Infrastructure"
    - "Open Model Workbench"
    - "Parallel Agent Work"
    - "Closed-Loop Delivery"

  sectionModes:
    "Agent Infrastructure":
      emphasis: medium
      note: >
        2–3 slides. This section builds the mental model and then gets out of the way —
        do not let protocol detail crowd out the Open Model Workbench peak that follows.
        Slide 1: the decoupling claim. The Copilot SDK is the runtime agent harnesses are
        built on, and the Agent Host Protocol is an open protocol where an agent host owns
        authoritative session state, synchronizes it to connected clients, and sequences
        mutations; because it is open, other clients and hosts can implement it. The line
        that must land: the session is no longer the same thing as the window. Slide 2:
        remote machine execution as a concrete three-step flow — open the Agents window,
        connect its remote tab via an existing ~/.ssh/config entry, a user@host value, or
        a running dev tunnel, and VS Code installs or connects to its CLI server and starts
        the agent host there. State plainly that the host persists after the VS Code window
        closes and that progress, tool outputs, and session memory remain available on
        reconnect; v1.132 allows the same session to be connected from multiple VS Code
        windows. Label this Preview explicitly — remote agents and parts of the AHP rollout
        are preview, while host registration and multi-client session UX continue to
        evolve. No live reconnect demo is required; prepared or
        recorded evidence is the default because this surface is Preview. Optional slide 3:
        the local-versus-remote decision guide, compressed to the two decisive branches —
        interactive and exploratory work stays local; long-running autonomous work or work
        needing environment parity and controlled access goes remote. Mention here, in one
        line only, that the agent host can run Copilot, Claude, and Codex harnesses in a
        dedicated process — harness portability is the point; no model or vendor gets its
        own slide. Cut: AHP message-level mechanics, harness-by-harness comparison, and any
        implication that remote hosts are ready for production-critical workflows.

    "Open Model Workbench":
      emphasis: high
      note: >
        4–5 slides. This is the peak of the talk and the only high-emphasis section; give
        it the most time and the strongest live demo. Open with the headline as a status
        claim, not a feature list: BYOK is GA and needs no GitHub sign-in — Anthropic,
        Azure, Gemini, OpenAI, Ollama, OpenRouter, or any compatible custom endpoint works
        for chat, tool execution, and MCP, with billing and rate limits going through the
        provider rather than Copilot quotas. PRIMARY LIVE DEMO (GA, must be live): open the
        model picker, choose Manage Models…, add a provider, and watch the models appear in
        the picker. Dedicate a full slide to local and open models via Ollama — install
        Ollama, pull a model, select Manage Models… → Ollama, and VS Code discovers locally
        available models automatically; local models work with all chat features, tool
        execution, and MCP with no network request leaving the machine. Name the audience
        this unlocks: teams with air-gap requirements, sensitive codebases, or constrained
        data residency. This is the moment the audience should feel the ceiling move; do
        not bury it in a bullet list with the hosted providers. Next slide: Stable Custom
        Endpoint plus utility models as the team-scale story — Custom Endpoint is Stable as
        of v1.122 and connects endpoints implementing the Chat Completions, Responses, or
        Messages API families, so an internal gateway for cost control, logging, or
        compliance can carry all VS Code Copilot chat traffic with no client-side code
        change; utility models are independently configurable via chat.utilityModel and
        chat.utilitySmallModel, so a fast local or lower-cost model can handle titles,
        summaries, commit messages, rename suggestions, and intent detection while a
        frontier model handles primary work. Show the settings block. Then 1M-token
        contexts on supported models as an architectural decision for large-codebase tasks,
        with the honest tradeoff stated: very long contexts increase latency and provider
        cost, and /compact and background compaction remain the counterweight. THE ONE FIRM
        BOUNDARY, stated once and clearly: inline suggestions and next edit suggestions
        still require GitHub sign-in and a Copilot subscription — BYOK covers chat, agents,
        tool calls, and MCP, not the completions engine. Weave the relevant control thread
        here, not in a separate section: session and subagent credit usage and model costs
        are visible in the Agents window, and some controls depend on Copilot plan and
        organization policy. Cut: provider-by-provider capability tables, pricing
        comparisons, individual model arrivals, and any standalone vendor focus.

    "Parallel Agent Work":
      emphasis: medium
      note: >
        3–4 slides. Lead with awareness, not orchestration depth — the delivery problem is
        that many people never open the Agents window. Slide 1 (required): Open It. Show
        the open paths live or as a crisp callout — title bar Open in Agents, Command
        Palette "Chat: Open Agents Window", code --agents, welcome-page entry, and the
        optional browser Agents surface. State that it is a dedicated VS Code window beside
        the editor, sharing sessions/settings/keybindings with the side Chat view so
        context is not forked. Slide 2: what the window is for — sessions list across
        workspaces, Chat + Changes + Files for the active session, customizations panel —
        and the one-line contrast with side chat (code-adjacent vs agent-first). Slide 3:
        workspace claim compressed — multiple sessions side by side with isolated
        worktrees, multi-chat / peer forks as a structural claim, one concrete pattern
        (two approaches, two worktrees, compare diffs). Label Preview limits out loud.
        Slide 4 (or combined with 3): GA /btw side chats and live activity pills as the
        safe live beats. Do not run a multi-session endurance demo. Cut: fork merge
        semantics, grouping UI tours, production-orchestration claims.

    "Closed-Loop Delivery":
      emphasis: medium-high
      note: >
        4–5 slides and the practical climax. Everything the audience can do tomorrow with
        no Preview dependency lives here. Open with a short GA Vision beat before the
        browser climax: Copilot Vision is GA (v1.128) — paste, drag-drop, or attach images
        and PDFs in ask/plan/agent modes on all Copilot plans. Call out the everyday
        pattern author feedback highlighted: copy a large Excel range (or other clipboard
        content that includes image data), paste into Chat, and it attaches as vision
        context instead of a wall of cells. Pair with integrated-browser Add Screenshot /
        Add Element / Add Console Logs to Chat for human-driven evidence. Then the status
        fact: agentic browser tools are GA and on by default — navigation, screenshots,
        interaction, device emulation, remote browsing; agent pages are private in-memory
        and existing tabs must be shared. CLIMAX DEMO (GA, live): agent opens localhost,
        emulates a device, screenshots into the chat turn, then v1.132 element comments
        (Ctrl+Alt+C / ⌥⌘C). That implement → emulate → screenshot → annotate → re-validate
        loop is the last working thing the audience should see. One Preview direction slide:
        in-window diff review, CI failure response, PR comment response; hybrid Markdown
        experimental, one sentence, no demo. Weave control thread (OTel, managed settings,
        MCP allowlists, sensitive prompts) here. End on the working loop, not policy.

  preamble: []
  appendix: []

  highlightMoments:
    - "BYOK is GA without a GitHub sign-in: add an Anthropic, Azure, Gemini, OpenAI, Ollama, OpenRouter, or compatible custom endpoint key in Manage Models… and it drives chat, tool execution, and MCP with billing and rate limits handled by the provider instead of Copilot quotas."
    - "Ollama is a first-class provider, so VS Code discovers locally pulled open models automatically and runs chat, tools, and MCP against them with no network request leaving the machine — the practical unlock for air-gapped teams and sensitive codebases."
    - "Custom Endpoint is Stable and utility models are independently configurable, so a team can route every VS Code Copilot chat call through its own gateway while chat.utilityModel and chat.utilitySmallModel hand titles, summaries, and commit messages to a cheap local model and reserve the frontier model for real work."
    - "Open the Agents window — title bar Open in Agents, Chat: Open Agents Window, or code --agents — and leave side-chat-only agent habits; it is the dedicated multi-workspace surface for sessions, changes, and parallel work."
    - "Copilot Vision is GA: paste an Excel range, mockup, or PDF into Chat and attach visual evidence instead of a wall of text; pair with browser Add Screenshot / Element to Chat when you already have the page open."
    - "GA browser tools close the loop live — the agent opens a localhost page, emulates a device, screenshots it into the chat turn as permanent evidence, and in v1.132 takes comments anchored to the exact elements that still need work, all without leaving the session."

