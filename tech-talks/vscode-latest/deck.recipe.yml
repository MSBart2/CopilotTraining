      name: "Four decisions, every run"
      concept: >
        One card at center labelled "EVERY AGENT RUN": "Four decisions, and a
        control you can inspect for each." Four oversized verbs, PICK, PLACE,
        STEER, KEEP, arrive from the four edges and lock onto the card in run
        order. Each verb brings one small control chip from the releases
        (Compare, Cloud session, Stop Shell, Keep/Undo). The final frame reads
        as one run with four decisions, not four features. Slide 2 then shows
        the unsorted feature wall; the release map at the end files the same
        list under the verbs.
      motion: >
        Card settles first; verbs slide in one at a time in run order; each chip
        clicks onto the card edge; the KEEP chip lands last as two buttons.
      guardrails: >
        No product screenshot implied. No node graph or stacked feature tiles
        on the title. Title and thesis stay prominent.
    publicationGate:
      relevant: "A developer, team lead, or platform engineer must decide how to use each weekly VS Code agent release on a real repository task."
      compelling: "Four verbs in run order turn a release train into one memorable decision model, and every new control arrives with the autonomy it governs."
      actionable: "A four-line card (intelligence, place, what acts unasked, evidence for Keep) applied to one real task, with a recovery move when evidence disagrees."
