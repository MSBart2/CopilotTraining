version: 1

approval:
  status: approved
  approved: "2026-11-03"
  scope: "Pick · Place · Steer · Keep restructure; hero proof slides plus roundups so no approved feature is dropped; 2026-11-03 revision: self-contained examples per slide and an opening feature wall"

deck:
  title: "VS Code Agents: Pick, Place, Steer, Keep"
  subtitle: "Four decisions for every agent run, and the controls VS Code 1.140–1.144 added for each"
  tagline: "Each release lets the agent go further on its own, and each adds the control that keeps the result yours."

  agenda:
    - title: "Four verbs that hold the release train"
      takeaway: "Every 1.140–1.144 agent feature lands on one of four decisions: pick, place, steer, or keep."
      whyItMatters: "A weekly release becomes a question you already ask, so new features have somewhere to go."
    - title: "Each control with its boundary"
      takeaway: "Every hero feature appears on its own short, self-contained example, with version, status, and limit in view."
      whyItMatters: "A practitioner can lift any one slide into their own work without replaying a shared story."
    - title: "A four-line card for your next task"
      takeaway: "Name the intelligence, the place, what may act unasked, and the evidence that earns Keep."
      whyItMatters: "The card works on a real repository task the day after the talk."

  arcToc: "Pick → Place → Steer → Keep"
  arcNarrative: >
    The previous deck taught 36 equal feature cards under four long, non-parallel
    outcome names; nothing told the audience how many categories there were or
    how to remember them. This structure gives the release train one memorable
    model: every agent run in VS Code comes down to four decisions, and each verb
    is a question the practitioner already asks. Pick: which intelligence answers?
    Place: where does the work run, and what travels with it? Steer: what happens
    while it runs, and what may act unasked? Keep: which changes stay, on what
    evidence? The verbs are parallel, short, and in run order, so the section
    count is self-evident. The working set's literal Keep/Undo buttons make the
    last verb concrete. The four verbs are the only memory hook: there is no
    shared story. Each slide carries its own short, self-contained example
    (two comparison attempts read by diff size and evidence, a long test-and-fix
    task started in the cloud, a hung test shell, a working set with one
    unrelated change undone), so any slide stands on its own. Features that are
    a different case of the same decision (Fusion, local models, computer use,
    remote delegation) are framed as "same decision, different case" so they
    still teach the verb. Every verb ends
    with an "also shipped" roundup (Keep needs none; all its features earn hero
    slides), so no approved feature disappears silently.
    The tension is optimistic: autonomy and control grow together. Cloud
    sessions, assisted permissions, and computer use let the agent go further
    without the developer; comparisons, Stop Shell, queued-message control,
    sandboxing, and the working set keep the result theirs. The talk opens with
    an unsorted feature wall: every agent feature on the release map as a
    neutral chip with its version, in shuffled order, so the audience feels the
    weekly noise, then one line says each one changes one of four decisions.
    It closes with the release map, the same feature list filed under the four
    verbs, so the audience leaves with a filing system for next week's release.
    Alternative considered: keep the outcome sections and add verb labels. It
    preserves layout but keeps 36 equal cards, so it does not solve the memory
    problem. A feature-family taxonomy (models, sessions, shells, browser) was
    rejected again because it describes product parts rather than decisions.

  sectionOrder:
    - "Pick"
    - "Place"
    - "Steer"
    - "Keep"

  sectionModes:
    "Pick":
      emphasis: high
      note: >
        Audience question: which intelligence answers this task, and how do I
        know? Open with comparing two attempts at one task:
        1.143 model and harness comparisons (Preview) run independently in
        separate sessions/worktrees, with optional Judge and Synthesize; 1.144
        lets comparisons start before a repository exists (not in Dev
        Containers). The scorecard is a recommendation for human review, not a
        verdict. Then Fusion GA (1.144) as "let Copilot pick": Standard/High/Max,
        routed models, every model billed, plan limits, model policy is not a
        data boundary. Then where inference runs: 1.143 local models
        (Experimental, eligible hardware) and 1.142 BYOK statefulResponses false;
        inference placement does not prove tool, extension, or MCP traffic stays
        local. Split into setup and proof: Custom Endpoint steps for a local
        Ollama server, then the observed two-answer run (Unknown versus Teal)
        that shows why statefulResponses false exists. Roundup: 1.142 model picker, Copilot Vision GA, context sizing and
        /compact, explicit provider route. No route is called better without a
        measured result.
    "Place":
      emphasis: high
      note: >
        Audience question: where does this work run, and what travels with it?
        Start with the isolation choice: shared checkout or fresh worktree; 1.142
        moves a chat into a worktree when you ask the agent (Copilot harness or
        Codex; one chat, one local folder), 1.140 peer worktrees are Experimental. Centerpiece and anchor:
        1.144 cloud sessions (Experimental) across two slides. Start a long-running task in VS Code, it
        runs in a separate cloud workspace, the developer checks progress from
        GitHub Mobile, then returns to VS Code with the same conversation. Local
        uncommitted changes do not copy; paid plan and organization policy apply.
        Then hosts: the Agent Host keeps a session alive beyond a window; the
        1.144 Remote Environments dialog shows targets, and 1.140 remote
        delegation tools (Experimental, off by default) match a task to host
        capacity. A visible remote does not prove host, repository, or toolchain
        readiness. Roundup: 1.141 external sessions, 1.140 Dev Container cleanup,
        1.143 sliced large-chat restore (release-observed macOS table only),
        1.143 worktree cleanup.
    "Steer":
      emphasis: high
      note: >
        Audience question: what can I see and change while it runs, and what may
        act without asking? A test run hangs: the 1.141
        Background Shells pill shows command, runtime, and output; 1.142 Stop
        Shell ends one attached shell without ending the session (detached shells
        cannot be stopped there). Plans change: 1.141 queued-message
        control edits or cancels the next message; a started turn is immutable.
        Then what acts unasked: 1.144 assisted permissions (GA) use a risk
        assessment for lower-risk calls inside Folder-isolated sessions;
        automatic approval is not review of the result. 1.141 sandboxing is an
        additional OS/host layer, not a standalone security boundary. Computer
        use (Experimental, local Windows/macOS Copilot harness) is "same
        decision, different case": every desktop action needs approval. Roundup:
        1.142 shared canvases (Preview), /btw and activity, isolation baseline.
    "Keep":
      emphasis: high
      note: >
        Audience question: which changes stay, and on what evidence? The 1.143
        working set (Experimental) makes the verb literal: per-file Keep or Undo
        before edits remain in the working tree; 1.144 added file-level Undo, on by
        default in the editor. Scoped discard follows branch, session, or last-turn boundaries
        and is destructive within its scope. Browser evidence for a UI change:
        screenshot at the viewport you care about, element feedback on the
        element that is wrong, a proposed CSS change, then a fresh recapture. Keep runner
        status, page measurement, and diff/PR review in separate columns; agent
        visibility does not grant merge authority. Recovery is a strip on the evidence slide: comment and retry, or Undo or discard.
        The viewport is the test condition; the expected result is a criterion, not an observed outcome.

  preamble: []
  appendix: []

  highlightMoments:
    - "Every 1.140–1.144 agent feature lands on one of four verbs, so a weekly release has somewhere to go: Pick, Place, Steer, Keep."
    - "An unsorted wall of every agent feature opens the talk; the release map closes it with the same list filed under four verbs."
    - "Two attempts at the same task run side by side; the comparison scorecard informs the developer's choice and never makes it."
    - "A cloud session started in VS Code keeps running after the laptop closes, is checked from GitHub Mobile, and returns to VS Code; local uncommitted changes stay where they were."
    - "Stop Shell ends one hung test run while the session, its conversation, and other shells keep going."
    - "The working set's Keep and Undo buttons decide, file by file, which agent edits remain."

