# deck.recipe.yml — VS Code Latest talk guidance
#
# REFRESH: 2026-08-10
# COUNCIL DECISION: RESTRUCTURE — high confidence
# RATIONALE: The release catalog and fleet metaphor no longer fit portable agent hosts,
# open model choice, parallel work, and closed-loop delivery. Preserve the README's four-
# pillar order, make Open Model Workbench the sole high-emphasis section, and close on the
# GA browser validation loop. Label Preview and Experimental material explicitly.
# FOLLOW-UP: 2026-08-10 — PRESERVE. The September model retirement only replaces a
# named README example; the recipe already uses durable supported-model language.

version: 1

deck:
  title: "VS Code Copilot 1.121–1.132"
  subtitle: "Portable Agent Infrastructure, Open Models, and a Closed Review Loop"
  tagline: "Bring any model — including local Ollama — with no GitHub sign-in required"

  agenda:
    - title: "Run Any Model You Choose"
      takeaway: "Configure BYOK providers, local Ollama models, and a Stable Custom Endpoint in the model picker without a GitHub sign-in."
      whyItMatters: "Model choice, cost, and data residency become configuration decisions your team controls."
    - title: "Detach Agents From the Window"
      takeaway: "See how the Copilot SDK and the Agent Host Protocol let a session run on a machine you own and survive disconnect."
      whyItMatters: "Long-running work stops being tied to one laptop and one open editor."
    - title: "Close the Loop In-Window"
      takeaway: "Watch an agent build, emulate a device, screenshot, take element-anchored feedback, and route review back into the same session."
      whyItMatters: "Validation and review stop costing a context switch on every iteration."

  arcToc: "Agent Infrastructure → Open Models → Parallel Work → Closed-Loop Delivery"

  arcNarrative: >
    The talk follows the README's own order because that order is the argument, not just
    a table of contents. Agent Infrastructure comes first as the substrate: the Copilot
    SDK and the open Agent Host Protocol separate the session from the window, so an
    agent can run on a machine the team owns and be reconnected later. It is deliberately
    the shortest of the two opening sections — it must establish the mental model, not
    exhaust the protocol, and it is Preview, so it earns explanation rather than a live
    demo. Open Model Workbench is the peak of the talk and the only high-emphasis
    section. It is where the audience recalibrates: BYOK now works without GitHub
    sign-in, Ollama is a first-class provider, Custom Endpoint is Stable, utility models
    are separately configurable, and supported models expose 1M-token contexts — all GA,
    all demonstrable live. It also carries the one firm boundary of the whole talk:
    inline suggestions and next edit suggestions still require GitHub sign-in. Placing it
    second rather than first is intentional — the audience has just been told the harness
    is portable, and the natural next question is "portable running what?" The answer is
    "any model you choose, including one running on your own machine," which lands harder
    as a payoff than as an opener. Parallel Agent Work is deliberately compressed, and
    that compression is the recipe's main act of restraint. Multiple sessions, multiple
    chats per session, peer forks, and worktrees across harnesses are genuinely
    significant, but the Agents window is Preview and multi-session live demos are the
    most fragile thing in the release window. The section runs on the two GA beats —
    /btw side chats and live activity pills — plus a clear structural claim about
    isolated worktrees, and it hands the recovered time to the closing section. Closed-
    Loop Delivery is the climax because it is where the audience can act tomorrow: GA
    browser tools on by default, device emulation and screenshots attached to the chat
    turn, and element-specific comments in v1.132 give a complete build-validate-fix loop
    that requires no Preview surface at all. In-window diff review, CI failure handling,
    and PR comment response extend that loop and are shown as the Preview direction of
    travel, with hybrid Markdown editing named as experimental. Boundaries and Control is
    never its own section; cost visibility, OpenTelemetry, managed settings, MCP
    allowlists, and sensitive-terminal-prompt handling appear inside the sections they
    actually constrain, with plan dependence stated where relevant. The talk ends on a
    working loop rather than a governance checklist.

  sectionOrder:
    - "Agent Infrastructure"
    - "Open Model Workbench"
    - "Parallel Agent Work"
    - "Closed-Loop Delivery"

  sectionModes:
    "Agent Infrastructure":
      emphasis: medium
      note: >
        2–3 slides. This section builds the mental model and then gets out of the way —
        do not let protocol detail crowd out the Open Model Workbench peak that follows.
        Slide 1: the decoupling claim. The Copilot SDK is the runtime agent harnesses are
        built on, and the Agent Host Protocol is an open protocol where an agent host owns
        authoritative session state, synchronizes it to connected clients, and sequences
        mutations; because it is open, other clients and hosts can implement it. The line
        that must land: the session is no longer the same thing as the window. Slide 2:
        remote machine execution as a concrete three-step flow — open the Agents window,
        connect its remote tab via an existing ~/.ssh/config entry, a user@host value, or
        a running dev tunnel, and VS Code installs or connects to its CLI server and starts
        the agent host there. State plainly that the host persists after the VS Code window
        closes and that progress, tool outputs, and session memory remain available on
        reconnect; v1.132 allows the same session to be connected from multiple VS Code
        windows. Label this Preview explicitly — remote agents and parts of the AHP rollout
        are preview, while host registration and multi-client session UX continue to
        evolve. No live reconnect demo is required; prepared or
        recorded evidence is the default because this surface is Preview. Optional slide 3:
        the local-versus-remote decision guide, compressed to the two decisive branches —
        interactive and exploratory work stays local; long-running autonomous work or work
        needing environment parity and controlled access goes remote. Mention here, in one
        line only, that the agent host can run Copilot, Claude, and Codex harnesses in a
        dedicated process — harness portability is the point; no model or vendor gets its
        own slide. Cut: AHP message-level mechanics, harness-by-harness comparison, and any
        implication that remote hosts are ready for production-critical workflows.

    "Open Model Workbench":
      emphasis: high
      note: >
        4–5 slides. This is the peak of the talk and the only high-emphasis section; give
        it the most time and the strongest live demo. Open with the headline as a status
        claim, not a feature list: BYOK is GA and needs no GitHub sign-in — Anthropic,
        Azure, Gemini, OpenAI, Ollama, OpenRouter, or any compatible custom endpoint works
        for chat, tool execution, and MCP, with billing and rate limits going through the
        provider rather than Copilot quotas. PRIMARY LIVE DEMO (GA, must be live): open the
        model picker, choose Manage Models…, add a provider, and watch the models appear in
        the picker. Dedicate a full slide to local and open models via Ollama — install
        Ollama, pull a model, select Manage Models… → Ollama, and VS Code discovers locally
        available models automatically; local models work with all chat features, tool
        execution, and MCP with no network request leaving the machine. Name the audience
        this unlocks: teams with air-gap requirements, sensitive codebases, or constrained
        data residency. This is the moment the audience should feel the ceiling move; do
        not bury it in a bullet list with the hosted providers. Next slide: Stable Custom
        Endpoint plus utility models as the team-scale story — Custom Endpoint is Stable as
        of v1.122 and connects endpoints implementing the Chat Completions, Responses, or
        Messages API families, so an internal gateway for cost control, logging, or
        compliance can carry all VS Code Copilot chat traffic with no client-side code
        change; utility models are independently configurable via chat.utilityModel and
        chat.utilitySmallModel, so a fast local or lower-cost model can handle titles,
        summaries, commit messages, rename suggestions, and intent detection while a
        frontier model handles primary work. Show the settings block. Then 1M-token
        contexts on supported models as an architectural decision for large-codebase tasks,
        with the honest tradeoff stated: very long contexts increase latency and provider
        cost, and /compact and background compaction remain the counterweight. THE ONE FIRM
        BOUNDARY, stated once and clearly: inline suggestions and next edit suggestions
        still require GitHub sign-in and a Copilot subscription — BYOK covers chat, agents,
        tool calls, and MCP, not the completions engine. Weave the relevant control thread
        here, not in a separate section: session and subagent credit usage and model costs
        are visible in the Agents window, and some controls depend on Copilot plan and
        organization policy. Cut: provider-by-provider capability tables, pricing
        comparisons, individual model arrivals, and any standalone vendor focus.

    "Parallel Agent Work":
      emphasis: medium-low
      note: >
        1–2 slides, deliberately compressed — the time saved here funds the closing
        section. The structural claim first: the Agents window has moved from a monitoring
        dashboard to a workspace, running multiple sessions side by side, each with its own
        worktree, tool context, and model configuration, with grouping, reordering, and
        filtering; multiple chats per session and peer-chat forks let a developer branch
        from any point in a conversation while sharing the session's worktree and tool
        state; and worktree isolation now holds across local, remote, and Copilot SDK
        harnesses so the review-and-merge workflow is the same wherever the session ran.
        Give one concrete pattern — two sessions on two approaches to the same problem,
        each in its own worktree, compared by diff when both finish — and move on. Label
        this cluster Preview and say the limit out loud: cross-host session management,
        peer-fork merge conflict resolution, and group-level settings are still evolving,
        so treat the Agents window as high-capability preview rather than a stable
        production substrate. Do not attempt a live multi-session demo; it is the most
        fragile beat available and it competes with the Open Model Workbench demo for the
        audience's attention. The demonstrable beat here is GA and small: /btw opens a
        contextual side chat that runs alongside an active agent turn without pausing it,
        sharing the primary chat's context and prompt cache, and live activity pills surface
        changes, previews, subagents, and browsers at a glance and clear when the turn
        completes. Those two are safe to show live and are the honest takeaway — parallel
        work is now legible, not just possible. Cut: session grouping UI tours, fork merge
        semantics, and any claim that parallel orchestration is production-ready.

    "Closed-Loop Delivery":
      emphasis: medium-high
      note: >
        3–4 slides and the practical climax of the talk. Everything the audience can do
        tomorrow with no Preview dependency lives here. Lead with the status fact: agentic
        browser tools are GA and enabled by default as of the June 2026 release, with no
        configuration flag required — navigation, page reading, screenshots, click, hover,
        type, dialog handling, element dragging, Playwright automation sequences, device
        emulation, and remote browsing against a browser on the host running the session.
        Note that agent-opened pages run in private in-memory sessions and existing tabs
        must be explicitly shared. CLIMAX AND PRIMARY CLOSING DEMO (GA, run it live): the
        agent opens a localhost page in the integrated browser, emulates a device preset or
        custom viewport, screenshots the result, and the screenshot is attached to the chat
        turn that produced it — the validation evidence becomes part of the conversation
        record. Then the v1.132 element-specific comments beat: select one or more elements
        in the integrated browser, anchor a separate comment to each, and send that precise
        visual feedback back to the agent. That sequence — implement, emulate, screenshot,
        annotate the exact elements, re-validate — is the single most compelling live moment
        available in this release window and it should be the last thing the audience sees
        working. Follow with one slide on where the loop is heading, clearly marked Preview:
        files and diffs from a session are reviewable inside the Agents window with per-file
        apply, revert, or cherry-pick and inline comments that the agent acts on in later
        turns; failed CI check details surface in the session so the agent can read the
        failure, apply a fix, and re-run checks; and pull request review comments arriving on
        the branch can be answered, applied, or marked addressed without leaving the window.
        Name hybrid Markdown editing as Experimental in one sentence and do not demo it.
        Close the control thread here rather than in a separate section: OpenTelemetry
        signals from agent sessions export tool call latency, turn count, and subagent depth
        as structured spans; managed settings let organizations enforce baseline
        configuration; enterprise MCP allowlists centrally control which MCP servers sessions
        can reach; and sensitive terminal prompts for passwords, passphrases, PINs, and
        verification codes are intercepted, with auto-approve flows cancelling the command
        and instructing the model not to retry or request the secret. State that some of
        these depend on Copilot plan and organization policy. End on the working loop, not
        the policy list.

  preamble: []
  appendix: []

  highlightMoments:
    - "BYOK is GA without a GitHub sign-in: add an Anthropic, Azure, Gemini, OpenAI, Ollama, OpenRouter, or compatible custom endpoint key in Manage Models… and it drives chat, tool execution, and MCP with billing and rate limits handled by the provider instead of Copilot quotas."
    - "Ollama is a first-class provider, so VS Code discovers locally pulled open models automatically and runs chat, tools, and MCP against them with no network request leaving the machine — the practical unlock for air-gapped teams and sensitive codebases."
    - "Custom Endpoint is Stable and utility models are independently configurable, so a team can route every VS Code Copilot chat call through its own gateway while chat.utilityModel and chat.utilitySmallModel hand titles, summaries, and commit messages to a cheap local model and reserve the frontier model for real work."
    - "The Copilot SDK and the open Agent Host Protocol detach the session from the window: a Preview remote agent host started over SSH or a dev tunnel keeps running after VS Code closes, and v1.132 lets the same session be connected from multiple windows."
    - "GA browser tools close the loop live — the agent opens a localhost page, emulates a device, screenshots it into the chat turn as permanent evidence, and in v1.132 takes comments anchored to the exact elements that still need work, all without leaving the session."

