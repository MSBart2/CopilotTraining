version: 1

refresh:
  talk: "tech-talks/vscode-latest"
  cutoff: "2026-09-16"
  feed:
    url: "https://developer.microsoft.com/api/changelog/rss"
    checked: "2026-09-25"
    lastBuildDate: "Fri, 25 Sep 2026 12:00:10 GMT"
  status: approved
  approved: "2026-09-25"
  updateLevel: content
  rationale: >
    VS Code 1.139 is stable, but the talk and deck still advertise 1.121-1.132.
    The four-part argument and existing BYOK/browser demo still fit. Correct the
    Agents-window sign-in boundary and version framing, then add the remote
    Dev Container and in-window PR handoffs as supporting steps. Patch existing
    slides rather than replacing the demo or reweighting the sections.
  userEmphasis:
    - "Prioritize changes needed for the Monday, 2026-09-28 delivery."

  accepted:
    - title: "Agents window signed-out BYOK boundary"
      published: "undated documentation; checked 2026-09-25"
      source: "https://code.visualstudio.com/docs/agents/run/agents-window"
      verified: "2026-09-25"
      releaseStatus: experimental
      importance: supporting
      targetSection: "Open Model Workbench; Parallel Agent Work; Boundaries and Control"
      action: replace
      summary: >
        BYOK chat can work without GitHub sign-in, but signed-out use of the
        desktop Agents window is experimental and requires
        chat.agentHost.allowSignedOutWhenUsable; Agent Host BYOK models also
        require chat.agentHost.byokModels.enabled. Browser-based Agents window
        always requires GitHub sign-in. Qualify the no-sign-in tagline on the
        deck and avoid demonstrating signed-out Agents window as a GA path.
      limitations:
        - "A suitable provider or visible BYOK model must already be configured."
        - "The browser-based Agents window always requires GitHub sign-in."
      recipeImpact: confirm
      slideImpact: patch

    - title: "Visual Studio Code 1.139: remote Dev Container agent sessions"
      published: "2026-09-23"
      source: "https://code.visualstudio.com/updates/v1_139"
      verified: "2026-09-25"
      releaseStatus: "gradual rollout (no GA status stated)"
      importance: supporting
      targetSection: "Agent Infrastructure: Remote Hosts and a Portable Harness"
      action: expand
      summary: >
        Agents-window sessions can use a project's Dev Container on SSH,
        Tunnel, and WSL hosts, extending local Dev Container sessions from
        1.138. Enable chat.agentHost.devContainer.enabled and select Use Dev
        Container for a remote folder with a supported configuration and
        Docker on the remote host. This strengthens the environment-parity
        decision without changing the remote-host demo.
      limitations:
        - "Gradual rollout; feature may need manual enablement."
        - "Docker and a supported Dev Container configuration are required."
      recipeImpact: confirm
      slideImpact: patch

    - title: "Visual Studio Code 1.138: create pull requests from agent sessions"
      published: "2026-09-16"
      source: "https://code.visualstudio.com/updates/v1_138"
      verified: "2026-09-25"
      releaseStatus: "not specified (optional Agent Merge: experimental)"
      importance: supporting
      targetSection: "Closed-Loop Delivery: CI and PR Feedback Response"
      action: expand
      summary: >
        Agent Host sessions can present a PR form with an editable generated
        title and description and draft choice; the developer can create the
        PR directly or ask the agent to do it. The optional Agent Merge path
        is experimental and requires chat.agentMerge.enabled. Distinguish
        creating a PR from Copilot code review and CI feedback.
      limitations:
        - "Do not describe optional Agent Merge as GA."
      recipeImpact: confirm
      slideImpact: patch

    - title: "GitHub Copilot auto model selection tiers"
      published: "2026-09-18"
      source: "https://github.blog/changelog/2026-09-18-github-copilot-weekly-releases-september-14"
      verified: "2026-09-25"
      releaseStatus: "gradual rollout (no GA status stated)"
      importance: reference
      targetSection: "Open Model Workbench: Model Selection Decision Guide"
      action: update
      summary: >
        Efficiency, balance, and intelligence tiers are rolling out in VS Code
        for Copilot auto model selection. They weigh cost, quality, and response
        time using the same available model pool; they are not BYOK providers.
        Mention only if the live model picker exposes the tiers.
      limitations:
        - "Rolling out; availability differs by client and account."
      recipeImpact: none
      slideImpact: none

  ignored:
    - title: "VS Code 1.139 faster session-list loading and compact rows"
      source: "https://code.visualstudio.com/updates/v1_139"
      reason: "Useful polish, but the single-machine 645-session benchmark is not a general audience promise or a new workflow decision."
      relatedTalks: []
    - title: "VS Code 1.138 automations enabled by default and shareable"
      source: "https://code.visualstudio.com/updates/v1_138"
      reason: "Scheduling is an adjacent autonomous-workflow topic; status is inconsistent with current Stable documentation, so do not displace the main live demo."
      relatedTalks:
        - "tech-talks/agentic-workflows"
    - title: "September 2026 Copilot-hosted model arrivals"
      source: "https://github.blog/changelog/2026-09-22-claude-opus-5-5-is-now-available-in-github-copilot/"
      reason: "Provider/model catalog changes do not alter the durable BYOK decision; avoid an ephemeral model roll call."
      relatedTalks:
        - "tech-talks/enterprise-patterns"
    - title: "Upcoming October 19 Copilot model deprecations"
      source: "https://github.blog/changelog/2026-09-18-upcoming-deprecation-of-selected-github-copilot-models-in-mid-october/"
      reason: "No named model slated for retirement is used in the current talk or deck; retain durable currently-supported-model guidance."
      relatedTalks:
        - "tech-talks/copilot-cli"
    - title: "Copilot code review settings and improved findings"
      source: "https://github.blog/changelog/2026-09-23-copilot-code-review-more-ways-to-request-and-configure-reviews/"
      reason: "GitHub PR review configuration is distinct from the editor's agent-session review loop."
      relatedTalks:
        - "tech-talks/copilot-code-review"
    - title: "Default enablement policy for Business and Enterprise"
      source: "https://github.blog/changelog/2026-09-24-default-enablement-of-copilot-features-for-copilot-business-and-enterprise/"
      reason: "The policy takes effect October 22; current preview features remain opt-in. It does not change the Monday VS Code demo."
      relatedTalks:
        - "tech-talks/enterprise-patterns"

  removals:
    - "Replace stale 1.121-1.132 'latest' title, update-to-1.132 checklist, and matching slide references with current 1.139 framing."
    - "Qualify deck claims implying signed-out BYOK works in the Agents window without experimental settings."
  anomalies:
    - title: "Visual Studio Code 1.140 (Insiders)"
      source: "https://code.visualstudio.com/updates/v1_140"
      reason: "Feed flags a future-dated item; do not describe it as stable for September 28."
    - title: "Automations default in Stable"
      source: "https://code.visualstudio.com/docs/agents/run/automations"
      reason: >
        VS Code 1.138 notes say automations are enabled by default; current
        docs say off by default on Stable and on in Insiders, with gradual
        rollout. Check the installed build before describing availability.

  recipeReview:
    required: false
    question: >
      No section weighting, highlight, or centerpiece demo changes proposed.
      Keep the existing recipe and patch only the dated or misleading claims.

  validation:
    firstPartySourcesVerified: true
    readmePatched: true
    recipeApproved: true
    slidesRegenerated: false
    deckBuildPassed: true
