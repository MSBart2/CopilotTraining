  rationale: >
    Keep the already verified 1.144/Universe claims and inherited evidence, but
    organize them around four independent practitioner outcomes rather than a
    single responsive-login workflow: answer usefulness, continuity across
    environments and interruptions, bounded execution, and inspection of actual
    behavior and results. Place desktop computer use in execution control and
    keep the browser/login demonstration local to result inspection. Preserve
    GA/Preview/Experimental status, policy and plan boundaries, evidence status,
    and recovery. No new news research or capability expansion is authorized.
  userEmphasis:
    - "Find a Better Answer: Fusion, comparisons, explicit model choices, BYOK/local/gateway/utility/context, and useful visual input."
    - "Keep Work Moving: cloud/cross-client continuity, local/remote hosts, containers, and session state across interruptions."
    - "Delegate with Fewer Interruptions: worktree isolation versus shared chats, /btw/activity, assisted permissions, and approval-gated computer use."
    - "Check More Than the Code: browser tools, vision/screenshots/emulation, element feedback, diffs, and PR evidence."
    - "Use independent artifacts and demos; do not make one login task the talk-wide spine. The login browser example stays local to Part 4."
    - "Do not claim faster, better, or fewer outcomes without evidence; retain evidence status, limitations, sources, and failure/recovery."
    - "No shared-engine changes or edits to other talks."

  accepted:
    - title: "VS Code 1.144: cloud sessions and cross-client session continuity"
      published: "2026-10-28"
      source: "https://code.visualstudio.com/updates/v1_144"
      verified: "2026-10-31"
      releaseStatus: ga
      importance: headline
      targetSection: "Part 2: Keep Work Moving"
      action: expand
      summary: >
        Stable 1.144 lets a developer start a Cloud session from the editor or
        Agents window, reopen it from VS Code, GitHub.com, or GitHub Mobile, and
        continue the conversation while the task runs on GitHub infrastructure.
        The same release documents Agent Host as the session boundary for local
        and remote work, while the remote machine and Agent Host must remain
        running for remote sessions. The Universe announcement also describes
        continuity from Copilot CLI, the Copilot app, and sessions started in
        Slack or Teams.
        Slide mapping: revise host-owns-session, connect-remote-host, and
        choose-execution-place; propose a cloud-session-continuity proof slide.
      limitations:
        - "Cloud sessions use a separate workspace; local uncommitted changes are not copied automatically."
        - "Cloud sessions require a paid Copilot plan and remain subject to organization policy."
        - "Remote-machine sessions stop being reachable when the machine or Agent Host is not running."
      recipeImpact: restructure
      slideImpact: regenerate

    - title: "VS Code 1.144: Copilot Fusion is generally available"
      published: "2026-10-28"
      source: "https://code.visualstudio.com/updates/v1_144"
      verified: "2026-10-31"
      releaseStatus: ga
      importance: headline
      targetSection: "Part 1: Find a Better Answer"
      action: replace
      summary: >
        The model picker now offers Copilot Fusion, which chooses models,
        reasoning effort, and execution pattern per request. Standard, High,
        and Max expose a quality/cost choice without requiring a developer to
        select each underlying model. Copilot Fusion is billed for every model
        used; the 1.144 notes state a 30% paid-plan discount through 2026-11-30.
        The GitHub announcement confirms availability across VS Code, the
        Copilot app, Copilot CLI, and JetBrains IDEs.
        Slide mapping: revise choose-model-for-task and add-provider; propose
        a fusion-routing proof slide while retaining provider setup as an option.
      limitations:
        - "Fusion High and Max are limited to Pro+, Max, Business, and Enterprise plans in the 1.144 notes."
        - "The discount is time-limited and is not durable guidance."
        - "Model policy controls which models Fusion can use; routing is not a data-boundary guarantee."
      recipeImpact: restructure
      slideImpact: replace-demo

    - title: "VS Code 1.144: compare models and harnesses side by side"
      published: "2026-10-28"
      source: "https://code.visualstudio.com/updates/v1_144"
      verified: "2026-10-31"
      releaseStatus: preview
      importance: headline
      targetSection: "Part 1: Find a Better Answer"
      action: add
      summary: >
        Model comparisons run the same prompt across models and harnesses for
        side-by-side review, with a Judge and Synthesis path. Comparisons are
        enabled by default for eligible new Agents-window sessions unless
        settings or experiments override them. They also work without a project,
        Git remote, or initial commit in the expanded 1.144 flow.
        Slide mapping: revise bound-parallel-work and choose-model-for-task;
        propose a compare-model-results slide with human acceptance criteria.
      limitations:
        - "Model comparisons are not supported in Dev Containers."
        - "Availability depends on an eligible session and can be overridden by settings or experiments."
        - "Preview comparison output is evidence to inspect, not an automatic quality verdict."
      recipeImpact: revise
      slideImpact: regenerate

    - title: "VS Code 1.144: assisted permissions are generally available"
      published: "2026-10-28"
      source: "https://code.visualstudio.com/updates/v1_144"
      verified: "2026-10-31"
      releaseStatus: ga
      importance: supporting
      targetSection: "Part 3: Delegate with Fewer Interruptions"
      action: expand
      summary: >
        Assisted permissions use an LLM risk assessment to approve lower-risk
        tool calls automatically while keeping higher-risk or indeterminate
        calls for explicit confirmation. The user selects Assisted permissions
        in the permissions picker; Folder isolation is required.
        Slide mapping: expand separate-access-boundaries and review-pr-handoff
        to distinguish execution permissions from review of the resulting change.
      limitations:
        - "Organization policy can restrict assisted permissions."
        - "Automatic approval is a risk assessment, not human review of the result."
        - "Higher-risk or uncertain calls still require explicit confirmation."
      recipeImpact: confirm
      slideImpact: patch

    - title: "VS Code 1.144: computer use for desktop applications"
      published: "2026-10-28"
      source: "https://github.blog/changelog/2026-10-28-github-copilot-in-vs-code-universe-releases/"
      verified: "2026-10-31"
      releaseStatus: experimental
      importance: supporting
      targetSection: "Part 3: Delegate with Fewer Interruptions"
      action: add
      summary: >
        On macOS and Windows, a Copilot-harness session can use desktop
        applications when chat.agentHost.computerUse.enabled is enabled and
        /computer on is run. Each application action requires user approval.
        The capability extends the talk's evidence-boundary question beyond the
        integrated browser without replacing the browser validation proof.
        Slide mapping: expand inspect-browser-scope; propose a brief
        desktop-use-boundary slide if the recipe allocates time for it.
      limitations:
        - "Experimental; organizations can disable computer use through policy."
        - "Requires a local macOS or Windows Copilot-harness session and platform permissions."
        - "The agent can act on desktop applications, so the deck must show the approval boundary and recovery path."
      recipeImpact: confirm
      slideImpact: patch

