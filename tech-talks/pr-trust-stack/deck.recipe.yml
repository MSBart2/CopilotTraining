# REVIEW PENDING: An independent reviewer from a verified different model family is unavailable in this host.
version: 1

deck:
  title: "How to Trust an AI-Created PR"
  subtitle: "Who hands off work, where proof appears, and when a human can accept it"
  tagline: "Turn a bounded request and independent evidence into a human decision."

  agenda:
    - title: "Meet the people and the moment"
      takeaway: "See who prepares, executes, reviews, and accepts a draft in a normal workday."
      whyItMatters: "The five Ws make the operating strategy portable across repositories."
    - title: "Watch one quality-led handoff"
      takeaway: "Trace an existing empty-catch finding through a scoped issue, plan, and draft."
      whyItMatters: "A real failure and a narrow human decision give the tools meaningful work."
    - title: "Inspect independent proof"
      takeaway: "Read Copilot review, Code Quality, tests, and the changed runtime behavior."
      whyItMatters: "Each signal has a scope, owner, and next move for the accepting reviewer."

  arcToc: "Prepare the request → Inspect the draft → Run review and quality → Decide"
  arcNarrative: >
    Begin with a developer preparing one request and a teammate returning to a
    draft: establish who, what, when, where, and why before showing a workflow
    label. Open the worked trace with Code Quality's existing Home-page reliability
    finding, the visible failure, and the maintainer's Home-only scope decision.
    Follow the approved plan into draft 198 on ba0764f. Four passing component
    tests missed a static browser Retry; automatic Copilot review identified
    the inert click and disappearing alert. A PR-specific Code Quality scan
    separately identified a generic catch and four test-client disposal patterns.
    Show the human's red/green render-mode test, correction on edeadee, and
    mock-backed browser recovery without navigation. Use draft 197 only as
    an example of findings outside approved scope. Finish with a human decision, then
    transfer the method to a small pilot in the audience's repositories.

  sectionOrder:
    - "Prepare a Reviewable Request"
    - "Inspect the Agent's Draft"
    - "Put Review and Quality to Work"
    - "Make the Human Call"

  sectionModes:
    "Prepare a Reviewable Request":
      emphasis: high
      note: >
        Give the five Ws and an everyday practitioner situation time to land
        before showing issue IDs. Use a visual human-request-to-human-decision
        route. Show Code Quality's baseline empty-catch finding, the actual
        failed-home-page consequence, and the maintainer narrowing research
        from three pages to Home with a logged error and Retry.
    "Inspect the Agent's Draft":
      emphasis: medium
      note: >
        Name the approved plan, verified human approval event, one-draft limit,
        actual changed files, and head-specific checks. Contrast four author-reported
        passing tests and the Frontend build with the inert click in the real browser. Show the artifact
        and its scope before exploring tool settings.
    "Put Review and Quality to Work":
      emphasis: high
      note: >
        Protect substantial airtime for both tools: configuration and trigger,
        actual result, inspected code or rule, limits, and the next human action.
        Demonstrate Code Quality's Home.razor:332 reliability finding on main
        at 800c8ec, then its five PR-specific findings on ba0764f. Show
        Copilot's two first-head findings on draft 198 and the human's
        tested correction. A successful rerun on edeadee is scan completion,
        not a claim of zero new findings. Distinguish separate PR CodeQL
        code-scanning and missing coverage.
    "Make the Human Call":
      emphasis: medium
      note: >
        Give a reviewer a concrete decision card: approved scope, changed
        behavior, current-head checks, Copilot dispositions, Code Quality
        provenance, and the observed mock-backed 503 → Retry recovery.
        One original Copilot thread remains open despite the correction; a
        new-head Copilot review is not observed. Retain draft status until
        human acceptance. Offer a two-or-three-issue pilot and
        label 10-15 issues as a proposed capacity target.

  preamble: []
  appendix: []

  highlightMoments:
    - "An existing Code Quality reliability finding points to the Home page's silent API failure."
    - "A maintainer narrows a three-page research proposal to one page and an observable Retry."
    - "Four passing component tests miss an inert browser Retry; automatic Copilot review catches it."
    - "Code Quality flags five PR-specific patterns; a red/green test and browser recovery verify the human correction."

# OPEN DECISION: A verified different-model reviewer must critique weighting and narrative before this recipe is considered approved.
